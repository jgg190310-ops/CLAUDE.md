<style>
/* Em Dia · cada aba abre num painel azul-cobalto de azulejo modernista (Athos Bulcão); abaixo, cartões claros com ícones coloridos e anéis de progresso; cada dia completo vira um azulejo no mural do mês. */
:root {
  --bg: #F3F5FB;
  --surface: #FFFFFF;
  --surface-2: #F0F2F9;
  --ink: #0E1430;
  --ink-2: #464D6B;
  --muted: #5E6585;
  --line: #E4E7F0;
  --line-2: #CDD2E1;
  --cobalto: #2342C5;          /* azul de azulejo */
  --on-cobalto: #FFFFFF;
  --cobalto-2: #9AABF0;
  --cobalto-soft: #E7ECFD;
  --hero: #2342C5;
  --hero-2: #3557E0;
  --hero-vidro: rgba(255, 255, 255, .14);
  --hero-ink-2: rgba(255, 255, 255, .82);
  --sol: #FFC531;
  --sol-ink: #3D2C00;
  --folha: #0A7A50;
  --folha-forte: #17A86E;
  --folha-soft: #DDF5EA;
  --coral: #BE2E1B;
  --coral-forte: #E5533D;
  --coral-soft: #FFE4E1;
  --ambar: #9A5800;
  --ambar-soft: #FFF1D6;
  --ambar-mark: #F2A516;
  --agua: #1B8FD6;
  --b-cobalto: #E7ECFD; --i-cobalto: #2342C5;
  --b-ceu: #DFF1FC; --i-ceu: #0A6FAD;
  --b-folha: #DDF5EA; --i-folha: #0A7A50;
  --b-sol: #FFF1C7; --i-sol: #8A5F00;
  --b-laranja: #FFE9DA; --i-laranja: #B44F0A;
  --b-coral: #FFE4E1; --i-coral: #BE2E1B;
  --b-rosa: #FDE3F0; --i-rosa: #B3266F;
  --b-violeta: #EEE6FD; --i-violeta: #6435CC;
  --b-cinza: #EDEFF5; --i-cinza: #545B7A;
  --m-cobalto: #3557E0; --m-ceu: #1B8FD6; --m-folha: #17A86E; --m-sol: #F2A516; --m-laranja: #F07A1A; --m-coral: #E5533D; --m-rosa: #E0428F; --m-violeta: #8457E8; --m-cinza: #8A91AE;
  --sombra: 0 1px 2px rgba(14, 20, 48, .05), 0 10px 28px -12px rgba(14, 20, 48, .16);
  --sombra-forte: 0 14px 34px -12px rgba(14, 20, 48, .32);
  --veu: rgba(8, 12, 30, .5);
  --toast-bg: #0E1430;
  --toast-fg: #FFFFFF;
  --toast-acao: #FFC531;

  --f-display: "Jost", "Futura", "Century Gothic", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --r-card: 22px;
  --r-campo: 14px;
  --nav-h: 66px;
  --col: 560px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0D18; --surface: #141A2C; --surface-2: #1B2238; --ink: #EEF1FA; --ink-2: #B9C0D9; --muted: #8C94B2; --line: #252C44; --line-2: #343C58;
    --cobalto: #7C95FF; --on-cobalto: #0A0D18; --cobalto-2: #3F55B5; --cobalto-soft: #1C2550;
    --hero: #1D2F96; --hero-2: #2A40B8;
    --folha: #3DD68C; --folha-forte: #27B874; --folha-soft: #10301F; --coral: #FF7A6B; --coral-forte: #F0604A; --coral-soft: #3A1B1A;
    --ambar: #F5B347; --ambar-soft: #3A2A10; --agua: #4CB6F2;
    --b-cobalto: #1C2550; --i-cobalto: #8FA4FF; --b-ceu: #0F2A3B; --i-ceu: #6CC6F5; --b-folha: #10301F; --i-folha: #4FD898;
    --b-sol: #352B0A; --i-sol: #FFD15C; --b-laranja: #3A2312; --i-laranja: #FFA466; --b-coral: #3A1B1A; --i-coral: #FF8B7D;
    --b-rosa: #3A1730; --i-rosa: #FF8CC8; --b-violeta: #261A47; --i-violeta: #B79BFF; --b-cinza: #222840; --i-cinza: #A9B0CC;
    --m-cobalto: #7C95FF; --m-ceu: #4CB6F2; --m-folha: #3DD68C; --m-sol: #FFC531; --m-laranja: #FF9A52; --m-coral: #FF7A6B; --m-rosa: #FF7DBE; --m-violeta: #A98BFF; --m-cinza: #9AA1BD;
    --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7); --sombra-forte: 0 16px 36px -12px rgba(0, 0, 0, .8);
    --veu: rgba(0, 0, 0, .62); --toast-bg: #EEF1FA; --toast-fg: #0E1430; --toast-acao: #2342C5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0D18; --surface: #141A2C; --surface-2: #1B2238; --ink: #EEF1FA; --ink-2: #B9C0D9; --muted: #8C94B2; --line: #252C44; --line-2: #343C58;
  --cobalto: #7C95FF; --on-cobalto: #0A0D18; --cobalto-2: #3F55B5; --cobalto-soft: #1C2550;
  --hero: #1D2F96; --hero-2: #2A40B8;
  --folha: #3DD68C; --folha-forte: #27B874; --folha-soft: #10301F; --coral: #FF7A6B; --coral-forte: #F0604A; --coral-soft: #3A1B1A;
  --ambar: #F5B347; --ambar-soft: #3A2A10; --agua: #4CB6F2;
  --b-cobalto: #1C2550; --i-cobalto: #8FA4FF; --b-ceu: #0F2A3B; --i-ceu: #6CC6F5; --b-folha: #10301F; --i-folha: #4FD898;
  --b-sol: #352B0A; --i-sol: #FFD15C; --b-laranja: #3A2312; --i-laranja: #FFA466; --b-coral: #3A1B1A; --i-coral: #FF8B7D;
  --b-rosa: #3A1730; --i-rosa: #FF8CC8; --b-violeta: #261A47; --i-violeta: #B79BFF; --b-cinza: #222840; --i-cinza: #A9B0CC;
  --m-cobalto: #7C95FF; --m-ceu: #4CB6F2; --m-folha: #3DD68C; --m-sol: #FFC531; --m-laranja: #FF9A52; --m-coral: #FF7A6B; --m-rosa: #FF7DBE; --m-violeta: #A98BFF; --m-cinza: #9AA1BD;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 30px -14px rgba(0, 0, 0, .7); --sombra-forte: 0 16px 36px -12px rgba(0, 0, 0, .8);
  --veu: rgba(0, 0, 0, .62); --toast-bg: #EEF1FA; --toast-fg: #0E1430; --toast-acao: #2342C5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html.com-folha, html.com-folha body { overflow: hidden; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid var(--cobalto); outline-offset: 2px; }
.hero :focus-visible { outline-color: #FFFFFF; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }
.sub { font-size: .875rem; color: var(--muted); }
.sub strong { color: var(--ink); font-weight: 700; }
.sub em { font-style: normal; font-weight: 700; color: var(--ink-2); }

/* estrutura */
.app { max-width: var(--col); margin: 0 auto; padding-bottom: calc(var(--nav-h) + 44px + env(safe-area-inset-bottom, 0px)); }
main { display: block; outline: none; }
.conteudo { display: grid; gap: 14px; padding-inline: 16px; padding-block: 0 8px; }
.carregando { padding: 28px 0; color: var(--muted); text-align: center; }
.secao-tit { margin: 8px 4px -2px; font-family: var(--f-display); font-weight: 600; font-size: 1.125rem; }

/* painel azul do topo */
.hero { position: relative; isolation: isolate; overflow: hidden; color: #FFFFFF; background: var(--hero); padding: 14px 20px 54px; border-radius: 0 0 30px 30px; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(110% 80% at 100% 0%, var(--hero-2) 0%, transparent 62%); }
.hero-deco { position: absolute; z-index: -1; top: -14px; right: -14px; width: 168px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; opacity: .17; pointer-events: none; }
.hero-deco .azulejo { --az-fundo: rgba(255, 255, 255, .4); --az-motivo: #FFFFFF; }
.hero-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.hero-saud { font-weight: 600; font-size: .9375rem; color: var(--hero-ink-2); }
.hero-acoes { display: flex; align-items: center; gap: 8px; }
.hero-btn { width: 42px; height: 42px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: 14px; background: var(--hero-vidro); color: #FFFFFF; }
.hero-btn .ic { width: 22px; height: 22px; }
.hero-btn.sm { width: 36px; height: 36px; border-radius: 12px; }
.hero-btn.sm .ic { width: 20px; height: 20px; }
.hero-btn:hover { background: rgba(255, 255, 255, .22); }
.hero-titulo { font-weight: 600; font-size: 1.75rem; line-height: 1.12; letter-spacing: -.01em; color: #FFFFFF; }
.hero-tit-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.hero-nav { display: flex; align-items: center; gap: 6px; flex: none; }
.hero-sub { margin-top: 6px; font-size: .875rem; color: var(--hero-ink-2); }
.hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 8px; font-size: .875rem; color: var(--hero-ink-2); }
.hero-sub strong { color: #FFFFFF; }
.hero-pilula { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--hero-vidro); color: #FFFFFF; font-weight: 700; font-size: .8125rem; }
.hero-pilula.sol { background: var(--sol); color: var(--sol-ink); }
.pilula-ex::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sol); }
.lua-rot { display: inline-flex; align-items: center; gap: 6px; }
.hero .lua-sombra { fill: rgba(255, 255, 255, .25); }
.hero .lua-luz { fill: #FFFFFF; }
.hero-dia { display: flex; align-items: center; gap: 16px; margin-top: 16px; padding: 14px 16px 14px 14px; border-radius: 24px; background: var(--hero-vidro); }
.hero-dia .anel { --anel-trilho: rgba(255, 255, 255, .22); --anel-cor: #FFFFFF; }
.hero-dia .anel.completo { --anel-cor: var(--sol); }
.hero-dia-txt { flex: 1; min-width: 0; }
.hero-dia-tit { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; line-height: 1.2; }
.hero-dia-sub { margin-top: 2px; font-size: .875rem; color: var(--hero-ink-2); }
.hero-dia-az { width: 44px; height: 44px; flex: none; }
.hero-dia-az .azulejo { width: 100%; height: 100%; --az-fundo: #FFFFFF; --az-motivo: var(--hero); }
.hero-dia.festa .hero-dia-az { animation: assentar .55s cubic-bezier(.2, .9, .25, 1.2) both; }
.hero-rot { margin-top: 14px; font-weight: 700; font-size: .875rem; color: var(--hero-ink-2); }
.hero .valor-grande, .hero .valor-grande .vg-rs, .hero .valor-grande .vg-cent { color: #FFFFFF; }
.hero .valor-grande.ruim .vg-int, .hero .valor-grande.ruim .vg-rs, .hero .valor-grande.ruim .vg-cent { color: #FFD4CC; }
.mes-nav { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.mes-nome { min-width: 9.5em; text-align: center; font-weight: 700; font-size: .9375rem; }
.mes-nome::first-letter { text-transform: uppercase; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.trio-i { display: grid; gap: 4px; min-width: 0; padding: 10px 12px; border-radius: 16px; background: var(--hero-vidro); }
.trio-i span { display: flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 700; color: var(--hero-ink-2); }
.trio-i span .ic { width: 15px; height: 15px; }
.trio-i b { font-family: var(--f-display); font-weight: 600; font-size: .9375rem; color: #FFFFFF; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

.semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 14px; }
.sd { display: grid; justify-items: center; gap: 3px; min-width: 0; padding: 8px 0 7px; border: 0; border-radius: 16px; background: transparent; color: #FFFFFF; }
.sd:hover { background: rgba(255, 255, 255, .08); }
.sd-ini { font-size: .6875rem; font-weight: 700; opacity: .78; }
.sd-num { font-family: var(--f-display); font-weight: 600; font-size: 1.125rem; line-height: 1; }
.sd.verm .sd-num { color: var(--sol); }
.sd.hoje { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .45); }
.sd[aria-pressed="true"] { background: #FFFFFF; color: var(--hero); box-shadow: none; }
.sd[aria-pressed="true"].verm .sd-num { color: #C9341F; }
.sd-az { width: 14px; height: 14px; display: grid; place-items: center; }
.sd-az .azulejo { width: 14px; height: 14px; --az-fundo: #FFFFFF; --az-motivo: var(--hero); }
.sd[aria-pressed="true"] .sd-az .azulejo { --az-fundo: var(--hero); --az-motivo: #FFFFFF; }
.sd-ponto { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .55; }

.mural { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 14px; }
.mural-sem { padding-bottom: 2px; text-align: center; font-size: .6875rem; font-weight: 700; color: var(--hero-ink-2); }
.mural-dia { position: relative; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; padding: 0; border: 0; border-radius: 7px; background: rgba(255, 255, 255, .1); color: rgba(255, 255, 255, .72); font: 600 .75rem/1 var(--f-display); }
.mural-dia.vazio { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .22); }
.mural-dia.parcial { background: rgba(255, 255, 255, .28); color: #FFFFFF; }
.mural-dia.futuro { background: rgba(255, 255, 255, .06); color: rgba(255, 255, 255, .42); }
.mural-dia.hoje { box-shadow: inset 0 0 0 2px var(--sol); }
.mural-dia .azulejo { position: absolute; inset: 0; width: 100%; height: 100%; --az-fundo: #FFFFFF; --az-motivo: var(--hero); }
.azulejo { display: block; }
.az-fundo { fill: var(--az-fundo, #FFFFFF); }
.az-motivo { fill: var(--az-motivo, #2342C5); }

/* cartões */
.card { display: grid; gap: 14px; min-width: 0; padding: 18px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--sombra); }
.sobe { position: relative; z-index: 2; margin-top: -38px; }
.card-cab { display: flex; align-items: center; gap: 12px; min-width: 0; }
.card-cab h2 { flex: 1; min-width: 0; font-weight: 600; font-size: 1.1875rem; line-height: 1.2; }
.card-cab h2 label { cursor: text; }
.card-extra { font-weight: 700; font-size: .875rem; color: var(--ink-2); }
.bolha { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 14px; background: var(--b); color: var(--i); }
.bolha .ic { width: 22px; height: 22px; }
.bolha.sm { width: 36px; height: 36px; border-radius: 12px; }
.bolha.sm .ic { width: 19px; height: 19px; }
.bolha.xs { width: 30px; height: 30px; border-radius: 10px; }
.bolha.xs .ic { width: 17px; height: 17px; }
.t-cobalto { --b: var(--b-cobalto); --i: var(--i-cobalto); --m: var(--m-cobalto); }
.t-ceu { --b: var(--b-ceu); --i: var(--i-ceu); --m: var(--m-ceu); }
.t-folha { --b: var(--b-folha); --i: var(--i-folha); --m: var(--m-folha); }
.t-sol { --b: var(--b-sol); --i: var(--i-sol); --m: var(--m-sol); }
.t-laranja { --b: var(--b-laranja); --i: var(--i-laranja); --m: var(--m-laranja); }
.t-coral { --b: var(--b-coral); --i: var(--i-coral); --m: var(--m-coral); }
.t-rosa { --b: var(--b-rosa); --i: var(--i-rosa); --m: var(--m-rosa); }
.t-violeta { --b: var(--b-violeta); --i: var(--i-violeta); --m: var(--m-violeta); }
.t-cinza { --b: var(--b-cinza); --i: var(--i-cinza); --m: var(--m-cinza); }
.sep { height: 1px; background: var(--line); }
.grupo { font-size: .75rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.grupo.vermelho { color: var(--coral); }
.vazio-linha { font-size: .875rem; color: var(--muted); }
.link { display: inline-flex; align-items: center; gap: 2px; flex: none; padding: 6px 0 6px 6px; border: 0; background: none; color: var(--cobalto); font-weight: 700; font-size: .875rem; }
.link .ic { width: 17px; height: 17px; }
.exemplo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.exemplo .ex-txt { flex: 1 1 200px; min-width: 0; }
.ex-tit { font-weight: 700; }
.aviso-armazem { padding: 12px 16px; border-radius: 16px; background: var(--cobalto-soft); color: var(--ink); font-size: .875rem; }
.vazio { justify-items: start; }
.vazio-tit { font-family: var(--f-display); font-weight: 600; font-size: 1.1875rem; }

/* linhas */
.lista { display: grid; }
.item { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 0; }
.item + .item { border-top: 1px solid var(--line); }
.item-txt { flex: 1; min-width: 0; display: grid; gap: 2px; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.item-tit { font-weight: 600; overflow-wrap: anywhere; }
.item-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: .8125rem; color: var(--muted); }
.item.feita .item-tit { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.item-dir { flex: none; display: grid; justify-items: end; gap: 6px; }
.lanc { width: 100%; padding: 8px 0; border: 0; background: none; color: inherit; text-align: left; }
.ck { position: relative; flex: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); color: transparent; transition: background-color .18s, border-color .18s; }
.ck::after { content: ""; position: absolute; inset: -7px; }
.ck .ic { width: 18px; height: 18px; stroke-width: 2.8; }
.ck.quadrado { border-radius: 10px; }
.ck[aria-pressed="true"] { background: var(--cobalto); border-color: var(--cobalto); color: var(--on-cobalto); }
.ck.pop { animation: pop .3s ease; }
.ck:active { transform: scale(.92); }
.sequencia { flex: none; display: inline-flex; align-items: center; gap: 3px; padding: 4px 9px 4px 7px; border-radius: 999px; background: var(--b-laranja); color: var(--i-laranja); font-weight: 800; font-size: .8125rem; }
.sequencia .ic { width: 15px; height: 15px; }
.hora { flex: none; padding: 3px 8px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-weight: 700; font-size: .8125rem; font-variant-numeric: tabular-nums; }
.pontos { display: flex; gap: 6px; margin-top: 6px; }
.ponto { display: grid; justify-items: center; gap: 3px; }
.ponto i { font-style: normal; font-size: .625rem; font-weight: 800; color: var(--muted); }
.ponto::after { content: ""; width: 15px; height: 15px; border-radius: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.ponto.feito::after { background: var(--cobalto); box-shadow: none; }
.ponto.hoje::after { box-shadow: inset 0 0 0 2px var(--cobalto); background: transparent; }
.ponto.fora::after { background: transparent; box-shadow: inset 0 0 0 1px var(--line); opacity: .6; }
.atraso { display: grid; gap: 4px; padding: 12px 14px; border-radius: 16px; background: var(--coral-soft); }
.atraso .item + .item { border-top-color: rgba(190, 46, 27, .18); }
.selo { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 800; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.selo .ic { width: 13px; height: 13px; stroke-width: 2.8; }
.selo-atrasada, .selo-ruim { background: var(--coral-soft); color: var(--coral); }
.selo-hoje, .selo-logo, .selo-meio { background: var(--ambar-soft); color: var(--ambar); }
.selo-ok, .selo-paga { background: var(--folha-soft); color: var(--folha); }
.selo.pop { animation: pop .35s ease; }
.valor { flex: none; font-weight: 700; font-size: .9375rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.valor.pos { color: var(--folha); }

/* números grandes */
.valor-grande { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 0; font-family: var(--f-display); font-weight: 600; line-height: 1; letter-spacing: -.02em; color: var(--ink); }
.vg-rs { margin-right: 7px; font-size: 1.125rem; color: var(--ink-2); }
.vg-int { font-size: 2.75rem; }
.vg-cent { font-size: 1.375rem; color: var(--ink-2); }
.valor-grande.ruim, .valor-grande.ruim .vg-rs, .valor-grande.ruim .vg-cent { color: var(--coral); }
.valor-grande.medio .vg-int { font-size: 2rem; }
.valor-grande.medio .vg-cent { font-size: 1.125rem; }

/* barras e anéis */
.barra { position: relative; display: flex; gap: 2px; height: 10px; overflow: hidden; border-radius: 999px; background: var(--cobalto-soft); }
.barra > span { display: block; flex: none; height: 100%; border-radius: 999px; background: var(--cobalto); }
.barra > span.pend { opacity: .4; }
.barra.ok { background: var(--folha-soft); }
.barra.ok > span:first-child { background: var(--folha-forte); }
.barra.aviso { background: var(--ambar-soft); }
.barra.aviso > span:first-child { background: var(--ambar-mark); }
.barra.g-des { background: var(--b-rosa); }
.barra.g-des > span { background: var(--i-rosa); }
.barra.g-fut { background: var(--folha-soft); }
.barra.g-fut > span { background: var(--folha-forte); }
.barra.estouro { background: var(--coral-soft); }
.barra.estouro > span { background: var(--coral-forte); }
.barra > i.alvo { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
.barra-rot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 10px; font-size: .875rem; color: var(--ink-2); }
.barra-rot strong { color: var(--ink); }
.anel { position: relative; flex: none; --anel-trilho: var(--cobalto-soft); --anel-cor: var(--cobalto); }
.anel svg { display: block; width: 100%; height: 100%; }
.anel-trilho { fill: none; stroke: var(--anel-trilho); }
.anel-prog { fill: none; stroke: var(--anel-cor); stroke-linecap: round; }
.anel-centro { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; line-height: 1; }
.anel-centro b { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; }
.anel-centro small { margin-top: 2px; font-size: .6875rem; font-weight: 600; opacity: .85; }
.anel-centro .ic { width: 24px; height: 24px; }
.anel.anel-agua { --anel-trilho: var(--b-ceu); --anel-cor: var(--agua); color: var(--agua); }

/* botões, chips, campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 16px; background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: .9375rem; white-space: nowrap; }
.btn .ic { width: 19px; height: 19px; }
.btn:hover { filter: brightness(.97); }
.btn-pri { background: var(--cobalto); color: var(--on-cobalto); box-shadow: 0 8px 18px -10px rgba(35, 66, 197, .85); }
.btn-pri:hover { filter: brightness(1.07); }
.btn-sec { background: var(--cobalto-soft); color: var(--cobalto); }
.btn-perigo { background: var(--coral-forte); color: #FFFFFF; }
.btn-txt { padding: 0 10px; background: transparent; color: var(--cobalto); }
.btn-txt.perigo { color: var(--coral); }
.btn-sm { min-height: 38px; padding: 0 14px; border-radius: 12px; font-size: .875rem; }
.btn-largo { width: 100%; }
.btn-icone { width: 42px; height: 42px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: 13px; background: var(--surface-2); color: var(--ink-2); }
.btn-icone .ic { width: 22px; height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-weight: 600; font-size: .875rem; }
.chip .ic { width: 16px; height: 16px; color: var(--cobalto); }
.chip[aria-pressed="true"] { border-color: var(--cobalto); background: var(--cobalto-soft); color: var(--cobalto); }
.chip-r, .cat-op { position: relative; display: inline-flex; }
.chip-r input, .cat-op input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip-r span { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; font-size: .875rem; }
.cat-op-in { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 12px 4px 5px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 600; font-size: .875rem; }
.chip-r input:checked + span, .cat-op input:checked + .cat-op-in { border-color: var(--cobalto); background: var(--cobalto-soft); color: var(--cobalto); }
.chip-r input:focus-visible + span, .cat-op input:focus-visible + .cat-op-in { outline: 2px solid var(--cobalto); outline-offset: 2px; }
.campo-pill { display: flex; align-items: center; gap: 8px; padding: 5px 5px 5px 14px; border: 1.5px solid transparent; border-radius: 16px; background: var(--surface-2); }
.campo-pill:focus-within { border-color: var(--cobalto); background: var(--surface); }
.campo-pill > .ic { width: 20px; height: 20px; color: var(--muted); }
.campo-pill input { flex: 1; width: 100%; min-width: 0; padding: 9px 0; border: 0; background: transparent; outline: none; font-size: 1rem; color: var(--ink); }
.campo-pill input::placeholder { color: var(--muted); opacity: 1; }
.campo-pill .btn-ir { flex: none; width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 12px; background: var(--cobalto); color: var(--on-cobalto); }
.campo-pill .btn-ir .ic { width: 20px; height: 20px; stroke-width: 2.4; }
.previa { min-height: 1.3em; margin-top: 6px; padding-left: 4px; }
.entrada { display: block; width: 100%; min-height: 50px; padding: 0 14px; border: 1.5px solid transparent; border-radius: var(--r-campo); background: var(--surface-2); color: var(--ink); font-size: 1rem; }
textarea.entrada { min-height: 84px; padding: 12px 14px; line-height: 1.45; resize: vertical; }
.entrada::placeholder { color: var(--muted); opacity: 1; }
.entrada:focus { outline: none; border-color: var(--cobalto); background: var(--surface); }
.campo { display: grid; gap: 8px; min-width: 0; margin: 0; padding: 0; border: 0; }
.campo > label, .campo > legend { padding: 0; font-size: .875rem; font-weight: 700; color: var(--ink-2); }
fieldset.campo > legend { margin-bottom: 8px; }
.opcional { font-weight: 500; color: var(--muted); }
.linha-campos { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.linha-campos > .entrada { flex: 1 1 160px; }
.valor-campo { display: grid; justify-items: center; gap: 2px; padding: 14px 12px 12px; border-radius: 20px; background: var(--surface-2); border: 1.5px solid transparent; }
.valor-campo:focus-within { border-color: var(--cobalto); background: var(--surface); }
.valor-campo label { font-size: .8125rem; font-weight: 700; color: var(--muted); }
.vc-linha { display: flex; align-items: baseline; justify-content: center; gap: 6px; max-width: 100%; }
.vc-rs { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; color: var(--ink-2); }
.valor-campo input { width: 7ch; min-width: 0; padding: 0; border: 0; background: transparent; outline: none; font-family: var(--f-display); font-weight: 600; font-size: 2.5rem; color: var(--ink); text-align: left; }
@supports (field-sizing: content) { .valor-campo input { field-sizing: content; width: auto; min-width: 3.4ch; max-width: 11ch; } }
.valor-campo input::placeholder { color: var(--line-2); opacity: 1; }
.dois { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini { display: grid; gap: 5px; min-width: 0; font-size: .75rem; font-weight: 700; color: var(--ink-2); }
.mini-in { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--muted); }
.mini-in .entrada { min-height: 44px; padding: 0 10px; }
.erro-campo { color: var(--coral); font-size: .875rem; font-weight: 700; }

/* segmentos */
.segmentos { display: flex; gap: 4px; padding: 5px; overflow-x: auto; scrollbar-width: none; border-radius: 18px; background: var(--surface); box-shadow: var(--sombra); }
.segmentos::-webkit-scrollbar { display: none; }
.segmento { flex: 1 0 auto; min-height: 40px; padding: 0 14px; border: 0; border-radius: 13px; background: transparent; color: var(--muted); font-weight: 700; font-size: .875rem; white-space: nowrap; }
.segmento[aria-selected="true"] { background: var(--cobalto); color: var(--on-cobalto); }

/* saúde */
.agua { display: flex; align-items: center; gap: 16px; }
.agua-txt { flex: 1; min-width: 0; display: grid; gap: 4px; }
.mini-tit { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.mini-tit .ic { width: 18px; height: 18px; color: var(--muted); }
.agua-val { font-size: .9375rem; color: var(--muted); }
.agua-val b { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; color: var(--ink); }
.agua-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.saude-dupla { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.mini-bloco { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: 18px; background: var(--surface-2); }
.passo { display: flex; align-items: center; gap: 10px; }
.passo-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 1.375rem; font-weight: 700; line-height: 1; box-shadow: var(--sombra); }
.passo-valor { min-width: 4.4ch; text-align: center; font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; }
.humores { display: flex; flex-wrap: wrap; gap: 6px; }
.humor { width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 14px; background: var(--surface); color: var(--muted); box-shadow: var(--sombra); }
.humor .face { width: 28px; height: 28px; }
.humor[aria-pressed="true"].h1 { background: var(--b-coral); color: var(--i-coral); }
.humor[aria-pressed="true"].h2 { background: var(--b-laranja); color: var(--i-laranja); }
.humor[aria-pressed="true"].h3 { background: var(--b-sol); color: var(--i-sol); }
.humor[aria-pressed="true"].h4 { background: var(--b-ceu); color: var(--i-ceu); }
.humor[aria-pressed="true"].h5 { background: var(--b-folha); color: var(--i-folha); }
.humor[aria-pressed="true"] { box-shadow: inset 0 0 0 2px currentColor; }
.face { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
.face .olho { fill: currentColor; stroke: none; }
.copos { display: flex; flex-wrap: wrap; gap: 2px; }
.copo { width: 36px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--line-2); }
.copo:hover { background: var(--surface-2); }
.copo-ic { width: 28px; height: 28px; }
.copo-borda { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.copo-agua { fill: transparent; }
.copo.cheio { color: var(--agua); }
.copo.cheio .copo-agua { fill: var(--agua); }
.aneis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.anel-rot { display: grid; justify-items: center; gap: 4px; text-align: center; }
.anel-rot .anel { --anel-trilho: rgba(255, 255, 255, .2); --anel-cor: #FFFFFF; color: #FFFFFF; }
.anel-rot .anel.r-agua { --anel-cor: #8FD8FF; }
.anel-rot .anel.r-sono { --anel-cor: #D2C4FF; }
.anel-rot .anel.r-ex { --anel-cor: var(--sol); }
.anel-val { margin-top: 4px; font-family: var(--f-display); font-weight: 600; font-size: 1.0625rem; }
.anel-sub { font-size: .75rem; color: var(--hero-ink-2); }
.nota-fonte { font-size: .75rem; color: var(--muted); }

/* dinheiro */
.checklist { display: grid; margin: 0; padding: 0; list-style: none; }
.ck-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; }
.ck-item + .ck-item { border-top: 1px solid var(--line); }
.ck-ic { flex: none; width: 24px; height: 24px; margin-top: 1px; }
.ck-ic svg { display: block; width: 24px; height: 24px; }
.ck-ok .ck-ic { color: var(--folha-forte); }
.ck-meio .ck-ic { color: var(--ambar-mark); }
.ck-ruim .ck-ic { color: var(--coral-forte); }
.ck-neutro .ck-ic { color: var(--muted); }
.ck-txt { display: grid; gap: 1px; min-width: 0; }
.ck-tit { font-weight: 700; }
.ck-det { font-size: .8125rem; color: var(--muted); }
.st-fundo { fill: currentColor; }
.st-traco { fill: none; stroke: var(--surface); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.st-borda { fill: none; stroke: currentColor; stroke-width: 2; }
.st-meio { fill: currentColor; }
.st-x { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.plano { display: grid; gap: 18px; }
.plano-linha { display: grid; gap: 7px; }
.legenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: .75rem; color: var(--muted); }
.leg { display: inline-flex; align-items: center; gap: 6px; }
.leg::before { content: ""; width: 14px; height: 8px; border-radius: 4px; background: var(--ink-2); }
.leg.pend::before { opacity: .35; }
.leg.alvo::before { width: 2px; height: 12px; border-radius: 0; background: var(--ink); }
.cats { display: grid; gap: 14px; }
.cat-linha { display: flex; align-items: center; gap: 12px; }
.cat-meio { flex: 1; min-width: 0; display: grid; gap: 6px; }
.cat-topo { display: flex; justify-content: space-between; gap: 10px; }
.cat-nome { font-weight: 600; overflow-wrap: anywhere; }
.cat-nome::first-letter { text-transform: uppercase; }
.cat-val { flex: none; font-weight: 700; font-size: .875rem; font-variant-numeric: tabular-nums; }
.cat-val small { margin-left: 4px; font-weight: 600; color: var(--muted); }
.cat-trilho { height: 7px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
.cat-trilho > span { display: block; height: 100%; border-radius: 999px; background: var(--m, var(--cobalto)); }
.cat-trilho > span.ok { background: var(--folha-forte); }
.faixa-salario { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.busca { margin-bottom: -2px; background: var(--surface); box-shadow: var(--sombra); }
.busca:focus-within { background: var(--surface); }
.dia-cab { display: flex; justify-content: space-between; gap: 8px; margin: 6px 6px -4px; font-size: .875rem; font-weight: 700; color: var(--ink-2); }
.dia-cab span:first-child::first-letter { text-transform: uppercase; }
.resumo-contas { display: grid; gap: 10px; }
.caixinha { gap: 12px; }
.caixinha-cab { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.caixinha-nome { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 600; font-size: 1.125rem; overflow-wrap: anywhere; }
.caixinha-cab > .ic { width: 20px; height: 20px; color: var(--muted); }
.caixinha-acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.ia-texto { display: grid; gap: 8px; line-height: 1.5; }
.ia-texto ul { display: grid; gap: 8px; margin: 0; padding-left: 1.2em; }
.ia-texto li::marker { color: var(--cobalto); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { display: grid; gap: 3px; align-content: start; min-width: 0; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--sombra); }
.stat-rot { display: flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 700; color: var(--muted); }
.stat-rot .ic { width: 16px; height: 16px; color: var(--m, var(--muted)); }
.stat b { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; line-height: 1.15; overflow-wrap: anywhere; }
.stat small { font-size: .75rem; color: var(--muted); }
.stats-mini { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats-mini .stat { box-shadow: none; background: var(--surface-2); padding: 10px; }
.stats-mini .stat b { font-size: 1.25rem; }

/* gráficos */
.grafico { margin: 0; }
.graf-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.graf-tit { font-family: var(--f-display); font-weight: 600; font-size: 1.0625rem; }
.graf-sub { font-size: .75rem; color: var(--muted); }
.graf { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--f-body); }
.graf-base { stroke: var(--line-2); stroke-width: 1; }
.graf-grade { stroke: var(--line); stroke-width: 1; }
.graf-meta { stroke: var(--ink-2); stroke-width: 1.25; stroke-dasharray: 4 4; opacity: .7; }
.graf-meta-txt { fill: var(--ink-2); font-size: 11px; font-weight: 700; }
.graf-barra { fill: var(--cobalto-2); }
.graf-barra.sel { fill: var(--cobalto); }
.graf-pos { fill: var(--folha-forte); }
.graf-neg { fill: var(--coral-forte); }
.graf-pos.parcial, .graf-neg.parcial { fill-opacity: .45; }
.graf-linha { fill: none; stroke: var(--cobalto); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.graf-ponto { fill: var(--cobalto); stroke: var(--surface); stroke-width: 2; }
.graf-valor { fill: var(--ink); font-size: 12px; font-weight: 800; }
.graf-eixo { fill: var(--muted); font-size: 11px; font-weight: 600; }
.graf-eixo.sel { fill: var(--ink); font-weight: 800; }
.graf-valor, .graf-meta-txt, .graf-eixo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.graf-alvo { fill: transparent; outline: none; }
.graf-alvo:hover { fill: var(--ink); fill-opacity: .04; }
.graf-alvo:focus-visible { fill: var(--cobalto); fill-opacity: .12; }
.tabela-rolagem { overflow-x: auto; }
.tabela { width: 100%; border-collapse: collapse; font-size: .875rem; }
.tabela th, .tabela td { padding: 8px 4px; text-align: left; border-bottom: 1px solid var(--line); }
.tabela th { font-size: .75rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tabela .num { text-align: right; font-variant-numeric: tabular-nums; }
.humor-semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.hs-dia { display: grid; justify-items: center; gap: 4px; }
.hs-face { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: var(--surface-2); color: var(--muted); }
.hs-face.h1 { background: var(--b-coral); color: var(--i-coral); }
.hs-face.h2 { background: var(--b-laranja); color: var(--i-laranja); }
.hs-face.h3 { background: var(--b-sol); color: var(--i-sol); }
.hs-face.h4 { background: var(--b-ceu); color: var(--i-ceu); }
.hs-face.h5 { background: var(--b-folha); color: var(--i-folha); }
.hs-face .face { width: 26px; height: 26px; }
.hs-rot { font-size: .6875rem; font-weight: 700; color: var(--muted); }
.hs-dia.sel .hs-rot { color: var(--ink); font-weight: 800; }

/* navegação de baixo */
.nav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: calc(var(--col) - 24px); height: var(--nav-h); margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: var(--sombra-forte); }
.nav-item { display: grid; justify-items: center; gap: 3px; padding: 6px 0; border: 0; background: none; color: var(--muted); font: 700 .6875rem/1.1 var(--f-body); }
.nav-ic { display: grid; place-items: center; width: 48px; height: 30px; border-radius: 12px; }
.nav-ic .ic { width: 23px; height: 23px; }
.nav-item[aria-current="page"] { color: var(--cobalto); }
.nav-item[aria-current="page"] .nav-ic { background: var(--cobalto-soft); }
.nav-mais { justify-self: center; width: 58px; height: 58px; margin-top: -30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 20px; background: var(--cobalto); color: var(--on-cobalto); box-shadow: 0 0 0 5px var(--surface), 0 12px 24px -8px rgba(35, 66, 197, .75); }
.nav-mais .ic { width: 28px; height: 28px; stroke-width: 2.4; }
.nav-mais:active { transform: scale(.95); }

/* folhas (formulários que sobem) */
#folha-raiz { position: fixed; inset: 0; z-index: 50; }
.veu { position: absolute; inset: 0; background: var(--veu); animation: aparecer .18s ease-out; }
.folha { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; overflow: hidden; max-width: var(--col); max-height: 92vh; max-height: calc(100dvh - 12px - env(safe-area-inset-top, 0px)); margin-inline: auto; padding-top: 8px; border-radius: 28px 28px 0 0; background: var(--surface); box-shadow: 0 -16px 48px -16px rgba(0, 0, 0, .35); animation: subir .28s cubic-bezier(.2, .9, .25, 1); }
@media (min-width: 640px) { .folha { bottom: 24px; border-radius: 28px; max-height: calc(100dvh - 48px); } }
.folha-alca { flex: none; width: 44px; height: 5px; margin: 2px auto 8px; border-radius: 3px; background: var(--line-2); }
.folha-cab { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px 8px 20px; }
.folha-cab h2 { font-weight: 600; font-size: 1.5rem; line-height: 1.15; overflow-wrap: anywhere; }
#folha-form { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; margin: 0; }
.folha-corpo { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: grid; grid-auto-rows: max-content; align-content: start; gap: 20px; padding: 6px 20px 20px; }
.alternar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface-2); }
.alternar label { position: relative; display: grid; }
.alternar input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.alternar span { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; border-radius: 12px; color: var(--muted); font-weight: 700; font-size: .9375rem; }
.alternar span .ic { width: 18px; height: 18px; }
.alternar input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14, 20, 48, .08), 0 4px 10px -4px rgba(14, 20, 48, .2); }
.alternar input:checked + span .ic { color: var(--m, var(--cobalto)); }
.alternar input:focus-visible + span { outline: 2px solid var(--cobalto); outline-offset: 2px; }
.folha-corpo:last-child { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.folha-acoes { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.folha-acoes .btn-pri { flex: 1; }
.grade-add { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.add-op { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 12px; border: 0; border-radius: 18px; background: var(--surface-2); font-weight: 700; text-align: left; }
.dias-semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dia-sem { position: relative; display: grid; }
.dia-sem input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.dia-sem span[aria-hidden] { display: grid; place-items: center; aspect-ratio: 1; border-radius: 12px; background: var(--surface-2); font-family: var(--f-display); font-weight: 600; }
.dia-sem input:checked + span { background: var(--cobalto); color: var(--on-cobalto); }
.dia-sem input:focus-visible + span { outline: 2px solid var(--cobalto); outline-offset: 2px; }
.grade-mes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; text-align: center; }
.gm-sem { padding-bottom: 2px; font-size: .6875rem; font-weight: 800; color: var(--muted); }
.gm-dia { position: relative; display: grid; place-items: center; aspect-ratio: 1; max-width: 100%; border-radius: 8px; background: var(--surface-2); font-family: var(--f-display); font-weight: 600; font-size: .875rem; color: var(--ink-2); }
.gm-dia.feito { color: transparent; background: none; }
.gm-dia.feito .azulejo { position: absolute; inset: 0; width: 100%; height: 100%; --az-fundo: var(--cobalto); --az-motivo: var(--surface); }
.gm-dia.falhou { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.gm-dia.hoje { box-shadow: inset 0 0 0 2px var(--cobalto); }
.gm-dia.fora, .gm-dia.futuro { color: var(--muted); }
.gm-dia.fora { opacity: .45; }
.gm-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.aviso-pago { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--folha-soft); color: var(--folha); font-weight: 700; font-size: .875rem; }
.aviso-pago .btn { color: var(--ink); background: var(--surface); }
.nota-vinculo { padding: 12px 14px; border-radius: 16px; background: var(--surface-2); font-size: .875rem; color: var(--ink-2); display: grid; gap: 10px; justify-items: start; }
.dados { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
.dados h3 { font-weight: 600; font-size: 1.0625rem; }
.acoes-dados { display: flex; flex-wrap: wrap; gap: 8px; }
.texto-backup { min-height: 160px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .75rem; }

.toast-raiz { position: fixed; z-index: 60; left: 0; right: 0; bottom: calc(var(--nav-h) + 30px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; padding-inline: 16px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 14px; max-width: 520px; padding: 12px 12px 12px 18px; border-radius: 18px; background: var(--toast-bg); color: var(--toast-fg); font-weight: 600; font-size: .875rem; box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .5); animation: subir .2s ease-out; }
.toast button { min-height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: none; color: var(--toast-acao); font-weight: 800; }
.dica { position: fixed; z-index: 70; max-width: 240px; padding: 8px 11px; border-radius: 12px; background: var(--toast-bg); color: var(--toast-fg); font-size: .75rem; line-height: 1.35; pointer-events: none; box-shadow: 0 8px 22px -8px rgba(0, 0, 0, .45); }
.dica strong { display: block; font-size: .875rem; font-weight: 800; }

@media (min-width: 520px) {
  .saude-dupla { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }
}
@media (min-width: 600px) {
  .hero { margin: 14px 14px 0; border-radius: 30px; }
  .app { padding-top: 4px; }
}
@media (max-width: 360px) {
  .dois, .tres { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: minmax(0, 1fr); }
  .trio { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .trio-i { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; }
  .vg-int { font-size: 2.375rem; }
  .segmentos { gap: 2px; }
  .segmento { padding: 0 6px; font-size: .8125rem; }
}

@keyframes pop { 40% { transform: scale(1.18); } }
@keyframes assentar { 0% { opacity: 0; transform: scale(1.9) rotate(-20deg); } 70% { opacity: 1; transform: scale(.94) rotate(3deg); } 100% { transform: none; } }
@keyframes aparecer { from { opacity: 0; } }
@keyframes subir { from { opacity: 0; transform: translateY(24px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
(() => {
  'use strict';

  /* ═══════════ utilidades ═══════════ */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const pad = (n) => String(n).padStart(2, '0');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const num = (v, d = 0) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));
  const ID_OK = /^[A-Za-z0-9_\-.~:@+]{1,200}$/;
  const agoraISO = () => new Date().toISOString();
  const ic = (n) => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const bolha = (icone, tom, tam) => `<span class="bolha t-${tom}${tam ? ` ${tam}` : ''}" aria-hidden="true">${ic(icone)}</span>`;
  const maiuscula = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);

  /* ═══════════ datas (chaves AAAA-MM-DD no fuso do aparelho) ═══════════ */
  const chave = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dataDe = (k) => { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, m - 1, d, 12); };
  const hoje = () => chave(new Date());
  const somaDias = (k, n) => { const d = dataDe(k); d.setDate(d.getDate() + n); return chave(d); };
  const difDias = (a, b) => Math.round((dataDe(b) - dataDe(a)) / 864e5);
  const diaSemana = (k) => dataDe(k).getDay();
  const diasNoMes = (y, m) => new Date(y, m, 0).getDate();
  const mesDe = (k) => k.slice(0, 7);
  const somaMeses = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1, 12); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const fimDoMes = (k) => { const [y, m] = k.split('-').map(Number); return `${y}-${pad(m)}-${pad(diasNoMes(y, m))}`; };
  const chaveValida = (k) => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && !isNaN(dataDe(k).getTime());
  const mesValido = (k) => typeof k === 'string' && /^\d{4}-\d{2}$/.test(k);
  const bissexto = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  const mesesEntre = (a, b) => { const [y1, m1] = a.split('-').map(Number); const [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
  /* mesmo dia, n meses depois (31 vira o último dia dos meses mais curtos) */
  function mesmaDataMais(k, n) {
    const mk = somaMeses(k.slice(0, 7), n);
    const [y, m] = mk.split('-').map(Number);
    return `${mk}-${pad(Math.min(Number(k.slice(8, 10)), diasNoMes(y, m)))}`;
  }
  const semente = (k) => Number(k.slice(8, 10)) + Number(k.slice(5, 7)) * 3;

  const SEMANA = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  const SEM_CURTA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const SEM_INI = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const MES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const ddmm = (k) => `${k.slice(8, 10)}/${k.slice(5, 7)}`;
  const diaCurto = (k) => `${SEM_CURTA[diaSemana(k)]}, ${ddmm(k)}`;
  const diaLongo = (k) => { const d = dataDe(k); return `${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
  const nomeMes = (mk) => { const [y, m] = mk.split('-').map(Number); return `${MESES[m - 1]} de ${y}`; };
  const mesCurto = (mk) => { const [y, m] = mk.split('-').map(Number); return `${MES_CURTO[m - 1]}/${String(y).slice(2)}`; };

  /* ═══════════ números e dinheiro (sempre em centavos) ═══════════ */
  const F_BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const F_N2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const F_N1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const F_N0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  const F_L = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
  const F_CMP = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
  const brl = (c) => F_BRL.format(Math.abs(Math.round(num(c))) / 100);
  const brlNeg = (c) => (num(c) < 0 ? '−' : '') + brl(c);
  const brlSinal = (c) => (num(c) > 0 ? '+' : num(c) < 0 ? '−' : '') + brl(c);
  const brlCurto = (c) => { const v = Math.abs(num(c)) / 100; return (num(c) < 0 ? '−' : '') + 'R$ ' + (v >= 1000 ? F_CMP.format(v) : F_N0.format(v)); };
  const n2 = (c) => F_N2.format(Math.round(num(c)) / 100);
  const pct = (v) => `${F_N0.format(num(v))}%`;
  const fmtMl = (ml) => (num(ml) >= 1000 ? `${F_L.format(num(ml) / 1000)} L` : `${F_N0.format(num(ml))} ml`);
  const fmtHoras = (h) => { const v = num(h); const hh = Math.floor(v); const mm = Math.round((v - hh) * 60); return mm ? `${hh}h${pad(mm)}` : `${hh}h`; };
  const fmtMin = (m) => `${F_N0.format(num(m))} min`;
  function valorGrande(c) {
    const v = Math.abs(Math.round(num(c)));
    const [int, cent] = n2(v).split(',');
    return `<span class="vg-rs">${num(c) < 0 ? '−' : ''}R$</span><span class="vg-int">${int}</span><span class="vg-cent">,${cent}</span>`;
  }

  /* ═══════════ calendário brasileiro ═══════════ */
  function pascoa(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
    return `${y}-${pad(mes)}-${pad(dia)}`;
  }
  const cacheFeriados = new Map();
  function feriadosDoAno(y) {
    if (cacheFeriados.has(y)) return cacheFeriados.get(y);
    const f = new Map();
    const fixos = [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'], ['09-07', 'Independência do Brasil'], ['10-12', 'Nossa Senhora Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'], ['11-20', 'Dia da Consciência Negra'], ['12-25', 'Natal']];
    for (const [md, nome] of fixos) f.set(`${y}-${md}`, { nome, nacional: true, bancario: true });
    const p = pascoa(y);
    f.set(somaDias(p, -48), { nome: 'Carnaval', nacional: false, bancario: true });
    f.set(somaDias(p, -47), { nome: 'Carnaval', nacional: false, bancario: true });
    f.set(somaDias(p, -2), { nome: 'Sexta-feira Santa', nacional: true, bancario: true });
    f.set(p, { nome: 'Páscoa', nacional: false, bancario: false });
    f.set(somaDias(p, 60), { nome: 'Corpus Christi', nacional: false, bancario: false });
    cacheFeriados.set(y, f);
    return f;
  }
  const feriado = (k) => feriadosDoAno(Number(k.slice(0, 4))).get(k) || null;
  const vermelho = (k) => diaSemana(k) === 0 || !!(feriado(k) && feriado(k).nacional);
  const diaUtil = (k) => { const w = diaSemana(k); const f = feriado(k); return w !== 0 && w !== 6 && !(f && f.bancario); };
  const proximoDiaUtil = (k) => { let d = k; for (let i = 0; i < 12 && !diaUtil(d); i++) d = somaDias(d, 1); return d; };
  function proximoFeriado(k) {
    for (let i = 1; i <= 400; i++) {
      const d = somaDias(k, i); const f = feriado(d);
      if (f && f.nome !== 'Páscoa' && !(f.nome === 'Carnaval' && feriado(somaDias(d, -1)) && feriado(somaDias(d, -1)).nome === 'Carnaval')) return { dia: d, nome: f.nome, nacional: f.nacional, em: i };
    }
    return null;
  }
  /* Fase da lua pela idade média (ciclo sinódico). No Brasil se diz que a fase dura até a próxima: nova, crescente, cheia, minguante. */
  function lua(k) {
    const ref = Date.UTC(2000, 0, 6, 18, 14);
    const ciclo = 29.530588853;
    const idade = ((((dataDe(k).getTime() - ref) / 864e5) % ciclo) + ciclo) % ciclo;
    const nome = idade < 7.38 ? 'Lua nova' : idade < 14.77 ? 'Lua crescente' : idade < 22.15 ? 'Lua cheia' : 'Lua minguante';
    return { f: idade / ciclo, nome };
  }
  /* Desenhada como se vê no hemisfério sul: a crescente acende do lado esquerdo, em forma de C. */
  function svgLua(f) {
    const r = 8, cx = 10, cy = 10;
    const t = Math.cos(2 * Math.PI * f);
    const rx = (Math.abs(t) * r).toFixed(2);
    const esquerda = f < 0.5;
    const fina = t > 0;
    const s1 = esquerda ? 0 : 1;
    const s2 = esquerda ? (fina ? 1 : 0) : (fina ? 0 : 1);
    const d = `M${cx} ${cy - r}A${r} ${r} 0 0 ${s1} ${cx} ${cy + r}A${rx} ${r} 0 0 ${s2} ${cx} ${cy - r}Z`;
    return `<svg class="lua" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle class="lua-sombra" cx="${cx}" cy="${cy}" r="${r}"/><path class="lua-luz" d="${d}"/></svg>`;
  }

  /* ═══════════ categorias ═══════════ */
  const CATS = [
    { id: 'moradia', nome: 'Moradia', g: 'nec' },
    { id: 'casa', nome: 'Contas da casa', g: 'nec' },
    { id: 'mercado', nome: 'Mercado', g: 'nec' },
    { id: 'transporte', nome: 'Transporte', g: 'nec' },
    { id: 'saude', nome: 'Saúde', g: 'nec' },
    { id: 'educacao', nome: 'Educação', g: 'nec' },
    { id: 'comer', nome: 'Comer fora', g: 'des' },
    { id: 'lazer', nome: 'Lazer', g: 'des' },
    { id: 'compras', nome: 'Compras', g: 'des' },
    { id: 'assinaturas', nome: 'Assinaturas', g: 'des' },
    { id: 'cuidados', nome: 'Cuidados pessoais', g: 'des' },
    { id: 'outros', nome: 'Outros gastos', g: 'des' },
    { id: 'guardar', nome: 'Guardar e investir', g: 'fut' },
    { id: 'dividas', nome: 'Dívidas', g: 'fut' },
    { id: 'salario', nome: 'Salário', g: 'ent' },
    { id: 'extra', nome: 'Renda extra', g: 'ent' },
    { id: 'resgate', nome: 'Resgate de caixinha', g: 'ent' },
    { id: 'outrasent', nome: 'Outras entradas', g: 'ent' },
  ];
  const CAT = Object.fromEntries(CATS.map((c) => [c.id, c]));
  const catDe = (id, tipo) => CAT[id] || (tipo === 'entrada' ? CAT.outrasent : CAT.outros);
  const CAT_VISUAL = {
    moradia: ['casa', 'laranja'], casa: ['raio', 'sol'], mercado: ['carrinho', 'folha'], transporte: ['carro', 'ceu'],
    saude: ['cruz', 'coral'], educacao: ['livro', 'violeta'], comer: ['talheres', 'laranja'], lazer: ['ingresso', 'rosa'],
    compras: ['sacola', 'violeta'], assinaturas: ['play', 'cobalto'], cuidados: ['tesoura', 'rosa'], outros: ['pontos', 'cinza'],
    guardar: ['porquinho', 'folha'], dividas: ['cartao', 'coral'], salario: ['maleta', 'folha'], extra: ['moedas', 'folha'], resgate: ['porquinho', 'folha'], outrasent: ['moedas', 'folha'],
  };
  const catVisual = (id) => CAT_VISUAL[id] || CAT_VISUAL.outros;
  function visualConta(c) {
    const n = ` ${semAcento(c && c.nome).replace(/[^a-z0-9]+/g, ' ')} `;
    if (/ (agua|saneamento|sabesp|cedae|copasa|sanepar|embasa|caesb|compesa) /.test(n)) return ['gota', 'ceu'];
    if (/ (luz|energia|enel|cemig|copel|celesc|coelba|cpfl|neoenergia|equatorial) /.test(n)) return ['raio', 'sol'];
    if (/ (internet|wifi|wi fi|fibra|banda larga) /.test(n)) return ['wifi', 'violeta'];
    if (/ (celular|telefone|plano de celular|vivo|claro|tim) /.test(n)) return ['celular', 'cobalto'];
    if (/ (gas|botijao) /.test(n)) return ['chama', 'laranja'];
    return catVisual(c && c.categoria);
  }
  const FORMAS = [['pix', 'Pix'], ['debito', 'Débito'], ['credito', 'Crédito'], ['dinheiro', 'Dinheiro'], ['boleto', 'Boleto']];
  const nomeForma = (v) => { const f = FORMAS.find(([x]) => x === v); return f ? f[1] : ''; };
  const GRUPOS = { nec: 'Essenciais', des: 'Estilo de vida', fut: 'Futuro', ent: 'Entrada' };
  const HUMORES = [[1, 'Péssimo'], [2, 'Ruim'], [3, 'Normal'], [4, 'Bem'], [5, 'Ótimo']];
  const SUGESTOES_HABITOS = ['Ler 20 minutos', 'Caminhar 30 minutos', 'Anotar os gastos do dia', 'Dormir antes das 23h', 'Alongar 10 minutos', 'Meditar 5 minutos'];
  const SUGESTOES_CONTAS = [['Aluguel', 'moradia', 10], ['Condomínio', 'moradia', 10], ['Luz', 'casa', 15], ['Água', 'casa', 15], ['Internet', 'casa', 15], ['Celular', 'casa', 15], ['Plano de saúde', 'saude', 10], ['Streaming', 'assinaturas', 15]];

  /* categoria automática: as palavras que a gente escreve no dia a dia levam à categoria */
  const semAcento = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const PALAVRAS_SAIDA = [
    ['mercado', ['mercado', 'supermercado', 'feira', 'hortifruti', 'sacolao', 'acougue', 'padaria', 'pao', 'paes', 'atacadao', 'atacarejo', 'quitanda', 'compras do mes', 'verdura', 'verduras', 'frutas', 'carne', 'leite', 'ovos']],
    ['comer', ['almoco', 'jantar', 'janta', 'lanche', 'lanches', 'restaurante', 'ifood', 'delivery', 'pizza', 'hamburguer', 'burger', 'cafe', 'cafes', 'cafezinho', 'sorvete', 'acai', 'bar', 'cerveja', 'chopp', 'marmita', 'pastel', 'salgado', 'coxinha', 'churrasco', 'sushi', 'lanchonete', 'boteco', 'happy hour', 'comida', 'refeicao']],
    ['transporte', ['uber', '99', 'onibus', 'metro', 'trem', 'gasolina', 'combustivel', 'etanol', 'alcool', 'diesel', 'posto', 'estacionamento', 'pedagio', 'passagem', 'bilhete unico', 'taxi', 'brt', 'patinete', 'oficina', 'mecanico', 'pneu', 'ipva', 'licenciamento', 'lavagem', 'lava jato', 'seguro do carro', 'corrida']],
    ['saude', ['farmacia', 'drogaria', 'remedio', 'remedios', 'consulta', 'medico', 'medica', 'dentista', 'exame', 'exames', 'plano de saude', 'psicologo', 'psicologa', 'terapia', 'fisioterapia', 'vacina', 'hospital', 'oculos', 'laboratorio']],
    ['casa', ['luz', 'energia', 'conta de luz', 'conta de agua', 'gas', 'botijao', 'internet', 'wifi', 'celular', 'telefone', 'recarga', 'faxina', 'diarista', 'limpeza', 'material de limpeza', 'lavanderia']],
    ['moradia', ['aluguel', 'condominio', 'iptu', 'reforma', 'conserto', 'manutencao', 'encanador', 'eletricista']],
    ['educacao', ['curso', 'faculdade', 'escola', 'mensalidade', 'livro', 'livros', 'apostila', 'material escolar', 'ingles', 'aula', 'aulas']],
    ['assinaturas', ['netflix', 'spotify', 'streaming', 'assinatura', 'prime video', 'amazon prime', 'disney', 'hbo', 'globoplay', 'youtube premium', 'icloud', 'google one', 'deezer', 'apple tv', 'chatgpt', 'claude']],
    ['lazer', ['cinema', 'show', 'ingresso', 'teatro', 'viagem', 'passeio', 'jogo', 'parque', 'museu', 'festa', 'balada', 'hotel', 'pousada', 'airbnb', 'futebol']],
    ['compras', ['roupa', 'roupas', 'sapato', 'tenis', 'presente', 'loja', 'shopping', 'eletronico', 'fone', 'notebook', 'computador', 'decoracao', 'moveis', 'movel', 'celular novo', 'geladeira', 'fogao', 'brinquedo']],
    ['cuidados', ['salao', 'cabelo', 'cabeleireiro', 'barbeiro', 'barbearia', 'manicure', 'unha', 'unhas', 'cosmetico', 'cosmeticos', 'perfume', 'maquiagem', 'academia', 'pilates', 'depilacao', 'skincare', 'creme']],
    ['dividas', ['emprestimo', 'financiamento', 'divida', 'acordo', 'cheque especial', 'consignado']],
    ['guardar', ['investimento', 'investir', 'poupanca', 'tesouro direto', 'tesouro', 'cdb']],
  ];
  const PALAVRAS_ENTRADA = [
    ['salario', ['salario', 'holerite', 'adiantamento', 'decimo terceiro', 'ferias', 'plr', 'pro labore', 'prolabore']],
    ['extra', ['freela', 'freelance', 'extra', 'bico', 'venda', 'vendas', 'comissao', 'bonus', 'hora extra', 'aluguel recebido']],
    ['outrasent', ['reembolso', 'restituicao', 'devolucao', 'cashback', 'presente', 'pix recebido']],
  ];
  const indicePalavras = (grupos) => grupos.flatMap(([cat, kws]) => kws.map((kw) => [cat, kw])).sort((a, b) => b[1].length - a[1].length);
  const IDX_SAIDA = indicePalavras(PALAVRAS_SAIDA);
  const IDX_ENTRADA = indicePalavras(PALAVRAS_ENTRADA);
  function categoriaPorTexto(texto, tipo) {
    const t = ` ${semAcento(texto).replace(/[^a-z0-9]+/g, ' ').trim()} `;
    if (!t.trim()) return null;
    for (const [cat, kw] of (tipo === 'entrada' ? IDX_ENTRADA : IDX_SAIDA)) if (t.includes(` ${kw} `)) return cat;
    return null;
  }
  function centavosDeTexto(t) {
    const s = /^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(t) ? t.replace(/\./g, '').replace(',', '.') : t.replace(',', '.');
    const v = Math.round(parseFloat(s) * 100);
    return Number.isFinite(v) ? v : 0;
  }
  /* "25 almoço", "uber 18,50", "mercado 230 no débito" → valor, descrição, categoria e forma de pagamento */
  const FORMA_TOKEN = { credito: 'credito', cartao: 'credito', debito: 'debito', dinheiro: 'dinheiro', especie: 'dinheiro', pix: 'pix', boleto: 'boleto' };
  const CONECTORES = new Set(['no', 'na', 'em', 'via', 'com', 'de', 'do', 'da', 'pelo', 'pela', 'pro', 'pra', 'para', 'e', 'o', 'a']);
  function lerGastoRapido(texto) {
    const bruto = String(texto || '').trim().slice(0, 120);
    if (!bruto) return null;
    const re = /(r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/gi;
    const achados = [];
    let m;
    while ((m = re.exec(bruto))) achados.push({ txt: m[0], num: m[2], rs: !!m[1], dec: /[.,]\d{1,2}$/.test(m[2]) && !/^\d{1,3}(\.\d{3})+$/.test(m[2]), i: m.index });
    if (!achados.length) return null;
    const escolhido = achados.find((a) => a.rs) || achados.find((a) => a.dec) || achados[achados.length - 1];
    const valor = centavosDeTexto(escolhido.num);
    if (!valor || valor > 99999999) return null;
    const resto = `${bruto.slice(0, escolhido.i)} ${bruto.slice(escolhido.i + escolhido.txt.length)}`.replace(/\b(reais|real|conto|contos|pila|pilas)\b/gi, ' ');
    let forma = null;
    const sobra = [];
    const limpo = (x) => semAcento(x).replace(/[^a-z0-9]/g, '');
    for (const tk of resto.split(/\s+/).filter(Boolean)) {
      if (FORMA_TOKEN[limpo(tk)]) {
        forma = forma || FORMA_TOKEN[limpo(tk)];
        if (sobra.length && CONECTORES.has(limpo(sobra[sobra.length - 1]))) sobra.pop();
        continue;
      }
      sobra.push(tk);
    }
    while (sobra.length && CONECTORES.has(limpo(sobra[0]))) sobra.shift();
    while (sobra.length && CONECTORES.has(limpo(sobra[sobra.length - 1]))) sobra.pop();
    let descricao = sobra.join(' ').replace(/^[\s,.;:–-]+|[\s,.;:–-]+$/g, '').slice(0, 80);
    const categoria = categoriaPorTexto(descricao, 'saida') || 'outros';
    descricao = maiuscula(descricao);
    return { valor, descricao, categoria, forma: forma || 'pix' };

  const BOCAS = { 1: 'M8 16.6q4-3.6 8 0', 2: 'M8.6 16q3.4-2 6.8 0', 3: 'M8.6 15.4h6.8', 4: 'M8.4 14.6q3.6 2.4 7.2 0', 5: 'M8 14q4 4.4 8 0' };

  /* ═══════════ dados ═══════════ */

  const armazem = { modo: 'carregando', pronto: false, aviso: '', salvando: 0 };

  }
  function aplicarDump(d) {

  /* — na conta Claude: cada pessoa tem seu canto privado em data/users/<id>/emdia — */

  /* ═══════════ rotina: hábitos e tarefas ═══════════ */
  const habitosAtivos = () => lista('habitos').filter((h) => !h.arquivado && h.nome).sort((a, b) => (num(a.ordem) - num(b.ordem)) || String(a.criadoEm || '').localeCompare(String(b.criadoEm || '')));
  const devido = (h, k) => (!h.desde || h.desde <= k) && (!Array.isArray(h.dias) || h.dias.length === 0 || h.dias.includes(diaSemana(k)));

  }

  const ordTarefa = (a, b) => (Number(!!a.feita) - Number(!!b.feita)) || String(a.hora || '99').localeCompare(String(b.hora || '99')) || String(a.criadoEm || '').localeCompare(String(b.criadoEm || ''));
  const tarefasDoDia = (k) => lista('tarefas').filter((t) => t.data === k && t.titulo).sort(ordTarefa);
  const atrasadas = (k) => lista('tarefas').filter((t) => t.titulo && t.data && t.data < k && !t.feita).sort((a, b) => a.data.localeCompare(b.data));
  function infoDia(k) {

  }
  function sequenciaEmDia(hj) {

  }

  /* ═══════════ dinheiro ═══════════ */
  const lancsDoMes = (mk) => lista('lancamentos').filter((l) => typeof l.data === 'string' && l.data.startsWith(mk));
  const contasAtivas = () => lista('contas').filter((c) => c.nome && !c.arquivada).sort((a, b) => (num(a.dia) - num(b.dia)) || String(a.nome).localeCompare(String(b.nome)));
  const contasDoMes = (mk) => contasAtivas().filter((c) => !c.desde || c.desde <= mk);
  function pagamento(contaId, mk) {

    return null;
  }
  function vencimento(c, mk) {

  }
  function statusConta(c, mk, hj) {
    const venc = vencimento(c, mk);
    const util = proximoDiaUtil(venc);
    const pg = pagamento(c.id, mk);
    const base = { venc, util, pg };
    if (pg) return { ...base, tipo: 'paga', texto: `Paga em ${ddmm(pg.data)}` };
    const atual = mesDe(hj);
    if (mk < atual) return { ...base, tipo: 'atrasada', texto: `Não foi paga em ${MESES[Number(mk.slice(5)) - 1]}` };
    if (mk > atual) return { ...base, tipo: 'futura', texto: `Vence ${diaCurto(venc)}` };
    if (hj > util) { const n = difDias(venc, hj); return { ...base, tipo: 'atrasada', texto: `Atrasada há ${n} ${n === 1 ? 'dia' : 'dias'}` }; }
    if (hj === venc) return { ...base, tipo: 'hoje', texto: 'Vence hoje' };
    if (hj > venc) return { ...base, tipo: 'hoje', texto: `Pague até ${hj === util ? 'hoje' : diaCurto(util)}` };
    const n = difDias(hj, venc);
    return { ...base, tipo: n <= 3 ? 'logo' : n <= 7 ? 'semana' : 'depois', texto: n === 1 ? 'Vence amanhã' : n <= 7 ? `Vence em ${n} dias` : `Vence dia ${Number(venc.slice(8))}` };
  }
  function resumoMes(mk, hj) {
    const p = perfil();
    const r = { entradas: 0, saidas: 0, porGrupo: { nec: 0, des: 0, fut: 0 }, pendGrupo: { nec: 0, des: 0, fut: 0 }, porCat: {}, guardado: 0, parcelas: 0, variavel: 0, varAntes: 0, varHoje: 0, fixasNF: 0, futTotal: 0 };

  function custoEssencial(hj) {

  }
  const reserva = () => lista('caixinhas').find((c) => c.reserva) || null;
  function termometro(mk, hj, r) {
    const p = perfil();
    const atual = mk === mesDe(hj);
    const itens = [];
    if (r.renda > 0) itens.push(r.livre >= 0 ? { s: 'ok', t: 'Gastando menos do que ganha', d: `${atual ? 'Sobra prevista' : 'Sobrou'}: ${brl(r.livre)}` } : { s: 'ruim', t: 'Os gastos passam da renda', d: `Faltam ${brl(-r.livre)} neste mês` });
