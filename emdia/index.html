      <div class="campo-pill"><label class="sr" for="gasto-rapido">Gasto rápido</label>${ic('raio')}<input id="gasto-rapido" name="texto" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="Gasto rápido: 25 almoço" value="${esc(r)}"><button class="btn-ir" aria-label="Registrar gasto rápido">${ic('check')}</button></div>
      <p class="sub previa" id="previa-rapido" aria-live="polite">${previaRapido(r)}</p>
    </form>`;
  }
  function linhaLanc(l) {
    const c = catDe(l.categoria, l.tipo);
    const vis = l.contaId && S.contas[l.contaId] ? visualConta(S.contas[l.contaId]) : catVisual(c.id);
    const sub = [c.nome, nomeForma(l.forma), l.parcela ? `parcela ${l.parcela.n} de ${l.parcela.de}` : '', l.contaId ? 'conta fixa' : '', l.caixinhaId ? 'caixinha' : ''].filter(Boolean).join(' · ');
    const ent = l.tipo === 'entrada';
    return `<button type="button" class="item lanc" data-act="editar-lanc" data-id="${esc(l.id)}">
      ${bolha(vis[0], vis[1], 'sm')}
      <span class="item-txt"><span class="item-tit">${esc(l.descricao || c.nome)}</span><span class="item-sub">${esc(sub)}</span></span>
      <span class="valor${ent ? ' pos' : ''}">${ent ? '+' : '−'}${brl(l.valor)}</span>
    </button>`;
  }
  function cartaoDinheiroHoje(k, hj) {
    const linkMes = `<button type="button" class="link" data-act="aba" data-aba="dinheiro">Mês ${ic('chev-r')}</button>`;
    const cab = (tit) => `<div class="card-cab">${bolha('carteira', 'folha')}<h2 id="t-din">${tit}</h2>${linkMes}</div>`;
    let corpo = '';
    if (k === hj) {
      const r = resumoMes(mesDe(hj), hj);
      if (!r.renda) corpo = cab('Pode gastar hoje') + '<p class="sub">Diga quanto você recebe por mês e o app calcula quanto dá para gastar por dia, já separando as contas e o que guardar.</p><div><button type="button" class="btn btn-pri" data-act="ajustes" data-foco="renda">Informar renda</button></div>';
      else if (r.diaria <= 0) corpo = cab('Sem folga este mês') + `<p class="valor-grande ruim">${valorGrande(r.livre)}</p><p class="sub">Contas, gastos e a meta de guardar já passam do que entra. Segure o que não for essencial até o fim do mês.</p>`;
      else {
        const neg = r.podeHoje < 0;
        const usado = clamp(r.varHoje / r.diaria, 0, 1);
        corpo = cab(neg ? 'Passou do limite de hoje' : 'Pode gastar hoje') + `<p class="valor-grande${neg ? ' ruim' : ''}">${valorGrande(Math.abs(r.podeHoje))}</p>
          <div class="barra${neg ? ' estouro' : usado > 0.8 ? ' aviso' : ''}" role="progressbar" aria-label="Gasto de hoje" aria-valuemin="0" aria-valuemax="${r.diaria}" aria-valuenow="${Math.min(r.varHoje, r.diaria)}"><span style="width:${usado * 100}%"></span></div>
          <p class="sub">Limite de <strong>${brl(r.diaria)}</strong> por dia até ${ddmm(fimDoMes(hj))} · gasto hoje <strong>${brl(r.varHoje)}</strong></p>`;
      }
    } else {
      const ls = lista('lancamentos').filter((l) => l.data === k).sort((a, b) => String(a.criadoEm || '').localeCompare(String(b.criadoEm || '')));
      corpo = cab('Movimentos do dia') + (ls.length ? `<div class="lista">${ls.map(linhaLanc).join('')}</div>` : '<p class="sub">Nenhum gasto ou entrada registrado neste dia.</p>');
    }
    corpo += formGastoRapido(k);
    return `<section class="card sobe" aria-labelledby="t-din">${corpo}</section>`;
  }
  function cartaoContasHoje(hj) {
    const prox = contasProximas(hj);
    if (!prox.length) return '';
    const total = prox.reduce((a, x) => a + Math.max(0, num(x.c.valor)), 0);
    return `<section class="card" aria-labelledby="t-contas-hoje">
      <div class="card-cab">${bolha('boleto', 'sol')}<h2 id="t-contas-hoje">Contas a pagar</h2><span class="card-extra">${brl(total)}</span></div>
      <div class="lista">${prox.map((x) => linhaConta(x.c, x.mk, hj)).join('')}</div>
    </section>`;
  }
  function blocoAgua(k, d, p) {
    const ml = num(d.agua);
    return `<div class="agua">
      ${anel(ml / p.aguaMeta, { tam: 78, esp: 9, classe: 'anel-agua', centro: ic('gota') })}
      <div class="agua-txt"><p class="mini-tit">Água</p><p class="agua-val"><b>${fmtMl(ml)}</b> de ${fmtMl(p.aguaMeta)}</p>
        <div class="agua-btns"><button type="button" class="btn btn-sm btn-sec" data-act="copo-mais" data-dia="${k}">${ic('plus')}${fmtMl(p.copoMl)}</button><button type="button" class="btn btn-sm" data-act="copo-menos" data-dia="${k}" aria-label="Tirar ${fmtMl(p.copoMl)}"${ml ? '' : ' disabled'}>−</button></div>
      </div>
    </div>`;
  }
  function blocoSono(k, d, p) {
    const v = d.sono;
    const tem = v != null && v !== '';
    return `<div class="mini-bloco">
      <p class="mini-tit">${ic('lua')}Sono</p>
      <div class="passo" role="group" aria-label="Horas dormidas"><button type="button" class="passo-btn" data-act="sono" data-dia="${k}" data-n="-0.5" aria-label="Menos meia hora">−</button><output class="passo-valor" aria-live="polite">${tem ? fmtHoras(v) : '—'}</output><button type="button" class="passo-btn" data-act="sono" data-dia="${k}" data-n="0.5" aria-label="Mais meia hora">+</button></div>
      <p class="sub">${tem ? `meta de ${fmtHoras(p.sonoMeta)}` : 'Toque para registrar'}</p>
    </div>`;
  }
  function blocoHumor(k, d) {
    const h = num(d.humor);
    return `<div class="mini-bloco">
      <p class="mini-tit">${ic('brilho')}Humor</p>
      <div class="humores" role="group" aria-label="Como você está">${HUMORES.map(([v, n]) => `<button type="button" class="humor h${v}" data-act="humor" data-dia="${k}" data-v="${v}" aria-pressed="${h === v}" aria-label="${n}" title="${n}">${icHumor(v)}</button>`).join('')}</div>
      <p class="sub">${h ? HUMORES[h - 1][1] : 'Toque no rosto que mais combina'}</p>
    </div>`;
  }
  function cartaoSaudeHoje(k) {
    const d = S.dias[k] || {};
    const p = perfil();
    return `<section class="card" aria-labelledby="t-sau">
      <div class="card-cab">${bolha('saude', 'coral')}<h2 id="t-sau">Saúde</h2><button type="button" class="link" data-act="aba" data-aba="saude">Semana ${ic('chev-r')}</button></div>
      ${blocoAgua(k, d, p)}
      <div class="saude-dupla">${blocoSono(k, d, p)}${blocoHumor(k, d)}</div>
    </section>`;
  }
  function cartaoNota(k) {
    const d = S.dias[k] || {};
    return `<section class="card"><div class="card-cab">${bolha('lapis', 'violeta')}<h2><label for="nota-dia">Como foi o dia?</label></h2></div>
      <textarea id="nota-dia" class="entrada" data-dia="${k}" rows="3" maxlength="500" placeholder="Uma linha sobre ${k === hoje() ? 'hoje' : 'esse dia'}…">${esc(d.nota || '')}</textarea></section>`;
  }

  /* — Rotina — */
  function vRotina() {
    let h = heroRotina() + '<div class="conteudo">' + segmentos('subRotina', [['habitos', 'Hábitos'], ['tarefas', 'Tarefas'], ['semana', 'Semana']], estado.subRotina);
    if (!armazem.pronto) return h + carregando() + '</div>';
    h += estado.subRotina === 'tarefas' ? vTarefas() : estado.subRotina === 'semana' ? vSemanaRotina() : vHabitos();
    return h + '</div>';
  }
  function heroRotina() {
    const hj = hoje(), mk = mesDe(hj);
    const [y, m] = mk.split('-').map(Number);
    const n = diasNoMes(y, m);
    const ini = new Date(y, m - 1, 1, 12).getDay();
    let cel = SEM_INI.map((s) => `<span class="mural-sem" aria-hidden="true">${s}</span>`).join('');
    for (let i = 0; i < ini; i++) cel += '<span aria-hidden="true"></span>';
    let emDia = 0;
    for (let d = 1; d <= n; d++) {
      const k = `${mk}-${pad(d)}`;
      let cls = 'futuro', conteudo = String(d), rot = diaLongo(k);
      if (armazem.pronto && k <= hj) {
        const inf = infoDia(k);
        if (inf.emDia) { cls = 'em-dia'; emDia += 1; conteudo = azulejo(semente(k)); rot += ', em dia'; }
        else if (inf.feitos) { cls = 'parcial'; rot += `, ${inf.feitos} de ${inf.total}`; }
        else cls = 'vazio';
      }
      cel += `<button type="button" class="mural-dia ${cls}${k === hj ? ' hoje' : ''}" data-act="ir-dia-hoje" data-dia="${k}" aria-label="${esc(rot)}">${conteudo}</button>`;
    }
    const seq = armazem.pronto ? sequenciaEmDia(hj) : 0;
    const resumo = armazem.pronto ? `<strong>${emDia}</strong> ${emDia === 1 ? 'dia em dia' : 'dias em dia'} em ${MESES[m - 1]}${seq >= 2 ? ` · ${seq} seguidos agora` : ''}` : 'Abrindo seus dados…';
    return `<header class="hero">${decoHero()}${topoHero('<h1 class="hero-titulo">Rotina</h1>')}
      <p class="hero-sub">Cada dia com tudo feito vira um azulejo.</p>
      <div class="mural" role="group" aria-label="Dias de ${MESES[m - 1]}">${cel}</div>
      <p class="hero-sub">${resumo}</p>
    </header>`;
  }
  function vHabitos() {
    const hs = habitosAtivos();
    const hj = hoje();
    if (!hs.length) return vazio('rotina', 'Nenhum hábito ainda', 'Hábito é o que você quer fazer com frequência. Comece por um destes ou crie o seu.', `${chipsSugestaoHabitos()}<button type="button" class="btn btn-pri" data-act="novo-habito">${ic('plus')}Criar hábito</button>`);
    const ini = somaDias(hj, -6);
    const linhas = hs.map((h) => {
      const seq = sequencia(h, hj);
      let pontos = '', feitosSemana = 0;
      for (let i = 0; i < 7; i++) {
        const d = somaDias(ini, i);
        const dev = devido(h, d), f = feito(h, d);
        if (dev && f) feitosSemana += 1;
        pontos += `<span class="ponto${!dev ? ' fora' : f ? ' feito' : d === hj ? ' hoje' : ''}" title="${esc(diaCurto(d))}: ${!dev ? 'não se aplica' : f ? 'feito' : 'não feito'}"><i>${SEM_INI[diaSemana(d)]}</i></span>`;
      }
      return `<div class="item">
        <button type="button" class="ck${estado.pop === h.id ? ' pop' : ''}" data-act="habito" data-id="${esc(h.id)}" data-dia="${hj}" aria-pressed="${feito(h, hj)}" aria-label="${esc(h.nome)}, hoje"${devido(h, hj) ? '' : ' disabled'}>${ic('check')}</button>
        <button type="button" class="item-txt" data-act="ver-habito" data-id="${esc(h.id)}"><span class="item-tit">${esc(h.nome)}</span><span class="item-sub">${esc(freqTexto(h))}</span><span class="pontos" aria-label="Últimos 7 dias: ${feitosSemana} feitos">${pontos}</span></button>
        ${seq >= 2 ? sequenciaChip(seq, h) : ''}
      </div>`;
    }).join('');
    return `<section class="card"><div class="lista">${linhas}</div></section><button type="button" class="btn btn-sec btn-largo" data-act="novo-habito">${ic('plus')}Novo hábito</button>`;
  }
  function vTarefas() {
    const hj = hoje(), am = somaDias(hj, 1), semana = somaDias(hj, -7);
    const ts = lista('tarefas').filter((t) => t.titulo);
    const grupos = [
      ['Ficou para trás', ts.filter((t) => t.data && t.data < hj && !t.feita).sort((a, b) => a.data.localeCompare(b.data)), true],
      ['Hoje', ts.filter((t) => t.data === hj).sort(ordTarefa)],
      ['Amanhã', ts.filter((t) => t.data === am).sort(ordTarefa)],
      ['Próximos dias', ts.filter((t) => t.data && t.data > am).sort((a, b) => a.data.localeCompare(b.data) || ordTarefa(a, b))],
      ['Sem data', ts.filter((t) => !t.data && !t.feita).sort(ordTarefa)],
      ['Feitas na última semana', ts.filter((t) => t.feita && (!t.data || t.data < hj) && (t.feitaEm || t.data || '') >= semana).sort((a, b) => String(b.feitaEm || b.data || '').localeCompare(String(a.feitaEm || a.data || '')))],
    ].filter((g) => g[1].length);
    let h = `<button type="button" class="btn btn-pri btn-largo" data-act="nova-tarefa" data-dia="${hj}">${ic('plus')}Nova tarefa</button>`;
    if (!grupos.length) return h + vazio('check', 'Nenhuma tarefa', 'Anote o que precisa fazer, com ou sem data. As de hoje aparecem também na tela Hoje.');
    for (const [nome, itens, atraso] of grupos) h += `<section class="card"><p class="grupo${atraso ? ' vermelho' : ''}">${nome}</p><div class="lista">${itens.map((t) => linhaTarefa(t, !!atraso)).join('')}</div></section>`;
    const velhas = ts.filter((t) => t.feita && (t.feitaEm || t.data || '') < somaDias(hj, -30)).length;
    if (velhas) h += `<button type="button" class="btn btn-largo" data-act="limpar-feitas">${ic('lixo')}Apagar ${velhas} ${velhas === 1 ? 'tarefa feita' : 'tarefas feitas'} há mais de 30 dias</button>`;
    return h;
  }
  function vSemanaRotina() {
    const hj = hoje();
    const s = resumoSemana(hj);
    const p = perfil();
    const tile = (icone, rot, val, nota, tom) => `<div class="stat t-${tom}"><span class="stat-rot">${ic(icone)}${rot}</span><b>${val}</b>${nota ? `<small>${nota}</small>` : ''}</div>`;
    let h = `<p class="sub" style="margin:0 4px">Últimos 7 dias: ${esc(diaCurto(s.de))} a ${esc(diaCurto(s.ate))}.</p><div class="stats">`;
    h += tile('hoje', 'Dias em dia', `${s.emDia} de 7`, 'com tudo feito', 'cobalto');
    h += tile('rotina', 'Hábitos', s.habDev ? pct(s.habFeito / s.habDev * 100) : '—', s.habDev ? `${s.habFeito} de ${s.habDev} vezes` : 'sem hábitos', 'violeta');
    h += tile('check', 'Tarefas', s.tarefas ? `${s.tarefasFeitas} de ${s.tarefas}` : '—', s.tarefas ? 'feitas' : 'nenhuma com data', 'cobalto');
    h += tile('carteira', 'Gastos do dia a dia', brl(s.gastoTotal), s.topCat ? `mais em ${catDe(s.topCat[0], 'saida').nome}` : 'nenhum registrado', 'folha');
    h += tile('gota', 'Água', s.agua ? fmtMl(Math.round(s.agua.v / 50) * 50) : '—', s.agua ? `por dia · meta ${fmtMl(p.aguaMeta)}` : 'sem registro', 'ceu');
    h += tile('lua', 'Sono', s.sono ? fmtHoras(Math.round(s.sono.v * 4) / 4) : '—', s.sono ? `por noite · meta ${fmtHoras(p.sonoMeta)}` : 'sem registro', 'violeta');
    h += tile('pulso', 'Exercício', fmtMin(s.exMin), `${s.exDias} ${s.exDias === 1 ? 'dia' : 'dias'} · meta ${fmtMin(p.exercicioMeta)}`, 'laranja');
    h += tile('brilho', 'Humor', s.humor ? `${F_N1.format(s.humor.v)} de 5` : '—', s.humor ? HUMORES[clamp(Math.round(s.humor.v), 1, 5) - 1][1] : 'sem registro', 'sol');
    h += '</div>';
    if (s.habs.length) h += `<section class="card"><div class="card-cab">${bolha('rotina', 'cobalto')}<h2>Hábitos na semana</h2></div><div class="cats">${s.habs.map((x) => `<div class="cat-linha"><div class="cat-meio"><div class="cat-topo"><span class="cat-nome">${esc(x.nome)}</span><span class="cat-val">${x.f} de ${x.dev}</span></div><div class="cat-trilho"><span class="${x.f === x.dev ? 'ok' : ''}" style="width:${Math.max(3, x.f / x.dev * 100)}%"></span></div></div></div>`).join('')}</div></section>`;
    h += cartaoIA('semana', hj, 'Revisão da semana com o Claude', 'O Claude lê o resumo destes 7 dias e sugere três ajustes pequenos para a próxima semana. Usa o seu plano do Claude.', 'Revisar minha semana');
    return h;
  }

  /* — Dinheiro — */
  function vDinheiro() {
    const mk = estado.mes, hj = hoje();
    const r = armazem.pronto ? resumoMes(mk, hj) : null;
    let h = heroDinheiro(mk, hj, r) + '<div class="conteudo">' + segmentos('subDinheiro', [['resumo', 'Resumo'], ['extrato', 'Extrato'], ['contas', 'Contas'], ['caixinhas', 'Caixinhas']], estado.subDinheiro);
    if (!armazem.pronto) return h + carregando() + '</div>';
    const s = estado.subDinheiro;
    h += s === 'extrato' ? vExtrato(mk) : s === 'contas' ? vContas(mk, hj) : s === 'caixinhas' ? vCaixinhas(hj) : vResumo(mk, hj, r);
    return h + '</div>';
  }
  function heroDinheiro(mk, hj, r) {
    const atual = mk === mesDe(hj), passado = mk < mesDe(hj);
    const nav = `<div class="mes-nav"><button type="button" class="hero-btn sm" data-act="mes" data-n="-1" aria-label="Mês anterior">${ic('chev-l')}</button><span class="mes-nome" aria-live="polite">${nomeMes(mk)}</span><button type="button" class="hero-btn sm" data-act="mes" data-n="1" aria-label="Próximo mês">${ic('chev-r')}</button></div>`;
    let corpo = '';
    if (r) {
      const rot = passado ? (r.livre >= 0 ? 'Sobrou no mês' : 'Faltou no mês') : (r.livre >= 0 ? 'Livre no mês' : 'Falta no mês');
      let sub = '';
      if (atual && r.renda) sub = r.diaria > 0 ? `Dá <strong>${brl(r.diaria)}</strong> por dia até ${ddmm(fimDoMes(hj))}, já separando contas e o que guardar.` : 'Sem folga para o dia a dia até o fim do mês.';
      else if (!passado && r.renda) sub = 'Previsão com a renda e as contas fixas.';
      else if (!r.renda) sub = 'Informe sua renda para ver quanto sobra.';
      corpo = `<p class="hero-rot">${rot}</p><p class="valor-grande${r.livre < 0 ? ' ruim' : ''}" style="margin-top:6px">${valorGrande(r.livre)}</p>${sub ? `<p class="hero-sub">${sub}</p>` : ''}
        <div class="trio">
          <div class="trio-i"><span>${ic('moedas')}Entrou</span><b>${brl(r.entradas)}</b></div>
          <div class="trio-i"><span>${ic('sacola')}Gastou</span><b>${brl(r.saidas - r.guardado)}</b></div>
          <div class="trio-i"><span>${ic('porquinho')}Guardou</span><b>${brl(r.guardado)}</b></div>
        </div>`;
    }
    return `<header class="hero">${decoHero()}${topoHero('<h1 class="hero-titulo">Dinheiro</h1>')}${nav}${corpo}</header>`;
  }
  function cartaoRenda() {
    return `<form class="card" data-form="renda">
      <div class="card-cab">${bolha('carteira', 'folha')}<h2><label for="renda-inline">Quanto você recebe por mês?</label></h2></div>
      <p class="sub">O valor que cai na conta: salário, pró-labore, bicos. Ele é a base do plano do mês.</p>
      <div class="campo-pill"><span class="vc-rs" style="font-size:1.1rem">R$</span><input id="renda-inline" name="renda" data-dinheiro inputmode="numeric" autocomplete="off" placeholder="0,00" value="${esc(rascunhos['renda-inline'] || '')}" data-centavos="${esc(rascunhos['renda-inline:c'] || '0')}"><button class="btn-ir" aria-label="Salvar renda">${ic('check')}</button></div>
    </form>`;
  }
  function vResumo(mk, hj, r) {
    const p = perfil();
    const atual = mk === mesDe(hj);
    let h = p.rendaMensal ? '' : cartaoRenda();
    if (atual && p.rendaMensal && !lancsDoMes(mk).some((l) => l.tipo === 'entrada')) h += `<section class="card faixa-salario">${bolha('maleta', 'folha')}<div class="ex-txt" style="flex:1 1 180px"><p class="ex-tit">O salário de ${MESES[Number(mk.slice(5)) - 1]} já caiu?</p><p class="sub">Registre e o plano do mês passa a usar o valor de verdade.</p></div><button type="button" class="btn btn-sm btn-pri" data-act="registrar-salario">Registrar ${brl(p.rendaMensal)}</button></section>`;
    if (!r.renda && !r.saidas) return h + vazio('carteira', 'Nada neste mês ainda', 'Registre gastos e entradas pelo botão +. O resumo, o plano e a saúde financeira aparecem aqui.');
    return h + vTermometro(mk, hj, r) + cartaoIA('mes', mk, 'Análise do mês com o Claude', 'O Claude lê os números deste mês e sugere o que fazer agora. Usa o seu plano do Claude.', 'Analisar meu mês') + vPlano(r, p) + vParcelas(mk, hj) + vCategorias(r) + graficoSobra(mk);
  }
  function vTermometro(mk, hj, r) {
    const t = termometro(mk, hj, r);
    const rot = { ok: 'Ok', meio: 'Em andamento', ruim: 'Precisa de atenção', neutro: 'Falta informação' };
    const tom = t.classe === 'ok' ? 'folha' : t.classe === 'ruim' ? 'coral' : 'sol';
    return `<section class="card" aria-labelledby="t-term">
      <div class="card-cab">${bolha('pulso', tom)}<h2 id="t-term">Saúde financeira</h2>${t.total ? `<span class="selo selo-${t.classe}">${t.oks} de ${t.total} · ${t.rotulo}</span>` : ''}</div>
      <ul class="checklist">${t.itens.map((i) => `<li class="ck-item ck-${i.s}"><span class="ck-ic" aria-hidden="true">${icStatus(i.s)}</span><span class="ck-txt"><span class="ck-tit">${esc(i.t)}</span><span class="ck-det">${esc(i.d)}</span></span><span class="sr">${rot[i.s]}</span></li>`).join('')}</ul>
    </section>`;
  }

  function graficoSobra(mkFim) {

      <p class="nota-fonte">A OMS recomenda pelo menos 150 minutos de atividade moderada por semana.</p>`;
  }
  function graficoPeso(hist, k) {
    if (estado.tabelas.peso) return `<div class="tabela-rolagem"><table class="tabela"><thead><tr><th scope="col">Dia</th><th scope="col" class="num">Peso</th></tr></thead><tbody>${hist.slice().reverse().map(([dk, x]) => `<tr><td>${esc(diaCurto(dk))}</td><td class="num">${F_N1.format(num(x.peso))} kg</td></tr>`).join('')}</tbody></table></div>`;
    const W = 320, H = 120, pl = 34, pr = 14, pt = 16, pb = 20;
    const ini = hist[0][0];
    const dias = Math.max(1, difDias(ini, k));
    const vals = hist.map(([, x]) => num(x.peso));
    let mn = Math.min(...vals), mx = Math.max(...vals);
    if (mx - mn < 1) { const c = (mx + mn) / 2; mn = c - 0.5; mx = c + 0.5; }
    const X = (dk) => pl + (W - pl - pr) * (difDias(ini, dk) / dias);
    const Y = (v) => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
    let s = `<line class="graf-grade" x1="${pl}" x2="${W - pr}" y1="${Y(mx).toFixed(1)}" y2="${Y(mx).toFixed(1)}"/><line class="graf-grade" x1="${pl}" x2="${W - pr}" y1="${Y(mn).toFixed(1)}" y2="${Y(mn).toFixed(1)}"/>`;
    s += `<text class="graf-eixo" x="${pl - 6}" y="${(Y(mx) + 4).toFixed(1)}" text-anchor="end">${F_N1.format(mx)}</text><text class="graf-eixo" x="${pl - 6}" y="${(Y(mn) + 4).toFixed(1)}" text-anchor="end">${F_N1.format(mn)}</text>`;
    s += `<path class="graf-linha" d="M${hist.map(([dk, x]) => `${X(dk).toFixed(1)} ${Y(num(x.peso)).toFixed(1)}`).join('L')}"/>`;
    const [ultK, ultX] = hist[hist.length - 1];
    s += `<circle class="graf-ponto" cx="${X(ultK).toFixed(1)}" cy="${Y(num(ultX.peso)).toFixed(1)}" r="5"/>`;
    s += `<text class="graf-eixo" x="${pl}" y="${H - 4}">${ddmm(ini)}</text><text class="graf-eixo" x="${W - pr}" y="${H - 4}" text-anchor="end">${ddmm(ultK)}</text>`;
    for (const [dk, x] of hist) s += `<circle class="graf-alvo" cx="${X(dk).toFixed(1)}" cy="${Y(num(x.peso)).toFixed(1)}" r="12" tabindex="0" data-tip="${esc(`<strong>${F_N1.format(num(x.peso))} kg</strong>${diaCurto(dk)}`)}" aria-label="${esc(diaCurto(dk))}: ${F_N1.format(num(x.peso))} kg"/>`;
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso de ${ddmm(ini)} a ${ddmm(ultK)}">${s}</svg>`;
  }
  function blocoPeso(k, d) {
    const v = num(d.peso);
    const hist = Object.entries(S.dias).filter(([dk, x]) => x && num(x.peso) > 0 && dk <= k && dk >= somaDias(k, -90)).sort((a, b) => a[0].localeCompare(b[0]));
    const ult = hist.length ? hist[hist.length - 1] : null;
    const dif = hist.length > 1 ? num(ult[1].peso) - num(hist[0][1].peso) : null;
    const t = !!estado.tabelas.peso;
    return `<div class="card-cab">${bolha('balanca', 'violeta')}<h2>Peso <span class="opcional" style="font-family:var(--f-body);font-size:.875rem">(opcional)</span></h2>${dif != null ? `<span class="card-extra">${dif > 0 ? '+' : dif < 0 ? '−' : ''}${F_N1.format(Math.abs(dif))} kg</span>` : ''}</div>
      <form class="linha-campos" data-form="peso" data-dia="${k}"><label class="sr" for="peso-dia">Peso em kg</label><span class="mini-in" style="flex:1 1 140px"><input id="peso-dia" class="entrada" name="peso" inputmode="decimal" autocomplete="off" maxlength="6" placeholder="${ult ? `Último: ${F_N1.format(num(ult[1].peso))}` : 'Ex.: 72,5'}" value="${v ? F_N1.format(v) : ''}">kg</span><button class="btn btn-sm btn-sec">${v ? 'Atualizar' : 'Registrar'}</button></form>
      ${hist.length >= 2 ? `${graficoPeso(hist, k)}<button type="button" class="link" data-act="tabela" data-id="peso" aria-pressed="${t}" style="justify-self:start">${ic(t ? 'grafico' : 'tabela')}${t ? 'Ver gráfico' : 'Ver registros'}</button>` : '<p class="sub">Registre em dias diferentes para ver a linha dos últimos 90 dias.</p>'}`;
  }
  function grafico7(id, titulo, k, campo, meta, fmt) {
    const dias = [];
    for (let i = 6; i >= 0; i--) dias.push(somaDias(k, -i));
    const vals = dias.map((d) => { const v = (S.dias[d] || {})[campo]; return v == null || v === '' ? null : num(v); });
    if (!vals.some((v) => v)) return `<figure class="card grafico">${cabGrafico(id, titulo, false)}<p class="sub">Sem registros nestes 7 dias.</p></figure>`;
    if (estado.tabelas[id]) {
      return `<figure class="card grafico">${cabGrafico(id, titulo, true)}<table class="tabela"><thead><tr><th scope="col">Dia</th><th scope="col" class="num">Registro</th></tr></thead><tbody>${dias.map((d, i) => `<tr><td>${esc(diaCurto(d))}</td><td class="num">${vals[i] == null ? '—' : esc(fmt(vals[i]))}</td></tr>`).join('')}</tbody></table><p class="graf-sub">Meta: ${esc(fmt(meta))}</p></figure>`;
    }
    const W = 320, H = 156, pl = 4, pr = 4, pt = 24, pb = 24;
    const max = Math.max(meta || 0, ...vals.map((v) => v || 0)) * 1.12 || 1;
    const bw = (W - pl - pr) / 7, bar = Math.min(24, bw * 0.56);
    const y = (v) => pt + (H - pt - pb) * (1 - v / max);
    const y0 = H - pb;
    let s = '';
    if (meta) { const ym = y(meta); s += `<line class="graf-meta" x1="${pl}" x2="${W - pr}" y1="${ym.toFixed(1)}" y2="${ym.toFixed(1)}"/><text class="graf-meta-txt" x="${pl + 2}" y="${(ym - 5).toFixed(1)}">meta ${esc(fmt(meta))}</text>`; }
    s += `<line class="graf-base" x1="${pl}" x2="${W - pr}" y1="${y0}" y2="${y0}"/>`;
    dias.forEach((d, i) => {
      const v = vals[i];
      const cx = pl + bw * i + bw / 2;
      const sel = d === k;
      if (v) {
        const yt = y(v);
        s += `<path class="graf-barra${sel ? ' sel' : ''}" d="${barraCima(cx - bar / 2, yt, bar, y0 - yt)}"/>`;
        if (sel) s += `<text class="graf-valor" x="${(cx + bar / 2 + 2).toFixed(1)}" y="${(yt - 6).toFixed(1)}" text-anchor="end">${esc(fmt(v))}</text>`;
      }
      s += `<text class="graf-eixo${sel ? ' sel' : ''}" x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${SEM_CURTA[diaSemana(d)]}</text>`;
      const tip = `<strong>${v == null ? 'Sem registro' : esc(fmt(v))}</strong>${esc(diaCurto(d))}`;
      s += `<rect class="graf-alvo" x="${(pl + bw * i).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H - 16}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(diaCurto(d))}: ${v == null ? 'sem registro' : esc(fmt(v))}"/>`;
    });
    return `<figure class="card grafico">${cabGrafico(id, titulo, true)}<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)} nos últimos 7 dias">${s}</svg></figure>`;
  }
  function vHumorSemana(k) {
    const dias = [];
    for (let i = 6; i >= 0; i--) dias.push(somaDias(k, -i));
    if (!dias.some((d) => num((S.dias[d] || {}).humor))) return '';
    return `<figure class="card grafico">${cabGrafico('humor', 'Humor', false)}<div class="humor-semana">${dias.map((d) => {

  function vSaude() {

  /* ═══════════ conversa com o Claude (análise do mês e da semana) ═══════════ */
  function formatarIA(t) {
    const linhas = String(t).split(/\n+/).map((x) => x.trim()).filter(Boolean);
    let h = '', aberta = false;
    for (const ln of linhas) {
      const item = ln.match(/^(?:[-•*]|\d+[.)])\s+(.*)$/);
      const conteudo = esc(item ? item[1] : ln).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (item) { if (!aberta) { h += '<ul>'; aberta = true; } h += `<li>${conteudo}</li>`; }
      else { if (aberta) { h += '</ul>'; aberta = false; } h += `<p>${conteudo}</p>`; }
    }
    return aberta ? `${h}</ul>` : h;
  }
  function cartaoIA(tipo, chave, titulo, texto, botao) {
    if (!ia.fn) return '';
    const st = ia[tipo];
    const atual = st.chave === chave;
    let corpo;
    if (atual && st.texto) corpo = formatarIA(st.texto);
    else if (atual && st.rodando) corpo = '<p class="sub">Pensando… pode levar até um minuto.</p>';
    else corpo = `<p class="sub">${texto}</p>`;
    const botaoHtml = atual && st.rodando ? '<button type="button" class="btn btn-sm" data-act="ia-parar">Parar</button>' : `<button type="button" class="btn btn-sm btn-pri" data-act="ia" data-tipo="${tipo}" data-chave="${chave}">${ic('brilho')}${atual && st.texto ? 'Analisar de novo' : botao}</button>`;
    return `<section class="card" aria-labelledby="t-ia-${tipo}">
      <div class="card-cab">${bolha('brilho', 'violeta')}<h2 id="t-ia-${tipo}">${titulo}</h2></div>
      <div id="ia-${tipo}" class="ia-texto" aria-live="polite">${corpo}</div>
      ${atual && st.erro ? `<p class="erro-campo" role="alert">${esc(st.erro)}</p>` : ''}
      <div>${botaoHtml}</div>
    </section>`;
  }
  function promptMes(mk) {
    const hj = hoje(), p = perfil(), r = resumoMes(mk, hj);
    const linhas = [];
    linhas.push(`Mês analisado: ${nomeMes(mk)}${mk === mesDe(hj) ? ` (hoje é ${diaLongo(hj)}; faltam ${r.restam} dias para o fim do mês)` : ''}.`);
    linhas.push(`Renda considerada: ${brl(r.renda)} (renda informada ${brl(p.rendaMensal)}; entrou de fato ${brl(r.entradas)}).`);
    linhas.push(`Livre no mês: ${brlNeg(r.livre)}.${r.diaria != null ? ` Limite diário para gastos do dia a dia: ${brl(Math.max(0, r.diaria))}.` : ''}`);
    const cats = Object.entries(r.porCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `${catDe(c, 'saida').nome} ${brl(v)}`).join('; ');
    linhas.push(`Saídas registradas por categoria: ${cats || 'nenhuma'}.`);
    for (const [g, nome] of [['nec', 'Essenciais'], ['des', 'Estilo de vida'], ['fut', 'Futuro (guardar e dívidas)']]) linhas.push(`${nome}: planejado ${p.divisao[g]}% = ${brl(Math.round(r.renda * p.divisao[g] / 100))}; pago ${brl(r.porGrupo[g])}; contas ainda a pagar ${brl(r.pendGrupo[g])}.`);
    const cs = contasDoMes(mk).map((c) => ({ c, st: statusConta(c, mk, hj) }));
    if (cs.length) linhas.push(`Contas fixas: ${cs.map(({ c, st }) => `${c.nome} ${brl(c.valor)} (${st.tipo === 'paga' ? 'paga' : st.texto.toLowerCase()})`).join('; ')}.`);
    const custo = custoEssencial(hj);
    const cx = lista('caixinhas').filter((c) => c.nome);
    linhas.push(cx.length ? `Caixinhas: ${cx.map((c) => `${c.nome} ${brl(c.saldo)}${num(c.meta) ? ` (meta ${brl(c.meta)})` : ''}${c.reserva && custo ? ` (cobre ${F_N1.format(num(c.saldo) / custo)} meses de gastos essenciais de ${brl(custo)})` : ''}`).join('; ')}.` : 'Ainda não tem reserva de emergência.');
    const fut = parcelasFuturasDe(mk);
    if (fut.total) linhas.push(`Parcelas no crédito nos próximos meses: ${brl(fut.total)} no total; ${fut.porMes.filter((x) => x.v).map((x) => `${mesCurto(x.m)} ${brl(x.v)}`).join(', ')}.`);
    const ant = somaMeses(mk, -1), ra = resumoMes(ant, hj);
    if (ra.saidas || ra.entradas) linhas.push(`Mês anterior (${nomeMes(ant)}): entrou ${brl(ra.entradas)}, saiu ${brl(ra.saidas)}.`);
    return `Você é um planejador financeiro brasileiro, direto e gentil, ajudando uma pessoa a manter as finanças saudáveis com o app Em Dia (regra 50/30/20, contas em dia, reserva de emergência de 6 meses de gastos essenciais).
Use somente os números abaixo. Não invente valores nem suponha fatos que não estão aqui.

${linhas.map((l) => `- ${l}`).join('\n')}

Responda em português do Brasil, em no máximo 130 palavras: uma frase de diagnóstico do mês e, em seguida, três ações práticas e específicas para agora, cada uma numa linha começando com "- ". Cite valores em R$ quando ajudar. Sem títulos, sem tabelas, sem emojis.`;
  }
  function promptSemana(ate) {
    const s = resumoSemana(ate), p = perfil();
    const linhas = [];
    linhas.push(`Dias com tudo feito: ${s.emDia} de 7.`);
    if (s.habs.length) linhas.push(`Hábitos (feitos/dias previstos): ${s.habs.map((x) => `${x.nome} ${x.f}/${x.dev}`).join('; ')}.`);
    linhas.push(`Tarefas com data na semana: ${s.tarefasFeitas} feitas de ${s.tarefas}; ${atrasadas(ate).length} ficaram para trás.`);
    linhas.push(s.agua ? `Água: média de ${fmtMl(Math.round(s.agua.v))} por dia em ${s.agua.n} dias registrados (meta ${fmtMl(p.aguaMeta)}).` : 'Água: sem registro.');
    linhas.push(s.sono ? `Sono: média de ${fmtHoras(Math.round(s.sono.v * 4) / 4)} em ${s.sono.n} noites registradas (meta ${fmtHoras(p.sonoMeta)}).` : 'Sono: sem registro.');
    linhas.push(`Exercício: ${fmtMin(s.exMin)} em ${s.exDias} dias (meta ${fmtMin(p.exercicioMeta)} por semana).`);
    linhas.push(s.humor ? `Humor: média ${F_N1.format(s.humor.v)} de 5.` : 'Humor: sem registro.');
    linhas.push(`Gastos do dia a dia na semana: ${brl(s.gastoTotal)}${s.topCat ? `, mais em ${catDe(s.topCat[0], 'saida').nome} (${brl(s.topCat[1])})` : ''}.`);
    if (s.notas.length) linhas.push(`Notas do dia escritas pela pessoa: ${s.notas.slice(-5).join(' | ')}`);
    return `Você é um coach de rotina e bem-estar, direto e gentil. Veja os últimos 7 dias (${diaCurto(s.de)} a ${diaCurto(s.ate)}) de uma pessoa que usa o app Em Dia e sugira ajustes pequenos e realistas para a próxima semana. Use somente estes dados:

${linhas.map((l) => `- ${l}`).join('\n')}

Responda em português do Brasil, em no máximo 120 palavras: uma frase sobre como foi a semana e três sugestões, cada uma numa linha começando com "- ". Sem títulos, sem emojis, sem conselhos médicos.`;
  }
  async function pedirIA(tipo, chave) {
    if (!ia.fn || ia[tipo].rodando) return;
    const st = ia[tipo];
    const prompt = tipo === 'mes' ? promptMes(chave) : promptSemana(chave);
    Object.assign(st, { chave, texto: '', rodando: true, erro: '' });
    const ctl = new AbortController();
    ia.ctl = ctl;
    agendarRender();
    try {
      await ia.fn(prompt, { signal: ctl.signal, onText: ({ text }) => { st.texto = text; const el = document.getElementById(`ia-${tipo}`); if (el) el.innerHTML = formatarIA(text); } });
    } catch (e) {
      const c = e && e.code;
      st.texto = e && typeof e.text === 'string' && c !== 'refused' ? e.text : (c === 'refused' ? '' : st.texto);
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { ia.fn = null; toast('O app não tem permissão para pedir análises ao Claude.'); }
      else if (c === 'rate_limited') st.erro = 'Muitos pedidos seguidos. Tente de novo daqui a pouco.';
      else if (c === 'session_expired') st.erro = 'Sua sessão expirou. Entre de novo no claude.ai.';
      else if (c === 'refused') st.erro = 'O Claude não respondeu a esse pedido.';
      else if (c !== 'cancelled') st.erro = 'Não deu para analisar agora. Tente de novo.';
    } finally {
      st.rodando = false;
      if (ia.ctl === ctl) ia.ctl = null;
      agendarRender();
    }
  }

  /* ═══════════ planilha (CSV para Excel e Google Planilhas) ═══════════ */
  function csvLancamentos() {
    const ls = lista('lancamentos').filter((l) => typeof l.data === 'string').sort((a, b) => a.data.localeCompare(b.data) || String(a.criadoEm || '').localeCompare(String(b.criadoEm || '')));
    const campo = (v) => { const s = String(v == null ? '' : v); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const linhas = [['Data', 'Tipo', 'Descrição', 'Categoria', 'Grupo', 'Forma', 'Parcela', 'Valor (R$)'].join(';')];
    for (const l of ls) {
      const c = catDe(l.categoria, l.tipo);
      const v = Math.round(num(l.valor)) * (l.tipo === 'saida' ? -1 : 1);
      linhas.push([`${ddmm(l.data)}/${l.data.slice(0, 4)}`, l.tipo === 'saida' ? 'Saída' : 'Entrada', l.descricao || c.nome, c.nome, GRUPOS[c.g], nomeForma(l.forma), l.parcela ? `${l.parcela.n}/${l.parcela.de}` : '', (v / 100).toFixed(2).replace('.', ',')].map(campo).join(';'));
    }
    return `﻿${linhas.join('\r\n')}\r\n`;
  }
  async function baixarCSV() {
    const nome = `em-dia-lancamentos-${hoje()}.csv`;

    if (baixar.fn) {
      try { await baixar.fn.save({ filename: nome, data: dados }); toast('Planilha salva.'); }
      catch (e) { const c = e && e.code; if (c === 'declined') return; toast(c === 'rate_limited' ? 'Já tem um download esperando confirmação.' : 'Não deu para baixar a planilha aqui.'); }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([dados], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url; a.download = nome;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) { toast('Não deu para baixar a planilha neste navegador.'); }
  }

  /* ═══════════ folhas (formulários que sobem de baixo) ═══════════ */
  let folha = null;
  const radioChip = (nome, v, rot, marcado) => `<label class="chip-r"><input type="radio" name="${nome}" value="${esc(v)}"${marcado ? ' checked' : ''}><span>${esc(rot)}</span></label>`;

  const campoValor = (id, nome, rotulo, c, extra) => `<div class="valor-campo"><label for="${id}">${rotulo}</label><div class="vc-linha"><span class="vc-rs">R$</span><input id="${id}" name="${nome}" data-dinheiro inputmode="numeric" autocomplete="off" placeholder="0,00" data-centavos="${Math.round(num(c))}" value="${c ? n2(c) : ''}"${extra || ''}></div></div>`;
  function abrirFolha(titulo, corpo, opts) {
    const o = opts || {};
    const raiz = $('#folha-raiz');
    const voltarFoco = folha ? folha.voltarFoco : document.activeElement;
    raiz.innerHTML = `<div class="veu" data-act="fechar"></div>
      <div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
        <div class="folha-alca" aria-hidden="true"></div>
        <div class="folha-cab"><h2 id="folha-titulo" tabindex="-1">${titulo}</h2><button type="button" class="btn-icone" data-act="fechar" aria-label="Fechar">${ic('x')}</button></div>
        <form id="folha-form" novalidate autocomplete="off"><div class="folha-corpo">${corpo}</div>${o.acoes ? `<div class="folha-acoes">${o.acoes}</div>` : ''}</form>
      </div>`;
    raiz.hidden = false;
    document.documentElement.classList.add('com-folha');
    for (const el of [$('.app'), $('.nav')]) if (el) el.inert = true;
    folha = { onSubmit: o.onSubmit || null, onAcao: o.onAcao || null, voltarFoco };
    const f = $('#folha-form');
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!folha || !folha.onSubmit) return;
      if (!armazem.pronto) { toast('Ainda abrindo seus dados. Tente de novo em instantes.'); return; }
      folha.onSubmit(new FormData(f), f);
    });
    if (o.aoAbrir) o.aoAbrir(f);
    const alvo = f.querySelector('[data-foco-inicial]') || $('#folha-titulo');
    try { alvo.focus({ preventScroll: true }); } catch (e) { /* ok */ }
  }
  function fecharFolha() {
    if (!folha) return;
    const vf = folha.voltarFoco;
    folha = null;
    const raiz = $('#folha-raiz');
    raiz.innerHTML = '';
    raiz.hidden = true;
    document.documentElement.classList.remove('com-folha');
    for (const el of [$('.app'), $('.nav')]) if (el) el.inert = false;
    if (vf && document.contains(vf)) { try { vf.focus({ preventScroll: true }); } catch (e) { /* ok */ } }
  }
  function erroCampo(f, sel, msg) {
    const el = f.querySelector(sel);
    const antigo = f.querySelector('.erro-campo');
    if (antigo) antigo.remove();
    const p = document.createElement('p');
    p.className = 'erro-campo';
    p.setAttribute('role', 'alert');
    p.textContent = msg;
    const alvo = el ? (el.closest('.campo') || el.closest('.valor-campo')) : null;
    if (alvo) alvo.insertAdjacentElement('afterend', p); else f.querySelector('.folha-corpo').appendChild(p);
    if (el) { try { el.focus(); } catch (e) { /* ok */ } }
  }
  const centavosDe = (el) => Math.max(0, parseInt((el && el.dataset.centavos) || '0', 10) || 0);
  function formatarDinheiro(el) {
    const dig = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 11);
    const c = dig ? parseInt(dig, 10) : 0;
    el.dataset.centavos = String(c);
    el.value = c ? n2(c) : '';
    try { const L = el.value.length; el.setSelectionRange(L, L); } catch (e) { /* ok */ }
  }

  function folhaAdicionar() {
    const ops = [['novo-lanc', 'saida', 'Gasto', 'sacola', 'coral'], ['novo-lanc', 'entrada', 'Entrada', 'moedas', 'folha'], ['nova-tarefa', '', 'Tarefa', 'check', 'cobalto'], ['novo-habito', '', 'Hábito', 'repetir', 'violeta'], ['nova-conta', '', 'Conta fixa', 'boleto', 'sol'], ['guardar-menu', '', 'Guardar dinheiro', 'porquinho', 'ceu']];
    abrirFolha('Adicionar', `<div class="grade-add">${ops.map(([a, t, n, i, tom]) => `<button type="button" class="add-op" data-act="${a}"${t ? ` data-tipo="${t}"` : ''}${a === 'nova-tarefa' ? ` data-dia="${estado.aba === 'hoje' ? estado.dia : hoje()}"` : ''}>${bolha(i, tom)}<span>${n}</span></button>`).join('')}</div>`);
  }

  function folhaLancamento(o) {
    const id = o.id || null;
    const l = id ? S.lancamentos[id] : null;
    if (id && !l) return;
    const vinculo = !!(l && (l.contaId || l.caixinhaId || l.parcela));
    const tipo = l ? l.tipo : (o.tipo === 'entrada' ? 'entrada' : 'saida');
    const dia = l ? l.data : (o.dia && chaveValida(o.dia) ? o.dia : (estado.aba === 'hoje' ? estado.dia : hoje()));
    const chipsCats = (tp, atual) => CATS.filter((c) => (tp === 'entrada' ? c.g === 'ent' && (c.id !== 'resgate' || atual === 'resgate') : c.g !== 'ent')).map((c) => chipCategoria(c, c.id === atual)).join('');
    const catAtual = l ? l.categoria : (tipo === 'entrada' ? 'salario' : 'mercado');
    let nota = '';
    if (l && l.parcela) nota = `<div class="nota-vinculo"><span>Parcela ${l.parcela.n} de ${l.parcela.de} de uma compra de ${brl(l.parcela.total || 0)} no crédito.</span><button type="button" class="btn btn-sm" data-act="folha-acao" data-acao="excluir-grupo">${ic('lixo')}Excluir todas as parcelas</button></div>`;
    else if (vinculo) nota = `<div class="nota-vinculo">Este lançamento está ligado ${l.contaId ? 'a uma conta fixa' : 'a uma caixinha'}. Se excluir, ${l.contaId ? 'a conta volta a aparecer como não paga' : 'o saldo da caixinha é corrigido'}.</div>`;
    const corpo = `
      ${vinculo ? '' : `<div class="alternar" role="radiogroup" aria-label="Tipo">${[['saida', 'Gasto', 'sacola', 'coral'], ['entrada', 'Entrada', 'moedas', 'folha']].map(([v, n, i, tom]) => `<label class="t-${tom}"><input type="radio" name="tipo" value="${v}"${v === tipo ? ' checked' : ''}><span>${ic(i)}${n}</span></label>`).join('')}</div>`}
      ${campoValor('f-valor', 'valor', 'Valor', l ? l.valor : 0, l ? '' : ' data-foco-inicial')}
      <div class="campo"><label for="f-desc">Descrição <span class="opcional">(o app sugere a categoria)</span></label><input id="f-desc" class="entrada" name="descricao" maxlength="80" placeholder="${tipo === 'entrada' ? 'Ex.: Salário de outubro' : 'Ex.: Mercado da semana'}" value="${esc(l ? l.descricao || '' : '')}"></div>
      <fieldset class="campo"><legend>Categoria</legend><div class="chips" id="f-cats">${chipsCats(tipo, catAtual)}</div></fieldset>
      <div class="campo"><label for="f-data">Data</label><input id="f-data" class="entrada" type="date" name="data" required value="${dia}"></div>
      <fieldset class="campo" id="f-formas"${tipo === 'entrada' ? ' hidden' : ''}><legend>Como pagou</legend><div class="chips">${FORMAS.map(([v, n]) => radioChip('forma', v, n, (l && l.forma ? l.forma : 'pix') === v)).join('')}</div></fieldset>
      ${l ? '' : `<div class="campo" id="f-parcelas" hidden><label for="f-np">Parcelas no cartão</label><div class="linha-campos"><select id="f-np" name="parcelas" class="entrada" style="flex:0 0 8.5rem">${Array.from({ length: 24 }, (_, i) => `<option value="${i + 1}">${i === 0 ? 'À vista' : `${i + 1}x`}</option>`).join('')}</select><span class="sub" id="f-np-txt"></span></div></div>`}
      ${nota}`;
    const acoes = `${l ? `<button type="button" class="btn btn-txt perigo" data-act="folha-acao" data-acao="excluir">${ic('lixo')}Excluir</button>` : ''}<button class="btn btn-pri">${l ? 'Salvar' : tipo === 'entrada' ? 'Registrar entrada' : 'Registrar gasto'}</button>`;
    abrirFolha(l ? 'Editar lançamento' : tipo === 'entrada' ? 'Nova entrada' : 'Novo gasto', corpo, {
      acoes,
      aoAbrir: (f) => {
        let catManual = !!l;
        const tipoAtual = () => { const r = f.querySelector('input[name="tipo"]:checked'); return r ? r.value : tipo; };
        const atualizarParcelas = () => {
          const fs = $('#f-parcelas', f);
          if (!fs) return;
          const forma = (f.querySelector('input[name="forma"]:checked') || {}).value;
          fs.hidden = !(forma === 'credito' && tipoAtual() === 'saida');
          const n = fs.hidden ? 1 : Number($('#f-np', f).value) || 1;
          const v = centavosDe($('#f-valor', f));
          const dataV = String($('#f-data', f).value || hoje());
          $('#f-np-txt', f).textContent = n > 1 ? (v ? `${n}x de ${brl(Math.round(v / n))} · última em ${mesCurto(mesmaDataMais(chaveValida(dataV) ? dataV : hoje(), n - 1).slice(0, 7))}` : `${n}x`) : 'O valor inteiro neste mês.';
          const rot = f.querySelector('label[for="f-valor"]');
          if (rot) rot.textContent = n > 1 ? 'Valor total da compra' : 'Valor';
        };
        f.addEventListener('change', (e) => {
          if (e.target.name === 'categoria') catManual = true;
          if (e.target.name === 'tipo') {
            const tp = e.target.value;
            catManual = false;
            $('#f-cats', f).innerHTML = chipsCats(tp, tp === 'entrada' ? 'salario' : 'mercado');
            $('#f-formas', f).hidden = tp === 'entrada';
            $('#folha-titulo').textContent = tp === 'entrada' ? 'Nova entrada' : 'Novo gasto';
            const b = f.querySelector('.folha-acoes .btn-pri');
            if (b && !l) b.textContent = tp === 'entrada' ? 'Registrar entrada' : 'Registrar gasto';
            $('#f-desc', f).placeholder = tp === 'entrada' ? 'Ex.: Salário de outubro' : 'Ex.: Mercado da semana';
          }
          atualizarParcelas();
        });
        f.addEventListener('input', (e) => {
          if (e.target.id === 'f-desc' && !catManual) {
            const c = categoriaPorTexto(e.target.value, tipoAtual());
            const r = c ? f.querySelector(`input[name="categoria"][value="${c}"]`) : null;
            if (r) r.checked = true;
          }
          if (e.target.id === 'f-valor' || e.target.id === 'f-data') atualizarParcelas();
        });
        atualizarParcelas();
      },
      onSubmit: (fd, f) => {
        const valor = centavosDe($('#f-valor', f));
        if (!valor) return erroCampo(f, '#f-valor', 'Digite o valor.');
        const data = String(fd.get('data') || '');
        if (!chaveValida(data)) return erroCampo(f, '#f-data', 'Escolha a data.');
        const tp = vinculo ? l.tipo : (fd.get('tipo') === 'entrada' ? 'entrada' : 'saida');
        const cat = String(fd.get('categoria') || (tp === 'entrada' ? 'outrasent' : 'outros'));
        const categoria = CAT[cat] ? cat : (tp === 'entrada' ? 'outrasent' : 'outros');
        const forma = tp === 'saida' ? String(fd.get('forma') || 'pix') : null;
        const descricao = String(fd.get('descricao') || '').trim().slice(0, 80);
        const n = !l && tp === 'saida' && forma === 'credito' ? clamp(Math.round(num(fd.get('parcelas'), 1)), 1, 24) : 1;
        if (n > 1) {
          const grupo = novoId();
          const base = Math.floor(valor / n), resto = valor - base * n;
          for (let i = 1; i <= n; i++) put('lancamentos', `${grupo}-${i}`, { tipo: 'saida', valor: base + (i === 1 ? resto : 0), descricao, categoria, data: mesmaDataMais(data, i - 1), forma: 'credito', parcela: { grupo, n: i, de: n, total: valor }, criadoEm: agoraISO() });
          fecharFolha();
          toast(`Compra em ${n}x registrada: ${brl(base)} por mês até ${mesCurto(mesmaDataMais(data, n - 1).slice(0, 7))}`);
          return;
        }
        const doc = { ...(l || {}), tipo: tp, valor, descricao, categoria, data, forma, criadoEm: (l && l.criadoEm) || agoraISO() };
        delete doc.exemplo;
        if (l && l.caixinhaId && l.valor !== valor) ajustarCaixinha(l.caixinhaId, l.tipo === 'saida' ? valor - num(l.valor) : num(l.valor) - valor);
        put('lancamentos', id || novoId(), doc);
        fecharFolha();
        toast(l ? 'Lançamento salvo' : tp === 'entrada' ? `Entrada de ${brl(valor)} registrada` : `Gasto de ${brl(valor)} registrado`);
      },
      onAcao: (a) => {
        if (a === 'excluir-grupo' && l && l.parcela) {
          const grupo = lista('lancamentos').filter((x) => x.parcela && x.parcela.grupo === l.parcela.grupo).map((x) => { const { id: idx, ...doc } = x; return [idx, doc]; });
          for (const [idx] of grupo) del('lancamentos', idx);
          fecharFolha();
          toast(`${grupo.length} parcelas excluídas`, { acao: 'Desfazer', fn: () => { for (const [idx, doc] of grupo) put('lancamentos', idx, doc); } });
          return;
        }
        if (a !== 'excluir') return;
        const antigo = { ...l };
        if (antigo.caixinhaId) ajustarCaixinha(antigo.caixinhaId, antigo.tipo === 'saida' ? -num(antigo.valor) : num(antigo.valor));
        del('lancamentos', id);
        fecharFolha();
        toast('Lançamento excluído', { acao: 'Desfazer', fn: () => { if (antigo.caixinhaId) ajustarCaixinha(antigo.caixinhaId, antigo.tipo === 'saida' ? num(antigo.valor) : -num(antigo.valor)); put('lancamentos', id, antigo); } });
      },
    });
  }

  function folhaTarefa(o) {
    const id = o.id || null;
    const t = id ? S.tarefas[id] : null;
    if (id && !t) return;
    const dia = t ? (t.data || '') : (o.dia && chaveValida(o.dia) ? o.dia : hoje());
    const corpo = `
      <div class="campo"><label for="t-titulo">O que fazer</label><input id="t-titulo" class="entrada" name="titulo" maxlength="120" placeholder="Ex.: Levar o carro na revisão" value="${esc(t ? t.titulo : '')}"${t ? '' : ' data-foco-inicial'}></div>
      <div class="campo"><label for="t-data">Dia</label><input id="t-data" class="entrada" type="date" name="data" value="${dia}">
        <div class="chips"><button type="button" class="chip" data-act="folha-acao" data-acao="dia" data-v="${hoje()}">Hoje</button><button type="button" class="chip" data-act="folha-acao" data-acao="dia" data-v="${somaDias(hoje(), 1)}">Amanhã</button><button type="button" class="chip" data-act="folha-acao" data-acao="dia" data-v="">Sem data</button></div></div>
      <div class="campo"><label for="t-hora">Horário <span class="opcional">(opcional)</span></label><input id="t-hora" class="entrada" type="time" name="hora" value="${esc(t ? t.hora || '' : '')}"></div>`;
    const acoes = `${t ? `<button type="button" class="btn btn-txt perigo" data-act="folha-acao" data-acao="excluir">${ic('lixo')}Excluir</button>` : ''}<button class="btn btn-pri">${t ? 'Salvar' : 'Criar tarefa'}</button>`;
    abrirFolha(t ? 'Editar tarefa' : 'Nova tarefa', corpo, {
      acoes,
      onSubmit: (fd, f) => {

        if (!titulo) return erroCampo(f, '#t-titulo', 'Escreva o que precisa fazer.');

        const hora = String(fd.get('hora') || '');
        const doc = { ...(t || {}), titulo, data: chaveValida(data) ? data : '', hora: /^\d{2}:\d{2}$/.test(hora) ? hora : '', feita: t ? !!t.feita : false, criadoEm: (t && t.criadoEm) || agoraISO() };
        delete doc.exemplo;
        put('tarefas', id || novoId(), doc);
        fecharFolha();
        toast(t ? 'Tarefa salva' : 'Tarefa criada');
      },
      onAcao: (a, el) => {
        if (a === 'dia') { $('#t-data').value = el.dataset.v; return; }
        if (a !== 'excluir') return;
        const antigo = { ...t };
        del('tarefas', id);
        fecharFolha();
        toast('Tarefa excluída', { acao: 'Desfazer', fn: () => put('tarefas', id, antigo) });
      },
    });
  }

  function folhaHabito(o) {
    const id = o.id || null;
    const h = id ? S.habitos[id] : null;
    if (id && !h) return;
    const dias = h && Array.isArray(h.dias) && h.dias.length ? h.dias : [0, 1, 2, 3, 4, 5, 6];
    const corpo = `
      <div class="campo"><label for="h-nome">Hábito</label><input id="h-nome" class="entrada" name="nome" maxlength="60" placeholder="Ex.: Ler 20 minutos" value="${esc(h ? h.nome : '')}"${h ? '' : ' data-foco-inicial'}></div>
      <fieldset class="campo"><legend>Em quais dias da semana</legend><div class="dias-semana">${[0, 1, 2, 3, 4, 5, 6].map((i) => `<label class="dia-sem"><input type="checkbox" name="dias" value="${i}"${dias.includes(i) ? ' checked' : ''}><span aria-hidden="true">${SEM_INI[i]}</span><span class="sr">${SEMANA[i]}</span></label>`).join('')}</div><p class="sub">Todos marcados: todo dia.</p></fieldset>`;
    const acoes = `${h ? `<button type="button" class="btn btn-txt perigo" data-act="folha-acao" data-acao="excluir">${ic('lixo')}Excluir</button>` : ''}<button class="btn btn-pri">${h ? 'Salvar' : 'Criar hábito'}</button>`;
    abrirFolha(h ? 'Editar hábito' : 'Novo hábito', corpo, {
      acoes,
      onSubmit: (fd, f) => {
        const nome = String(fd.get('nome') || '').trim().slice(0, 60);
        if (!nome) return erroCampo(f, '#h-nome', 'Dê um nome ao hábito.');
        const ds = fd.getAll('dias').map(Number).filter((n) => n >= 0 && n <= 6);
        if (!ds.length) return erroCampo(f, '.dias-semana input', 'Marque pelo menos um dia.');
        const doc = { ...(h || {}), nome, dias: ds.length === 7 ? [] : ds.sort((a, b) => a - b) };
        if (!h) Object.assign(doc, { desde: hoje(), feitos: {}, ordem: habitosAtivos().reduce((m, x) => Math.max(m, num(x.ordem)), 0) + 1, criadoEm: agoraISO() });
        delete doc.exemplo;
        put('habitos', id || novoId(), doc);
        fecharFolha();
        toast(h ? 'Hábito salvo' : 'Hábito criado');
      },
      onAcao: (a) => {
        if (a !== 'excluir') return;
        const antigo = { ...h };
        del('habitos', id);
        fecharFolha();
        toast('Hábito excluído', { acao: 'Desfazer', fn: () => put('habitos', id, antigo) });
      },
    });
  }
  function corpoVerHabito(id, mk) {
    const h = { id, ...S.habitos[id] };
    const hj = hoje();
    const [y, m] = mk.split('-').map(Number);
    const n = diasNoMes(y, m);
    const ini = new Date(y, m - 1, 1, 12).getDay();
    let cel = SEM_INI.map((s) => `<span class="gm-sem" aria-hidden="true">${s}</span>`).join('');
    for (let i = 0; i < ini; i++) cel += '<span aria-hidden="true"></span>';
    let devidos = 0, feitos = 0;
    for (let d = 1; d <= n; d++) {
      const k = `${mk}-${pad(d)}`;
      const dev = devido(h, k), f = feito(h, k);
      if (dev && k <= hj) { devidos += 1; if (f) feitos += 1; }
      const cls = f ? 'feito' : !dev ? 'fora' : k > hj ? 'futuro' : k === hj ? 'hoje' : 'falhou';
      cel += `<span class="gm-dia ${cls}" title="${esc(diaCurto(k))}${f ? ': feito' : ''}">${f ? azulejo(semente(k)) : ''}${d}</span>`;
    }
    const taxa = devidos ? Math.round(feitos / devidos * 100) : 0;
    return `<div id="ver-habito" style="display:grid;gap:16px">
      <p class="sub">${esc(freqTexto(h))}. Cada dia feito vira um azulejo.</p>
      <div class="stats stats-mini"><div class="stat"><span class="stat-rot">No mês</span><b>${feitos}/${devidos}</b><small>${taxa}%</small></div><div class="stat"><span class="stat-rot">Seguidos</span><b>${sequencia(h, hj)}</b><small>agora</small></div><div class="stat"><span class="stat-rot">Recorde</span><b>${melhorSequencia(h, hj)}</b><small>seguidos</small></div></div>
      <div class="gm-cab"><button type="button" class="btn-icone" data-act="folha-acao" data-acao="mes" data-n="-1" data-mes0="${mk}" aria-label="Mês anterior">${ic('chev-l')}</button><strong class="mes-nome">${nomeMes(mk)}</strong><button type="button" class="btn-icone" data-act="folha-acao" data-acao="mes" data-n="1" data-mes0="${mk}" aria-label="Próximo mês">${ic('chev-r')}</button></div>
      <div class="grade-mes" role="img" aria-label="${esc(nomeMes(mk))}: feito em ${feitos} de ${devidos} dias">${cel}</div>
    </div>`;
  }
  function folhaVerHabito(id) {
    if (!S.habitos[id]) return;
    abrirFolha(esc(S.habitos[id].nome), corpoVerHabito(id, mesDe(hoje())), {
      acoes: `<button type="button" class="btn" data-act="folha-acao" data-acao="editar">${ic('lapis')}Editar</button><button type="button" class="btn btn-pri" data-act="fechar">Fechar</button>`,
      onAcao: (a, el) => {
        if (a === 'editar') { folhaHabito({ id }); return; }
        if (a === 'mes' && S.habitos[id]) $('#ver-habito').outerHTML = corpoVerHabito(id, somaMeses(el.dataset.mes0, Number(el.dataset.n)));
      },
    });
  }

  function folhaConta(o) {
    const id = o.id || null;
    const c = id ? S.contas[id] : null;
    if (id && !c) return;
    const mk = estado.aba === 'dinheiro' ? estado.mes : mesDe(hoje());
    const pg = c ? pagamento(id, mk) : null;
    const catAtual = c ? c.categoria : (o.categoria && CAT[o.categoria] ? o.categoria : 'casa');

      for (const c of ['lancamentos', 'dias', 'tarefas']) {

  function alternarTarefa(id) {
    const t = S.tarefas[id];

    const k = t.data;
    const antes = k ? infoDia(k).emDia : false;
    const feita = !t.feita;
    put('tarefas', id, { ...t, feita, feitaEm: feita ? hoje() : '' });

    if (k && !antes && k === estado.dia && infoDia(k).emDia) estado.carimbar = true;

  function criarTarefaRapida(texto, k) {
    const bruto = String(texto || '').trim();
    if (!bruto) return false;
    let titulo = bruto, hora = '';
    const m = bruto.match(/\s(?:às\s+|as\s+)?(\d{1,2})(?:h(\d{2})?|:(\d{2}))\s*$/i);
    if (m) {
      const hh = Number(m[1]), mm = Number(m[2] || m[3] || 0);
      if (hh <= 23 && mm <= 59) { hora = `${pad(hh)}:${pad(mm)}`; titulo = bruto.slice(0, m.index).trim() || bruto; }
    }
    put('tarefas', novoId(), { titulo: titulo.slice(0, 120), data: chaveValida(k) ? k : hoje(), hora, feita: false, criadoEm: agoraISO() });
    return true;
  }
  function salvarDia(k, campos, opts) {
    if (!chaveValida(k)) return;

    const novo = { ...d, ...campos, data: k };
    delete novo.exemplo;
    put('dias', k, novo, opts);

  function criarHabito(nome) {

  function registrarSalario() {

    if (!p.rendaMensal) return;
    const hj = hoje(), id = novoId();
    put('lancamentos', id, { tipo: 'entrada', valor: p.rendaMensal, descricao: `Salário de ${MESES[Number(hj.slice(5, 7)) - 1]}`, categoria: 'salario', data: hj, forma: null, criadoEm: agoraISO() });
    toast(`Salário de ${brl(p.rendaMensal)} registrado`, { acao: 'Editar', fn: () => folhaLancamento({ id }) });
  }

  const ESCRITA = new Set(['habito', 'tarefa', 'tarefa-hoje', 'sugestao-habito', 'copo', 'copo-mais', 'copo-menos', 'sono', 'humor', 'exercicio', 'apagar-exemplos', 'limpar-feitas', 'registrar-salario', 'ia']);
  const ACOES = {
    aba: (el) => irAba(el.dataset.aba),
    dia: (el) => mudarDia(somaDias(estado.dia, Number(el.dataset.n) || 0)),
    'ir-dia': (el) => mudarDia(el.dataset.dia),
    'ir-dia-hoje': (el) => { if (chaveValida(el.dataset.dia)) { estado.dia = el.dataset.dia; irAba('hoje'); } },
    'ir-hoje': () => mudarDia(hoje()),
    mes: (el) => { estado.mes = somaMeses(estado.mes, Number(el.dataset.n) || 0); render(); },
    sub: (el) => { if (el.dataset.nome === 'subRotina' || el.dataset.nome === 'subDinheiro') { estado[el.dataset.nome] = el.dataset.v; salvarUI(); render(); } },
    filtro: (el) => { estado.filtroExtrato = el.dataset.v; render(); },
    tabela: (el) => { estado.tabelas[el.dataset.id] = !estado.tabelas[el.dataset.id]; render(); },
    habito: (el) => alternarHabito(el.dataset.id, el.dataset.dia),
    tarefa: (el) => alternarTarefa(el.dataset.id),
    'tarefa-hoje': (el) => { const t = S.tarefas[el.dataset.id]; if (t) { put('tarefas', el.dataset.id, { ...t, data: hoje() }); toast('Tarefa passada para hoje'); } },
    'editar-tarefa': (el) => folhaTarefa({ id: el.dataset.id }),
    'nova-tarefa': (el) => folhaTarefa({ dia: el.dataset.dia }),
    'novo-habito': () => folhaHabito({}),
    'sugestao-habito': (el) => criarHabito(el.dataset.nome),
    'ver-habito': (el) => folhaVerHabito(el.dataset.id),
    'novo-lanc': (el) => folhaLancamento({ tipo: el.dataset.tipo, dia: el.dataset.dia }),
    'editar-lanc': (el) => folhaLancamento({ id: el.dataset.id }),
    'nova-conta': (el) => folhaConta({ nome: el.dataset.nome, categoria: el.dataset.cat, dia: el.dataset.diav }),
    'editar-conta': (el) => folhaConta({ id: el.dataset.id }),
    pagar: (el) => folhaPagar(el.dataset.id, el.dataset.mes),
    'nova-caixinha': (el) => folhaCaixinha({ reserva: el.dataset.reserva === '1' && !reserva() }),
    'editar-caixinha': (el) => folhaCaixinha({ id: el.dataset.id }),
    guardar: (el) => folhaMover(el.dataset.id, 'guardar'),
    tirar: (el) => folhaMover(el.dataset.id, 'tirar'),
    'guardar-menu': () => folhaEscolherCaixinha(),
    copo: (el) => {
      const k = el.dataset.dia, i = Number(el.dataset.i), copo = perfil().copoMl;
      const cheios = Math.floor(num((S.dias[k] || {}).agua) / copo);
      salvarDia(k, { agua: (cheios === i ? i - 1 : i) * copo });
    },
    'copo-mais': (el) => { const k = el.dataset.dia; salvarDia(k, { agua: Math.min(10000, num((S.dias[k] || {}).agua) + perfil().copoMl) }); },
    'copo-menos': (el) => { const k = el.dataset.dia; salvarDia(k, { agua: Math.max(0, num((S.dias[k] || {}).agua) - perfil().copoMl) }); },
    sono: (el) => {
      const k = el.dataset.dia, n = Number(el.dataset.n), v = (S.dias[k] || {}).sono;
      const base = v == null || v === '' ? perfil().sonoMeta + (n < 0 ? 0.5 : -0.5) : num(v);
      salvarDia(k, { sono: clamp(base + n, 0, 16) });
    },
    humor: (el) => { const k = el.dataset.dia, v = Number(el.dataset.v); salvarDia(k, { humor: num((S.dias[k] || {}).humor) === v ? null : v }); },
    exercicio: (el) => { const k = el.dataset.dia; salvarDia(k, { exercicio: clamp(num((S.dias[k] || {}).exercicio) + Number(el.dataset.n), 0, 900) }); },
    adicionar: () => folhaAdicionar(),
    ajustes: (el) => folhaAjustes(el.dataset.foco),
    fechar: () => fecharFolha(),
    'folha-acao': (el) => { if (folha && folha.onAcao) folha.onAcao(el.dataset.acao, el); },
    'toast-acao': () => { const fn = toast.fn; clearTimeout(toast.t); $('#toast-raiz').innerHTML = ''; toast.fn = null; if (fn) fn(); },
    'apagar-exemplos': () => confirmarApagarExemplos(),
    'limpar-feitas': () => limparFeitas(),
    'registrar-salario': () => registrarSalario(),
    ia: (el) => pedirIA(el.dataset.tipo === 'semana' ? 'semana' : 'mes', el.dataset.chave),
    'ia-parar': () => { if (ia.ctl) ia.ctl.abort(); },
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACOES[el.dataset.act];
    if (!fn) return;
    e.preventDefault();
    if (ESCRITA.has(el.dataset.act) && !armazem.pronto) { toast('Ainda abrindo seus dados. Tente de novo em instantes.'); return; }
    fn(el, e);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target;
    if (!f.dataset || !f.dataset.form) return;
    e.preventDefault();
    if (!armazem.pronto) { toast('Ainda abrindo seus dados. Tente de novo em instantes.'); return; }
    if (f.dataset.form === 'nova-tarefa') {
      const inp = f.querySelector('input[name="titulo"]');
      if (criarTarefaRapida(inp.value, f.dataset.dia)) { rascunhos['nova-tarefa'] = ''; inp.value = ''; }
    } else if (f.dataset.form === 'gasto-rapido') {
      const inp = f.querySelector('input[name="texto"]');
      const g = lerGastoRapido(inp.value);
      if (!g) { toast('Faltou o valor. Escreva, por exemplo: 25 almoço'); return; }
      const id = novoId();
      put('lancamentos', id, { tipo: 'saida', valor: g.valor, descricao: g.descricao, categoria: g.categoria, data: chaveValida(f.dataset.dia) ? f.dataset.dia : hoje(), forma: g.forma, criadoEm: agoraISO() });
      rascunhos['gasto-rapido'] = ''; inp.value = '';
      toast(`${brl(g.valor)} em ${catDe(g.categoria, 'saida').nome}`, { acao: 'Editar', fn: () => folhaLancamento({ id }) });
    } else if (f.dataset.form === 'renda') {
      const c = centavosDe(f.querySelector('input[name="renda"]'));
      if (!c) { toast('Digite quanto você recebe por mês.'); return; }
      const p = S.perfil && typeof S.perfil === 'object' ? { ...S.perfil } : {};
      delete p.exemplo;
      put('perfil', '_', { ...PERFIL_PADRAO, ...p, rendaMensal: c });
      rascunhos['renda-inline'] = ''; rascunhos['renda-inline:c'] = '';
      toast('Renda salva. O plano do mês foi calculado.');
    } else if (f.dataset.form === 'peso') {
      const k = f.dataset.dia;
      const bruto = String(f.querySelector('input[name="peso"]').value || '').replace(',', '.').trim();
      if (!bruto) { salvarDia(k, { peso: null }); toast('Peso apagado deste dia'); return; }
      const v = Number(bruto);
      if (!Number.isFinite(v) || v < 20 || v > 400) { toast('Digite o peso em kg, por exemplo 72,5.'); return; }
      salvarDia(k, { peso: Math.round(v * 10) / 10 });
      toast('Peso registrado');
    }
  });
  let timerNota = 0;
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.matches && t.matches('[data-dinheiro]')) formatarDinheiro(t);
    if (t.id === 'nota-dia') {
      const k = t.dataset.dia;
      const valor = t.value.slice(0, 500);
      clearTimeout(timerNota);
      timerNota = setTimeout(() => salvarDia(k, { nota: valor }, { silencioso: true }), 500);
    } else if (t.id === 'nova-tarefa') rascunhos['nova-tarefa'] = t.value;
    else if (t.id === 'gasto-rapido') { rascunhos['gasto-rapido'] = t.value; const pv = $('#previa-rapido'); if (pv) pv.innerHTML = previaRapido(t.value); }
    else if (t.id === 'busca-extrato') { estado.busca = t.value.slice(0, 60); agendarRender(); }
    else if (t.id === 'renda-inline') { rascunhos['renda-inline'] = t.value; rascunhos['renda-inline:c'] = t.dataset.centavos || '0'; }
  });
  document.addEventListener('keydown', (e) => {
    if (!folha) return;
    if (e.key === 'Escape') { e.preventDefault(); fecharFolha(); return; }
    if (e.key !== 'Tab') return;
    const alvos = $$('#folha-raiz button, #folha-raiz input, #folha-raiz textarea, #folha-raiz select, #folha-raiz [tabindex]:not([tabindex="-1"])').filter((x) => !x.disabled && x.getClientRects().length);
    if (!alvos.length) return;
    const pri = alvos[0], ult = alvos[alvos.length - 1];
    if (e.shiftKey && (document.activeElement === pri || !$('#folha-raiz').contains(document.activeElement))) { e.preventDefault(); ult.focus(); }
    else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
  });

  /* dica dos gráficos: passar o mouse, tocar ou focar com o teclado */
  function mostrarDica(alvo) {
    const html = alvo.getAttribute('data-tip');
    if (!html) return;
    const d = $('#dica');
    d.innerHTML = html;
    d.hidden = false;
    const r = alvo.getBoundingClientRect();
    const w = d.offsetWidth, h = d.offsetHeight;
    const x = clamp(r.left + r.width / 2 - w / 2, 8, window.innerWidth - w - 8);
    let y = r.top - h - 8;
    if (y < 8) y = r.bottom + 8;
    d.style.left = `${x}px`;
    d.style.top = `${y}px`;
  }
  function esconderDica() { const d = $('#dica'); if (d) d.hidden = true; }
  const alvoDica = (e) => (e.target && e.target.closest ? e.target.closest('[data-tip]') : null);
  document.addEventListener('pointerover', (e) => { if (e.pointerType !== 'touch') { const a = alvoDica(e); if (a) mostrarDica(a); } });
  document.addEventListener('pointerout', (e) => { if (e.pointerType !== 'touch') { const a = alvoDica(e); if (a && !(e.relatedTarget && a.contains(e.relatedTarget))) esconderDica(); } });
  document.addEventListener('pointerdown', (e) => { const a = alvoDica(e); if (a && e.pointerType === 'touch') mostrarDica(a); else if (!a) esconderDica(); });
  document.addEventListener('focusin', (e) => { const a = alvoDica(e); if (a) mostrarDica(a); });
  document.addEventListener('focusout', (e) => { if (alvoDica(e)) esconderDica(); });
  window.addEventListener('scroll', esconderDica, { passive: true });

  /* virada do dia com o app aberto */
  function verificarVirada() {
    const hj = hoje();
    if (hj === estado.hojeRef) return;
    if (estado.dia === estado.hojeRef) estado.dia = hj;
    if (estado.mes === mesDe(estado.hojeRef)) estado.mes = mesDe(hj);
    estado.hojeRef = hj;
    agendarRender();
  }
  setInterval(verificarVirada, 60000);
  function descarregar() {
    if (armazem.modo === 'nuvem') nuvem.descarregarTudo();
    else if (armazem.modo === 'local') local.gravar();
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') descarregar(); else verificarVirada(); });
  window.addEventListener('pagehide', descarregar);
  window.addEventListener('storage', (e) => { if (armazem.modo === 'local' && e.key === CHAVE_LOCAL) { local.carregar(); agendarRender(); } });

  /* ═══════════ início ═══════════ */
  function ficouPronto() {
    if (armazem.pronto) return;
    armazem.pronto = true;
    agendarRender();
  }
  function usarLocal(aviso) {
    armazem.modo = 'local';
    armazem.aviso = aviso || '';
    local.carregar();
    ficouPronto();
  }
  async function iniciar() {
    lerUI();
    render();
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { baixar.direto = true; usarLocal(''); return; }
    c.use('sample').then((fn) => { if (typeof fn === 'function') { ia.fn = fn; agendarRender(); } }).catch(() => {});
    c.use('downloads').then((d) => { if (d && typeof d.save === 'function') baixar.fn = d; }).catch(() => {});
    let db = null, user = null, uid = null, pode = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { db = null; }
    try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
    if (!db || !uid || !ID_OK.test(uid)) { usarLocal('Para guardar seus dados na sua conta, entre no claude.ai. Por enquanto, eles ficam só neste navegador.'); return; }
    try { pode = await user.can('data.write'); } catch (e) { pode = null; }
    if (pode === false) { usarLocal('Você só pode ver este app. Seus registros ficam só neste navegador.'); return; }
    nuvem.db = db;
    nuvem.raiz = db.doc(`data/users/${uid}/emdia`);
    armazem.modo = 'nuvem';
    nuvem.assinar();
    setTimeout(ficouPronto, 7000);
  }
  iniciar();
})();
</script>
