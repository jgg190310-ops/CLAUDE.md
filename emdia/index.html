<style>
/* Em Dia · uma folhinha de parede abre o dia; abaixo, fichas de rotina, dinheiro e saúde numa coluna só, com as abas ao alcance do polegar. */
:root {
  --bg: #EFF1F4;          /* mesa */
  --surface: #FFFFFF;     /* ficha */
  --surface-2: #F5F6F8;
  --seg-sel: #FFFFFF;
  --ink: #15171C;         /* tinta de impressão */
  --ink-2: #444955;
  --muted: #5F6471;
  --line: #E0E3E9;
  --line-2: #C6CAD3;
  --accent: #1F45C7;      /* azul de caneta e de carimbo */
  --accent-2: #9DB0EE;
  --accent-soft: #E6EBFB;
  --on-accent: #FFFFFF;
  --red: #C8202A;         /* domingo e feriado na folhinha; atraso */
  --red-soft: #FBE8E9;
  --on-red: #FFFFFF;
  --green: #147A40;
  --green-soft: #E1F2E7;
  --amber: #9A5800;
  --amber-soft: #FAEED8;
  --amber-mark: #E39A1B;
  --paper: #FFFFFF;
  --binding: #1A1C22;
  --on-binding: #F4F5F7;
  --toast-bg: #1A1C22;
  --toast-fg: #F4F5F7;
  --toast-acao: #AFC0FF;
  --stamp-blend: multiply;
  --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 10px 26px -14px rgba(20, 24, 40, .3);
  --shadow-sm: 0 1px 2px rgba(20, 24, 40, .1);
  --veu: rgba(12, 14, 20, .44);

  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --fs-xs: .75rem;
  --fs-sm: .875rem;
  --fs-md: 1rem;
  --fs-lg: 1.1875rem;
  --fs-xl: 2.125rem;
  --fs-hero: 3rem;

  --r-card: 12px;
  --r-field: 10px;
  --abas-h: 64px;
  --col: 600px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F13; --surface: #171A20; --surface-2: #1E222A; --seg-sel: #2C313C;
    --ink: #ECEEF2; --ink-2: #BAC0CB; --muted: #8E94A2; --line: #282C35; --line-2: #3B404B;
    --accent: #8FA6FF; --accent-2: #4A5DA8; --accent-soft: #1C2546; --on-accent: #0D0F13;
    --red: #FF6B70; --red-soft: #3A1B1E; --on-red: #1A0809;
    --green: #4CD38A; --green-soft: #11301E; --amber: #F2AE4B; --amber-soft: #3A2A12; --amber-mark: #E9A23B;
    --paper: #1B1E25; --binding: #2A2E38; --on-binding: #ECEEF2;
    --toast-bg: #ECEEF2; --toast-fg: #15171C; --toast-acao: #1F45C7; --stamp-blend: normal;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 30px -16px rgba(0, 0, 0, .8); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --veu: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F13; --surface: #171A20; --surface-2: #1E222A; --seg-sel: #2C313C;
  --ink: #ECEEF2; --ink-2: #BAC0CB; --muted: #8E94A2; --line: #282C35; --line-2: #3B404B;
  --accent: #8FA6FF; --accent-2: #4A5DA8; --accent-soft: #1C2546; --on-accent: #0D0F13;
  --red: #FF6B70; --red-soft: #3A1B1E; --on-red: #1A0809;
  --green: #4CD38A; --green-soft: #11301E; --amber: #F2AE4B; --amber-soft: #3A2A12; --amber-mark: #E9A23B;
  --paper: #1B1E25; --binding: #2A2E38; --on-binding: #ECEEF2;
  --toast-bg: #ECEEF2; --toast-fg: #15171C; --toast-acao: #1F45C7; --stamp-blend: normal;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 12px 30px -16px rgba(0, 0, 0, .8); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
  --veu: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--fs-md); line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
html.com-folha, html.com-folha body { overflow: hidden; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.25em; }
.mono, .valor { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* estrutura */
.app { max-width: var(--col); margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(var(--abas-h) + 104px); }
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-inline: -16px; padding: 8px 12px 8px 18px; background: var(--bg); }
.marca-carimbo { display: inline-block; font-family: var(--f-display); font-weight: 900; font-size: 1.0625rem; line-height: 1.2; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); border: 2px solid currentColor; border-radius: 6px; padding: 1px 6px 0 9px; box-shadow: inset 0 0 0 1.5px var(--bg), inset 0 0 0 3px currentColor; transform: rotate(-4deg); }
.topo-dir { display: flex; align-items: center; gap: 4px; }
.sync { font-size: var(--fs-xs); color: var(--muted); }
.btn-icone { width: 44px; height: 44px; display: inline-grid; place-items: center; flex: none; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); padding: 0; }
.btn-icone:hover { background: var(--surface-2); color: var(--ink); }
.btn-icone .ic { width: 24px; height: 24px; }
main { display: block; outline: none; }
.pilha { display: grid; gap: 12px; }
.tela-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-block: 6px 16px; }
.tela-titulo { font-family: var(--f-display); font-weight: 800; font-size: var(--fs-xl); line-height: 1; letter-spacing: .01em; }
.secao-tit { margin: 22px 2px 10px; }

.abas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.abas-in { max-width: var(--col); margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: var(--abas-h); }
.aba { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: .75rem; font-weight: 700; padding: 0; }
.aba .ic { width: 24px; height: 24px; }
.aba[aria-current="page"] { color: var(--accent); }
.aba[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: currentColor; }
.fab { position: fixed; z-index: 31; right: max(16px, calc((100% - var(--col)) / 2 + 16px)); bottom: calc(var(--abas-h) + 16px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; padding: 0; box-shadow: 0 10px 22px -10px rgba(31, 69, 199, .8), var(--shadow-sm); }
.fab .ic { width: 28px; height: 28px; stroke-width: 2.3; }
.fab:active { transform: scale(.95); }

/* folhinha */
.saudacao { font-size: var(--fs-lg); font-weight: 600; color: var(--ink-2); margin: 2px 2px 10px; }
.folhinha { position: relative; background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); }
.folhinha-topo { position: relative; display: flex; justify-content: space-between; align-items: baseline; padding: 9px 16px 13px; border-radius: 6px 6px 0 0; background: var(--binding); color: var(--on-binding); font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; line-height: 1.1; letter-spacing: .16em; text-transform: uppercase; }
.folhinha-topo::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: -4px; height: 8px; background: radial-gradient(circle, var(--paper) 2.6px, transparent 3.1px) 0 50% / 11px 8px repeat-x; }
.folhinha-folha { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; padding: 18px 4px 0; text-align: center; }
.folhinha-centro { display: grid; justify-items: center; min-width: 0; }
.folhinha-num { font-family: var(--f-display); font-weight: 900; font-size: clamp(7.5rem, 38vw, 10.5rem); line-height: .8; letter-spacing: -.02em; color: var(--ink); padding-top: .04em; }
.folhinha-semana { margin-top: 12px; font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
.folhinha .vermelho { color: var(--red); }
.folhinha-feriado { margin-top: 4px; font-weight: 700; font-size: var(--fs-sm); color: var(--red); }
.folhinha-feriado.facultativo { color: var(--ink-2); }
.folhinha-nav { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.folhinha-nav:hover { background: var(--surface-2); color: var(--ink); }
.folhinha-nav .ic { width: 26px; height: 26px; }
.folhinha-rodape { display: flex; justify-content: space-between; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin: 14px 16px 0; padding: 10px 0; border-top: 1px dashed var(--line-2); font-size: var(--fs-sm); color: var(--ink-2); }
.folhinha-prox { margin: 0 16px; padding-bottom: 12px; font-size: var(--fs-xs); color: var(--muted); }
.folhinha-prox strong { color: var(--ink-2); }
.lua-rot { display: inline-flex; align-items: center; gap: 6px; }
.lua { flex: none; }
.lua-sombra { fill: var(--line); }
.lua-luz { fill: var(--ink-2); }
.carimbo { position: absolute; top: 20px; right: 10px; z-index: 2; font-family: var(--f-display); font-weight: 900; font-size: 1.625rem; line-height: 1; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding: 7px 9px 4px 13px; border: 3px solid currentColor; border-radius: 8px; box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 4px currentColor; transform: rotate(-11deg); opacity: .9; mix-blend-mode: var(--stamp-blend); filter: url(#tinta); pointer-events: none; }
.carimbo.oculto { display: none; }
.carimbo.anim { animation: carimbar .45s cubic-bezier(.2, .9, .25, 1) both; }
.folhinha.baque { animation: baque .2s .26s; }
.virada-frente .folhinha-centro { animation: virar-frente .22s ease-out; }
.virada-tras .folhinha-centro { animation: virar-tras .22s ease-out; }
.chip-hoje { display: flex; align-items: center; gap: 6px; margin: 12px auto 0; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: var(--fs-sm); }

.semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 12px; }
.semana-dia { display: grid; justify-items: center; gap: 1px; min-width: 0; padding: 7px 0 5px; border-radius: 10px; border: 1px solid transparent; background: transparent; }
.semana-dia:hover { background: var(--surface-2); }
.semana-ini { font-size: .6875rem; font-weight: 800; letter-spacing: .06em; color: var(--muted); }
.semana-num { font-family: var(--f-display); font-weight: 800; font-size: 1.375rem; line-height: 1.05; }
.semana-dia.hoje .semana-num { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.semana-dia.vermelho .semana-ini, .semana-dia.vermelho .semana-num { color: var(--red); }
.semana-dia[aria-pressed="true"] { background: var(--surface); border-color: var(--line-2); box-shadow: var(--shadow-sm); }
.semana-marca { height: 14px; display: grid; place-items: center; color: var(--accent); }
.semana-marca .ic { width: 14px; height: 14px; stroke-width: 3; }
.semana-marca.parcial::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }

/* fichas e listas */
.secao { margin-top: 28px; }
.secao-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
.eyebrow { font-family: var(--f-body); font-size: var(--fs-xs); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.contagem { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-2); }
.ficha { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.ficha + .ficha { margin-top: 12px; }
.ficha-corpo { padding: 14px 16px 16px; display: grid; gap: 10px; min-width: 0; }
.ficha-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; padding: 14px 16px 4px; }
.linha-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.divisor { height: 1px; background: var(--line); }
.sub { font-size: var(--fs-sm); color: var(--muted); }
.sub strong { color: var(--ink); }
.link { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 2px; color: var(--accent); font-weight: 700; font-size: var(--fs-sm); }
.link .ic { width: 16px; height: 16px; }

.linha { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; text-align: left; }
.linha + .linha { border-top: 1px solid var(--line); }
.linha-btn { background: none; border: 0; margin: 0; padding: 0; color: inherit; text-align: left; }
button.linha.linha-btn { padding: 10px 14px; }
.linha-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.linha-titulo { font-weight: 600; overflow-wrap: anywhere; }
.linha-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: var(--fs-sm); color: var(--muted); }
.feita .linha-titulo { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.hora { flex: none; font-family: var(--f-mono); font-size: var(--fs-sm); color: var(--ink-2); }
.grupo-rot { padding: 12px 14px 2px; font-size: var(--fs-xs); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.grupo-rot:not(:first-child) { border-top: 1px solid var(--line); margin-top: 2px; }
.grupo-rot.vermelho { color: var(--red); }
.vazio-linha { padding: 8px 14px 12px; color: var(--muted); font-size: var(--fs-sm); }
.ficha-atraso { margin-top: 12px; border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }
.sugestoes { display: grid; gap: 10px; padding: 14px; }

.check { position: relative; flex: none; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); color: transparent; transition: background-color .15s, border-color .15s, transform .15s; }
.check::after { content: ""; position: absolute; inset: -8px; }
.check .ic { width: 18px; height: 18px; stroke-width: 2.6; }
.check.tarefa { border-radius: 8px; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check:active { transform: scale(.9); }

.nova-tarefa { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px 14px; border-top: 1px solid var(--line); }
.nova-tarefa .btn-icone { background: var(--accent); color: var(--on-accent); }
.nova-tarefa .btn-icone:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.08); }

.medidor { position: relative; display: flex; gap: 2px; height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
.medidor > span { display: block; height: 100%; flex: none; background: var(--accent); border-radius: 0 4px 4px 0; }
.medidor > span.pend { background: var(--accent-2); }
.medidor.ok { background: var(--green-soft); }
.medidor.ok > span:first-child { background: var(--green); }
.medidor.aviso { background: var(--amber-soft); }
.medidor.aviso > span:first-child { background: var(--amber-mark); }
.medidor.estouro { background: var(--red-soft); }
.medidor.estouro > span:first-child { background: var(--red); }
.medidor > i.alvo { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--ink); }
.medidor-dia { height: 6px; margin: 0 2px 10px; }
.medidor-rot { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--ink-2); }

/* botões, chips, campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 700; font-size: .9375rem; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn .ic { width: 18px; height: 18px; }
.btn-pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-pri:hover { border-color: var(--accent); filter: brightness(1.08); }
.btn-sm { min-height: 36px; padding: 6px 14px; font-size: var(--fs-sm); }
.btn-largo { width: 100%; margin-top: 12px; }
.btn-perigo { background: var(--red); border-color: var(--red); color: var(--on-red); }
.btn-perigo-txt { border-color: transparent; background: transparent; color: var(--red); padding-inline: 8px; }
.btn-perigo-txt:hover { border-color: transparent; background: var(--red-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; min-height: 38px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: var(--fs-sm); font-weight: 600; }
.chip .ic { width: 16px; height: 16px; color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip-r { position: relative; display: inline-flex; }
.chip-r input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.chip-r span { display: inline-flex; align-items: center; min-height: 38px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: var(--fs-sm); font-weight: 600; }
.chip-r input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip-r input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.entrada { display: block; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: var(--r-field); background: var(--surface); color: var(--ink); font-size: 1rem; }
.entrada::placeholder { color: var(--muted); opacity: 1; }
.entrada:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.entrada-linha { min-height: 44px; border-color: transparent; background: var(--surface-2); }

(() => {

  /* ═══════════ utilidades ═══════════ */

  const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const somaDias = (k, n) => { const d = dataDe(k); d.setDate(d.getDate() + n); return chave(d); };

  const diaSemana = (k) => dataDe(k).getDay();
  const diasNoMes = (y, m) => new Date(y, m, 0).getDate();
  const mesDe = (k) => k.slice(0, 7);

  const ddmm = (k) => `${k.slice(8, 10)}/${k.slice(5, 7)}`;
  const diaCurto = (k) => `${SEM_CURTA[diaSemana(k)]}, ${ddmm(k)}`;
  const diaLongo = (k) => { const d = dataDe(k); return `${SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
  const nomeMes = (mk) => { const [y, m] = mk.split('-').map(Number); return `${MESES[m - 1]} de ${y}`; };
  const mesCurto = (mk) => { const [y, m] = mk.split('-').map(Number); return `${MES_CURTO[m - 1]}/${String(y).slice(2)}`; };

  /* ═══════════ números e dinheiro (sempre em centavos) ═══════════ */
  const F_BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const F_N2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const F_N1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const F_N0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
  const F_L = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
  const F_CMP = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
  const brl = (c) => F_BRL.format(Math.abs(Math.round(num(c))) / 100);
  const brlNeg = (c) => (num(c) < 0 ? '−' : '') + brl(c);
  const brlSinal = (c) => (num(c) > 0 ? '+' : num(c) < 0 ? '−' : '') + brl(c);
  const brlCurto = (c) => { const v = Math.abs(num(c)) / 100; return (num(c) < 0 ? '−' : '') + 'R$ ' + (v >= 1000 ? F_CMP.format(v) : F_N0.format(v)); };
  const n2 = (c) => F_N2.format(Math.round(num(c)) / 100);
  const pct = (v) => `${F_N0.format(num(v))}%`;
  const fmtMl = (ml) => (num(ml) >= 1000 ? `${F_L.format(num(ml) / 1000)} L` : `${F_N0.format(num(ml))} ml`);
  const fmtHoras = (h) => { const v = num(h); const hh = Math.floor(v); const mm = Math.round((v - hh) * 60); return mm ? `${hh}h${pad(mm)}` : `${hh}h`; };
  const fmtMin = (m) => `${F_N0.format(num(m))} min`;

  /* ═══════════ calendário brasileiro ═══════════ */
  function pascoa(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
    return `${y}-${pad(mes)}-${pad(dia)}`;
  }
  const cacheFeriados = new Map();
  function feriadosDoAno(y) {
    if (cacheFeriados.has(y)) return cacheFeriados.get(y);
    const f = new Map();
    const fixos = [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'], ['09-07', 'Independência do Brasil'], ['10-12', 'Nossa Senhora Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'], ['11-20', 'Dia da Consciência Negra'], ['12-25', 'Natal']];
    for (const [md, nome] of fixos) f.set(`${y}-${md}`, { nome, nacional: true, bancario: true });
    const p = pascoa(y);
    f.set(somaDias(p, -48), { nome: 'Carnaval', nacional: false, bancario: true });
    f.set(somaDias(p, -47), { nome: 'Carnaval', nacional: false, bancario: true });
    f.set(somaDias(p, -2), { nome: 'Sexta-feira Santa', nacional: true, bancario: true });
    f.set(p, { nome: 'Páscoa', nacional: false, bancario: false });
    f.set(somaDias(p, 60), { nome: 'Corpus Christi', nacional: false, bancario: false });
    cacheFeriados.set(y, f);
    return f;
  }
  const feriado = (k) => feriadosDoAno(Number(k.slice(0, 4))).get(k) || null;
  const vermelho = (k) => diaSemana(k) === 0 || !!(feriado(k) && feriado(k).nacional);
  const diaUtil = (k) => { const w = diaSemana(k); const f = feriado(k); return w !== 0 && w !== 6 && !(f && f.bancario); };
  const proximoDiaUtil = (k) => { let d = k; for (let i = 0; i < 12 && !diaUtil(d); i++) d = somaDias(d, 1); return d; };
  function proximoFeriado(k) {
    for (let i = 1; i <= 400; i++) {
      const d = somaDias(k, i); const f = feriado(d);
      if (f && f.nome !== 'Páscoa' && !(f.nome === 'Carnaval' && feriado(somaDias(d, -1)) && feriado(somaDias(d, -1)).nome === 'Carnaval')) return { dia: d, nome: f.nome, nacional: f.nacional, em: i };
    }
    return null;
  }
  /* Fase da lua pela idade média (ciclo sinódico). No Brasil se diz que a fase dura até a próxima: nova, crescente, cheia, minguante. */
  function lua(k) {
    const ref = Date.UTC(2000, 0, 6, 18, 14);
    const ciclo = 29.530588853;
    const idade = ((((dataDe(k).getTime() - ref) / 864e5) % ciclo) + ciclo) % ciclo;
    const nome = idade < 7.38 ? 'Lua nova' : idade < 14.77 ? 'Lua crescente' : idade < 22.15 ? 'Lua cheia' : 'Lua minguante';
    return { f: idade / ciclo, nome };
  }
  /* Desenhada como se vê no hemisfério sul: a crescente acende do lado esquerdo, em forma de C. */
  function svgLua(f) {
    const r = 8, cx = 10, cy = 10;
    const t = Math.cos(2 * Math.PI * f);
    const rx = (Math.abs(t) * r).toFixed(2);
    const esquerda = f < 0.5;
    const fina = t > 0;
    const s1 = esquerda ? 0 : 1;
    const s2 = esquerda ? (fina ? 1 : 0) : (fina ? 0 : 1);
    const d = `M${cx} ${cy - r}A${r} ${r} 0 0 ${s1} ${cx} ${cy + r}A${rx} ${r} 0 0 ${s2} ${cx} ${cy - r}Z`;
    return `<svg class="lua" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle class="lua-sombra" cx="${cx}" cy="${cy}" r="${r}"/><path class="lua-luz" d="${d}"/></svg>`;
  }

  /* ═══════════ categorias e textos fixos ═══════════ */
  const CATS = [
    { id: 'moradia', nome: 'Moradia', g: 'nec' },
    { id: 'casa', nome: 'Contas da casa', g: 'nec' },
    { id: 'mercado', nome: 'Mercado', g: 'nec' },
    { id: 'transporte', nome: 'Transporte', g: 'nec' },

    { id: 'salario', nome: 'Salário', g: 'ent' },

  const CAT = Object.fromEntries(CATS.map((c) => [c.id, c]));
  const catDe = (id, tipo) => CAT[id] || (tipo === 'entrada' ? CAT.outrasent : CAT.outros);
  const FORMAS = [['pix', 'Pix'], ['debito', 'Débito'], ['credito', 'Crédito'], ['dinheiro', 'Dinheiro'], ['boleto', 'Boleto']];
  const nomeForma = (v) => { const f = FORMAS.find(([x]) => x === v); return f ? f[1] : ''; };
  const HUMORES = [[1, 'Péssimo'], [2, 'Ruim'], [3, 'Normal'], [4, 'Bem'], [5, 'Ótimo']];
  const SUGESTOES_HABITOS = ['Ler 20 minutos', 'Caminhar 30 minutos', 'Anotar os gastos do dia', 'Dormir antes das 23h', 'Alongar 10 minutos', 'Meditar 5 minutos'];
  const SUGESTOES_CONTAS = [['Aluguel', 'moradia', 10], ['Condomínio', 'moradia', 10], ['Luz', 'casa', 15], ['Água', 'casa', 15], ['Internet', 'casa', 15], ['Celular', 'casa', 15], ['Plano de saúde', 'saude', 10], ['Streaming', 'assinaturas', 15]];

  const BOCAS = { 1: 'M8 16.6q4-3.6 8 0', 2: 'M8.6 16q3.4-2 6.8 0', 3: 'M8.6 15.4h6.8', 4: 'M8.4 14.6q3.6 2.4 7.2 0', 5: 'M8 14q4 4.4 8 0' };
  const icHumor = (v) => `<svg class="face" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle class="olho" cx="9" cy="10" r="1.1"/><circle class="olho" cx="15" cy="10" r="1.1"/><path d="${BOCAS[v] || BOCAS[3]}"/></svg>`;
  const icCopo = () => '<svg class="copo-ic" viewBox="0 0 24 24" aria-hidden="true"><path class="copo-agua" d="M7.7 9.5h8.6l-.9 9.4a1.4 1.4 0 0 1-1.4 1.3H10a1.4 1.4 0 0 1-1.4-1.3z"/><path class="copo-borda" d="M5.6 4h12.8l-1.5 15.1a1.9 1.9 0 0 1-1.9 1.7H9a1.9 1.9 0 0 1-1.9-1.7z"/></svg>';
  function icStatus(s) {

  /* ═══════════ dados ═══════════ */
  const COLECOES = ['habitos', 'tarefas', 'lancamentos', 'contas', 'caixinhas', 'dias'];
  const S = { perfil: null, habitos: {}, tarefas: {}, lancamentos: {}, contas: {}, caixinhas: {}, dias: {} };
  const PERFIL_PADRAO = { nome: '', rendaMensal: 0, divisao: { nec: 50, des: 30, fut: 20 }, aguaMeta: 2000, copoMl: 250, sonoMeta: 8, exercicioMeta: 150 };
  function perfil() {
    const p = S.perfil && typeof S.perfil === 'object' ? S.perfil : {};
    const d = { ...PERFIL_PADRAO.divisao, ...(p.divisao && typeof p.divisao === 'object' ? p.divisao : {}) };
    return {
      nome: typeof p.nome === 'string' ? p.nome : '',
      rendaMensal: Math.max(0, Math.round(num(p.rendaMensal))),

      aguaMeta: clamp(num(p.aguaMeta, 2000), 250, 6000),

  const armazem = { modo: 'carregando', pronto: false, aviso: '', salvando: 0 };
  function marcarSync(d) {
    armazem.salvando = Math.max(0, armazem.salvando + d);

  }

  /* — só neste navegador (fora do claude.ai, ou sem conta) — */

    timer: 0,
    carregar() {
      try {
        const raw = localStorage.getItem(CHAVE_LOCAL);
        if (raw) aplicarDump(JSON.parse(raw));

    h += k !== hj ? '<button type="button" class="chip-hoje" data-act="ir-hoje">' + ic('hoje') + 'Voltar para hoje</button>' : '';
    h += vSemana(k);
    if (!armazem.pronto) return h + carregando();
    if (armazem.aviso) h += `<p class="aviso-armazem" role="note">${esc(armazem.aviso)}</p>`;
    return h + vParaHoje(k, info, hj) + vDinheiroHoje(k, hj) + vSaudeCompacta(k) + vNota(k);
  }
  function vFolhinha(k, info) {
    const d = dataDe(k), y = d.getFullYear();
    const fer = feriado(k);
    const red = vermelho(k);
    const lu = lua(k);
    const doy = difDias(`${y}-01-01`, k) + 1;
    const resto = (bissexto(y) ? 366 : 365) - doy;
    const prox = proximoFeriado(k);
    const ferTxt = fer ? `${esc(fer.nome)}${fer.nacional ? ' · feriado nacional' : fer.nome === 'Páscoa' ? '' : ' · ponto facultativo'}` : '';
    return `<section class="folhinha${estado.carimbar ? ' baque' : ''}" aria-label="${esc(diaLongo(k))} de ${y}${info.emDia ? ', dia em dia' : ''}">
      <div class="folhinha-topo" aria-hidden="true"><span>${MESES[d.getMonth()]}</span><span>${y}</span></div>
      <div class="folhinha-folha${estado.virada ? ` virada-${estado.virada}` : ''}">
        <button type="button" class="folhinha-nav" data-act="dia" data-n="-1" aria-label="Dia anterior">${ic('chev-l')}</button>
        <div class="folhinha-centro" aria-hidden="true">
          <div class="folhinha-num${red ? ' vermelho' : ''}">${d.getDate()}</div>
          <div class="folhinha-semana${red ? ' vermelho' : ''}">${SEMANA[d.getDay()]}</div>
          ${fer ? `<div class="folhinha-feriado${fer.nacional ? '' : ' facultativo'}">${ferTxt}</div>` : ''}
        </div>
        <button type="button" class="folhinha-nav" data-act="dia" data-n="1" aria-label="Próximo dia">${ic('chev-r')}</button>
        <div class="carimbo${info.emDia ? '' : ' oculto'}${info.emDia && estado.carimbar ? ' anim' : ''}" aria-hidden="true">Em dia</div>
      </div>
      <div class="folhinha-rodape"><span class="lua-rot">${svgLua(lu.f)}${lu.nome}</span><span>${doy}º dia do ano · faltam ${resto}</span></div>
      ${prox ? `<p class="folhinha-prox">Próximo feriado: <strong>${esc(diaCurto(prox.dia))}</strong>, ${esc(prox.nome)} (${prox.em === 1 ? 'amanhã' : `em ${prox.em} dias`})</p>` : ''}
    </section>`;
  }
  function vSemana(k) {
    const ini = somaDias(k, -diaSemana(k));
    const hj = hoje();
    let h = '<div class="semana" role="group" aria-label="Dias da semana">';
    for (let i = 0; i < 7; i++) {
      const d = somaDias(ini, i);
      const inf = armazem.pronto && d <= hj ? infoDia(d) : null;
      let marca = '<span class="semana-marca"></span>';
      if (inf && inf.total) marca = inf.emDia ? `<span class="semana-marca">${ic('check')}</span>` : inf.feitos ? '<span class="semana-marca parcial"></span>' : marca;
      h += `<button type="button" class="semana-dia${vermelho(d) ? ' vermelho' : ''}${d === hj ? ' hoje' : ''}" data-act="ir-dia" data-dia="${d}" aria-pressed="${d === k}" aria-label="${esc(diaLongo(d))}${d === hj ? ', hoje' : ''}${inf && inf.emDia ? ', em dia' : ''}"><span class="semana-ini">${SEM_INI[i]}</span><span class="semana-num">${Number(d.slice(8))}</span>${marca}</button>`;
    }
    return h + '</div>';
  }
  function linhaHabito(h, k, hj) {
    const f = feito(h, k);
    const seq = sequencia(h, k <= hj ? k : hj);
    const sub = seq >= 2 ? `${seq} ${todoDia(h) ? 'dias seguidos' : 'vezes seguidas'}` : freqTexto(h);
    return `<div class="linha">
      <button type="button" class="check" data-act="habito" data-id="${esc(h.id)}" data-dia="${k}" aria-pressed="${f}" aria-label="${esc(h.nome)}">${ic('check')}</button>
      <button type="button" class="linha-txt linha-btn" data-act="ver-habito" data-id="${esc(h.id)}"><span class="linha-titulo">${esc(h.nome)}</span><span class="linha-sub">${esc(sub)}</span></button>
    </div>`;
  }
  function linhaTarefa(t, atrasada) {
    const sub = [];
    if (atrasada) sub.push(`desde ${diaCurto(t.data)}`);
    else if (estado.aba === 'rotina' && t.data && t.data !== hoje()) sub.push(diaCurto(t.data));
    return `<div class="linha${t.feita ? ' feita' : ''}">
      <button type="button" class="check tarefa" data-act="tarefa" data-id="${esc(t.id)}" aria-pressed="${!!t.feita}" aria-label="${esc(t.titulo)}">${ic('check')}</button>
      <button type="button" class="linha-txt linha-btn" data-act="editar-tarefa" data-id="${esc(t.id)}"><span class="linha-titulo">${esc(t.titulo)}</span>${sub.length ? `<span class="linha-sub">${esc(sub.join(' · '))}</span>` : ''}</button>
      ${t.hora ? `<span class="hora">${esc(t.hora)}</span>` : ''}
      ${atrasada ? `<button type="button" class="btn btn-sm" data-act="tarefa-hoje" data-id="${esc(t.id)}">Para hoje</button>` : ''}
    </div>`;
  }
  function formNovaTarefa(k) {
    return `<form class="nova-tarefa" data-form="nova-tarefa" data-dia="${k}">
      <label class="sr" for="nova-tarefa">Nova tarefa</label>
      <input id="nova-tarefa" class="entrada entrada-linha" name="titulo" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="Nova tarefa (ex.: Dentista 14h)" value="${esc(rascunhos['nova-tarefa'] || '')}">
      <button class="btn-icone" aria-label="Adicionar tarefa">${ic('plus')}</button>
    </form>`;
  }
  function vParaHoje(k, info, hj) {
    const titulo = k === hj ? 'Para hoje' : k < hj ? 'Neste dia' : 'Planejado para o dia';
    let corpo = '';
    if (!habitosAtivos().length) {
      corpo += `<div class="sugestoes"><p class="sub">Escolha um hábito para acompanhar. Dá para criar o seu depois.</p><div class="chips">${SUGESTOES_HABITOS.map((n) => `<button type="button" class="chip" data-act="sugestao-habito" data-nome="${esc(n)}">${ic('plus')}${esc(n)}</button>`).join('')}</div></div>`;
    } else {
      corpo += '<p class="grupo-rot">Hábitos</p>';
      corpo += info.habs.length ? info.habs.map((h) => linhaHabito(h, k, hj)).join('') : `<p class="vazio-linha">Nenhum hábito marcado para ${SEMANA[diaSemana(k)]}.</p>`;
    }
    corpo += '<p class="grupo-rot">Tarefas</p>';
    corpo += info.tars.length ? info.tars.map((t) => linhaTarefa(t, false)).join('') : `<p class="vazio-linha">${k === hj ? 'Nada marcado para hoje.' : 'Nada marcado neste dia.'}</p>`;
    corpo += formNovaTarefa(k);
    const atr = k === hj ? atrasadas(hj) : [];
    const prog = info.total ? `<span class="contagem">${info.feitos} de ${info.total}${info.emDia ? ' · tudo feito' : ''}</span>` : '';
    return `<section class="secao" aria-labelledby="t-dia">
      <div class="secao-cab"><h2 class="eyebrow" id="t-dia">${titulo}</h2>${prog}</div>
      ${info.total ? `<div class="medidor medidor-dia${info.emDia ? ' ok' : ''}" role="progressbar" aria-label="Progresso do dia" aria-valuemin="0" aria-valuemax="${info.total}" aria-valuenow="${info.feitos}"><span style="width:${(info.feitos / info.total) * 100}%"></span></div>` : ''}
      <div class="ficha">${corpo}</div>
      ${atr.length ? `<div class="ficha ficha-atraso"><p class="grupo-rot vermelho">Ficou para trás</p>${atr.map((t) => linhaTarefa(t, true)).join('')}</div>` : ''}
    </section>`;
  }
  function contasProximas(hj) {
    const mk = mesDe(hj);
    return contasDoMes(mk).map((c) => ({ c, st: statusConta(c, mk, hj) })).filter((x) => ['atrasada', 'hoje', 'logo', 'semana'].includes(x.st.tipo)).sort((a, b) => a.st.venc.localeCompare(b.st.venc));
  }
  function linhaConta(c, mk, hj) {
    const st = statusConta(c, mk, hj);
    const valor = st.pg ? num(st.pg.valor) : num(c.valor);
    let sub;
    if (st.tipo === 'paga') sub = `<span>${esc(st.texto)}${st.pg.forma ? ` · ${esc(nomeForma(st.pg.forma))}` : ''}</span>`;
    else {
      const extra = st.util !== st.venc && st.tipo !== 'atrasada' ? ` · 1º dia útil ${diaCurto(st.util)}` : '';
      sub = `<span class="selo selo-${st.tipo}">${esc(st.texto)}</span><span>${esc(diaCurto(st.venc) + extra)}</span>`;
    }
    const acao = st.tipo === 'paga'
      ? `<span class="carimbo-pago${estado.carimboConta === c.id ? ' anim' : ''}" role="img" aria-label="Paga">Pago</span>`
      : `<button type="button" class="btn btn-sm${st.tipo === 'atrasada' || st.tipo === 'hoje' ? ' btn-pri' : ''}" data-act="pagar" data-id="${esc(c.id)}" data-mes="${mk}">Pagar</button>`;
    return `<div class="linha conta">
      <button type="button" class="linha-txt linha-btn" data-act="editar-conta" data-id="${esc(c.id)}"><span class="linha-titulo">${esc(c.nome)}</span><span class="linha-sub">${sub}</span></button>
      <span class="valor">${brl(valor)}</span>
      ${acao}
    </div>`;
  }
  function vDinheiroHoje(k, hj) {
    let topo;
    if (k === hj) {
      const r = resumoMes(mesDe(hj), hj);
      if (!r.renda) {
        topo = `<div class="ficha-corpo"><p class="eyebrow">Pode gastar hoje</p><p>Diga quanto você recebe por mês e o app calcula quanto dá para gastar por dia, já separando contas e o que guardar.</p><div><button type="button" class="btn btn-pri" data-act="ajustes" data-foco="renda">Informar renda</button></div></div>`;
      } else if (r.diaria <= 0) {
        topo = `<div class="ficha-corpo"><div class="linha-cab"><p class="eyebrow">Sem folga este mês</p><button type="button" class="btn btn-sm btn-pri" data-act="novo-lanc" data-tipo="saida">${ic('plus')}Gasto</button></div><p class="hero-valor ruim">${brlNeg(r.livre)}</p><p class="sub">Contas, gastos e a meta de guardar já passam do que entra. Segure o que não for essencial até o fim do mês.</p></div>`;
      } else {
        const neg = r.podeHoje < 0;
        const usado = clamp(r.varHoje / r.diaria, 0, 1);
        topo = `<div class="ficha-corpo">
          <div class="linha-cab"><p class="eyebrow">${neg ? 'Passou do limite de hoje' : 'Pode gastar hoje'}</p><button type="button" class="btn btn-sm btn-pri" data-act="novo-lanc" data-tipo="saida">${ic('plus')}Gasto</button></div>
          <p class="hero-valor${neg ? ' ruim' : ''}">${brl(Math.abs(r.podeHoje))}</p>
          <p class="sub">Limite de <strong>${brl(r.diaria)}</strong> por dia até ${ddmm(fimDoMes(hj))}. Gasto hoje: <strong>${brl(r.varHoje)}</strong>.</p>
          <div class="medidor${neg ? ' estouro' : usado > 0.8 ? ' aviso' : ''}" role="progressbar" aria-label="Gasto de hoje" aria-valuemin="0" aria-valuemax="${r.diaria}" aria-valuenow="${Math.min(r.varHoje, r.diaria)}"><span style="width:${usado * 100}%"></span></div>
        </div>`;
      }
    } else {
      const ls = lista('lancamentos').filter((l) => l.data === k).sort((a, b) => String(a.criadoEm || '').localeCompare(String(b.criadoEm || '')));
      topo = `<div class="ficha-corpo"><div class="linha-cab"><p class="eyebrow">Movimentos do dia</p><button type="button" class="btn btn-sm" data-act="novo-lanc" data-tipo="saida" data-dia="${k}">${ic('plus')}Gasto</button></div>${ls.length ? '' : '<p class="sub">Nenhum gasto ou entrada registrado neste dia.</p>'}</div>${ls.length ? `<div>${ls.map(linhaLanc).join('')}</div>` : ''}`;
    }
    const prox = k === hj ? contasProximas(hj) : [];
    const contas = prox.length ? `<div class="divisor"></div><p class="grupo-rot">Contas para os próximos dias</p>${prox.map((x) => linhaConta(x.c, mesDe(hj), hj)).join('')}` : '';
    return `<section class="secao" aria-labelledby="t-din"><div class="secao-cab"><h2 class="eyebrow" id="t-din">Dinheiro</h2><button type="button" class="link" data-act="aba" data-aba="dinheiro">Ver o mês ${ic('chev-r')}</button></div><div class="ficha">${topo}${contas}</div></section>`;
  }
  function blocoAgua(k, d, p) {
    const copo = p.copoMl;
    const meta = Math.max(copo, p.aguaMeta);
    const n = Math.min(16, Math.ceil(meta / copo));
    const ml = num(d.agua);
    const cheios = Math.floor(ml / copo);
    let copos = '';
    for (let i = 1; i <= n; i++) copos += `<button type="button" class="copo${i <= cheios ? ' cheio' : ''}" data-act="copo" data-dia="${k}" data-i="${i}" aria-pressed="${i <= cheios}" aria-label="${i} ${i === 1 ? 'copo' : 'copos'}">${icCopo()}</button>`;
    return `<div class="ficha-corpo">
      <div class="linha-cab"><span class="rotulo-ic">${ic('gota')}Água</span><span class="sub"><strong>${fmtMl(ml)}</strong> de ${fmtMl(meta)}</span></div>
      <div class="copos" role="group" aria-label="Copos de ${copo} ml">${copos}<button type="button" class="copo mais" data-act="copo-mais" data-dia="${k}" aria-label="Mais um copo">${ic('plus')}</button></div>
    </div>`;
  }
  function blocoSono(k, d, p) {
    const v = d.sono;
    const tem = v != null && v !== '';
    return `<div class="ficha-corpo">
      <span class="rotulo-ic">${ic('lua')}Sono</span>
      <div class="passo" role="group" aria-label="Horas dormidas">
        <button type="button" class="btn-icone" data-act="sono" data-dia="${k}" data-n="-0.5" aria-label="Menos meia hora">−</button>
        <output class="passo-valor" aria-live="polite">${tem ? fmtHoras(v) : '—'}</output>
        <button type="button" class="btn-icone" data-act="sono" data-dia="${k}" data-n="0.5" aria-label="Mais meia hora">+</button>
      </div>
      <span class="sub">${tem ? `meta de ${fmtHoras(p.sonoMeta)}` : 'Toque em + ou − para registrar'}</span>
    </div>`;
  }
  function blocoHumor(k, d) {
    const h = num(d.humor);
    return `<div class="ficha-corpo">
      <span class="rotulo-ic">Humor</span>
      <div class="humores" role="group" aria-label="Como você está">${HUMORES.map(([v, n]) => `<button type="button" class="humor" data-act="humor" data-dia="${k}" data-v="${v}" aria-pressed="${h === v}" aria-label="${n}" title="${n}">${icHumor(v)}</button>`).join('')}</div>
      <span class="sub">${h ? HUMORES[h - 1][1] : 'Toque no rosto que mais combina'}</span>
    </div>`;
  }
  function vSaudeCompacta(k) {
    const d = S.dias[k] || {};
    const p = perfil();
    return `<section class="secao" aria-labelledby="t-sau"><div class="secao-cab"><h2 class="eyebrow" id="t-sau">Saúde</h2><button type="button" class="link" data-act="aba" data-aba="saude">Ver a semana ${ic('chev-r')}</button></div>
      <div class="ficha">${blocoAgua(k, d, p)}<div class="divisor"></div><div class="dupla">${blocoSono(k, d, p)}${blocoHumor(k, d)}</div></div></section>`;
  }
  function vNota(k) {
    const d = S.dias[k] || {};
    return `<section class="secao"><div class="secao-cab"><h2 class="eyebrow"><label for="nota-dia">Como foi o dia?</label></h2></div>
      <textarea id="nota-dia" class="entrada nota" data-dia="${k}" rows="2" maxlength="500" placeholder="Uma linha sobre ${k === hoje() ? 'hoje' : 'esse dia'}…">${esc(d.nota || '')}</textarea></section>`;
  }

  /* — Rotina — */
  function vRotina() {
    let h = `<header class="tela-cab"><h1 class="tela-titulo">Rotina</h1></header>${segmentos('subRotina', [['habitos', 'Hábitos'], ['tarefas', 'Tarefas']], estado.subRotina)}`;
    if (!armazem.pronto) return h + carregando();
    return h + (estado.subRotina === 'tarefas' ? vTarefas() : vHabitos());
  }
  function vHabitos() {
    const hs = habitosAtivos();
    const hj = hoje();
    if (!hs.length) return `<div class="vazio"><p class="vazio-titulo">Nenhum hábito ainda</p><p>Hábito é o que você quer fazer com frequência. Comece por um destes ou crie o seu.</p><div class="chips">${SUGESTOES_HABITOS.map((n) => `<button type="button" class="chip" data-act="sugestao-habito" data-nome="${esc(n)}">${ic('plus')}${esc(n)}</button>`).join('')}</div><button type="button" class="btn btn-pri" data-act="novo-habito">${ic('plus')}Criar hábito</button></div>`;
    const ini = somaDias(hj, -6);
    const linhas = hs.map((h) => {
      const seq = sequencia(h, hj);
      let pontos = '';
      for (let i = 0; i < 7; i++) {
        const d = somaDias(ini, i);
        const dev = devido(h, d), f = feito(h, d);
        const cls = !dev ? ' fora' : f ? ' feito' : d === hj ? ' hoje' : '';
        pontos += `<span class="ponto${cls}" title="${esc(diaCurto(d))}: ${!dev ? 'não se aplica' : f ? 'feito' : 'não feito'}">${SEM_INI[diaSemana(d)]}</span>`;
      }
      const feitosSemana = Array.from({ length: 7 }, (_, i) => somaDias(ini, i)).filter((d) => devido(h, d) && feito(h, d)).length;
      return `<div class="linha habito">
        <button type="button" class="check" data-act="habito" data-id="${esc(h.id)}" data-dia="${hj}" aria-pressed="${feito(h, hj)}" aria-label="${esc(h.nome)}, hoje"${devido(h, hj) ? '' : ' disabled'}>${ic('check')}</button>
        <button type="button" class="linha-txt linha-btn" data-act="ver-habito" data-id="${esc(h.id)}">
          <span class="linha-titulo">${esc(h.nome)}</span>
          <span class="linha-sub">${esc(freqTexto(h))}${seq >= 2 ? ` · ${seq} ${todoDia(h) ? 'dias seguidos' : 'vezes seguidas'}` : ''}</span>
          <span class="pontos" aria-label="Últimos 7 dias: ${feitosSemana} feitos">${pontos}</span>
        </button>
      </div>`;
    }).join('');
    return `<div class="ficha">${linhas}</div><button type="button" class="btn btn-largo" data-act="novo-habito">${ic('plus')}Novo hábito</button>`;
  }
  function vTarefas() {
    const hj = hoje(), am = somaDias(hj, 1), semana = somaDias(hj, -7);
    const ts = lista('tarefas').filter((t) => t.titulo);
    const grupos = [
      ['Ficou para trás', ts.filter((t) => t.data && t.data < hj && !t.feita).sort((a, b) => a.data.localeCompare(b.data)), true],
      ['Hoje', ts.filter((t) => t.data === hj).sort(ordTarefa)],
      ['Amanhã', ts.filter((t) => t.data === am).sort(ordTarefa)],
      ['Próximos dias', ts.filter((t) => t.data && t.data > am).sort((a, b) => a.data.localeCompare(b.data) || ordTarefa(a, b))],
      ['Sem data', ts.filter((t) => !t.data && !t.feita).sort(ordTarefa)],
      ['Feitas na última semana', ts.filter((t) => t.feita && (!t.data || t.data < hj) && (t.feitaEm || t.data || '') >= semana).sort((a, b) => String(b.feitaEm || b.data || '').localeCompare(String(a.feitaEm || a.data || '')))],
    ].filter((g) => g[1].length);
    let h = `<div class="linha-campos" style="margin-bottom:14px"><button type="button" class="btn btn-pri" data-act="nova-tarefa" data-dia="${hj}">${ic('plus')}Nova tarefa</button></div>`;
    if (!grupos.length) return h + '<div class="vazio"><p class="vazio-titulo">Nenhuma tarefa</p><p>Anote o que precisa fazer, com ou sem data. As de hoje aparecem também na folhinha.</p></div>';
    for (const [nome, itens, atraso] of grupos) h += `<div class="ficha"><p class="grupo-rot${atraso ? ' vermelho' : ''}">${nome}</p>${itens.map((t) => linhaTarefa(t, !!atraso)).join('')}</div>`;
    const velhas = ts.filter((t) => t.feita && (t.feitaEm || t.data || '') < somaDias(hj, -30)).length;
    if (velhas) h += `<button type="button" class="btn btn-largo" data-act="limpar-feitas">${ic('lixo')}Apagar ${velhas} ${velhas === 1 ? 'tarefa feita' : 'tarefas feitas'} há mais de 30 dias</button>`;
    return h;
  }

  /* — Dinheiro — */
  function vDinheiro() {
    const mk = estado.mes, hj = hoje();
    let h = `<header class="tela-cab"><h1 class="tela-titulo">Dinheiro</h1><div class="mes-nav"><button type="button" class="btn-icone" data-act="mes" data-n="-1" aria-label="Mês anterior">${ic('chev-l')}</button><span class="mes-nome" aria-live="polite">${nomeMes(mk)}</span><button type="button" class="btn-icone" data-act="mes" data-n="1" aria-label="Próximo mês">${ic('chev-r')}</button></div></header>`;
    h += segmentos('subDinheiro', [['resumo', 'Resumo'], ['extrato', 'Extrato'], ['contas', 'Contas'], ['caixinhas', 'Caixinhas']], estado.subDinheiro);
    if (!armazem.pronto) return h + carregando();
    const s = estado.subDinheiro;
    return h + (s === 'extrato' ? vExtrato(mk) : s === 'contas' ? vContas(mk, hj) : s === 'caixinhas' ? vCaixinhas(hj) : vResumo(mk, hj));

  function cartaoRenda() {

  function vTermometro(mk, hj, r) {

  function vPlano(r, p) {
    if (!r.renda) return '';
    const grupos = [['nec', 'Essenciais', 'Moradia, contas da casa, mercado, transporte, saúde e educação'], ['des', 'Estilo de vida', 'Comer fora, lazer, compras, assinaturas e cuidados'], ['fut', 'Futuro', 'Guardar, investir e quitar dívidas']];
    const linhas = grupos.map(([g, nome, desc]) => {

      else { cls = tot > alvo ? 'estouro' : tot > alvo * 0.9 ? 'aviso' : ''; st = tot > alvo ? `Passou ${brl(tot - alvo)} do planejado.` : `Ainda cabem ${brl(alvo - tot)}.`; }

  function vCategorias(r) {
    const itens = Object.entries(r.porCat).filter(([c, v]) => catDe(c, 'saida').g !== 'fut' && v > 0).sort((a, b) => b[1] - a[1]);
    if (!itens.length) return '';

      <div class="cats">${top.map(([c, v]) => `<div class="cat-linha"><span class="cat-nome">${c === '_resto' ? 'Demais categorias' : esc(catDe(c, 'saida').nome)}</span><span class="cat-val">${brl(v)} <span class="cat-pct">· ${pct(v / total * 100)}</span></span><span class="cat-barra" style="width:${Math.max(2, (v / max) * 100)}%"></span></div>`).join('')}</div>

  function barraCima(x, y, w, h) {
    if (h <= 0) return '';
    const r = Math.min(4, h, w / 2);
    return `M${x.toFixed(1)} ${(y + h).toFixed(1)}V${(y + r).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)}H${(x + w - r).toFixed(1)}Q${(x + w).toFixed(1)} ${y.toFixed(1)} ${(x + w).toFixed(1)} ${(y + r).toFixed(1)}V${(y + h).toFixed(1)}Z`;
  }
  function barraBaixo(x, y, w, h) {
    if (h <= 0) return '';

  function cabGrafico(id, titulo, temTabela) {

  function graficoSobra(mkFim) {
    const meses = [];

      let e = 0, s = 0, n = 0;
      for (const l of lancsDoMes(m)) {
        const v = Math.max(0, num(l.valor)); n += 1;
        if (l.tipo === 'entrada' && l.categoria !== 'resgate') e += v;
        else if (l.tipo === 'saida' && l.categoria !== 'guardar') s += v;
      }
      return { m, e, s, sobra: e - s, tem: n > 0 };
    });
    const id = 'sobra';
    const titulo = 'Sobra de cada mês';
    const mesAtual = mesDe(hoje());
    const nota = `<p class="graf-sub">Entradas menos gastos. O que foi para as caixinhas conta como sobra.${meses.includes(mesAtual) ? ' O mês atual aparece mais claro porque ainda não fechou.' : ''}</p>`;
    if (dados.filter((d) => d.tem).length < 1) return '';
    if (estado.tabelas[id]) {
      return `<figure class="ficha grafico">${cabGrafico(id, titulo, true)}${nota}<div class="tabela-rolagem"><table class="tabela"><thead><tr><th scope="col">Mês</th><th scope="col" class="num">Entrou</th><th scope="col" class="num">Gastou</th><th scope="col" class="num">Sobra</th></tr></thead><tbody>${dados.map((d) => `<tr><td>${mesCurto(d.m)}</td><td class="num">${d.tem ? brl(d.e) : '—'}</td><td class="num">${d.tem ? brl(d.s) : '—'}</td><td class="num">${d.tem ? brlSinal(d.sobra) : '—'}</td></tr>`).join('')}</tbody></table></div></figure>`;
    }
    const W = 320, H = 168, pl = 4, pr = 4, pt = 22, pb = 26;
    const maxPos = Math.max(0, ...dados.map((d) => (d.tem ? d.sobra : 0)));
    const maxNeg = Math.max(0, ...dados.map((d) => (d.tem ? -d.sobra : 0)));
    const total = (maxPos + maxNeg) || 1;
    const altura = H - pt - pb;
    const y0 = pt + altura * (maxPos / total);
    const bw = (W - pl - pr) / dados.length, bar = Math.min(24, bw * 0.5);
    let s = `<line class="graf-base" x1="${pl}" x2="${W - pr}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}"/>`;

      const cx = pl + bw * i + bw / 2;
      const sel = d.m === mkFim;
      if (d.tem && d.sobra !== 0) {
        const h = Math.max(2, (Math.abs(d.sobra) / total) * altura);

        else s += `<path class="graf-neg${parcial}" d="${barraBaixo(cx - bar / 2, y0, bar, h)}"/>`;
        if (sel) {
          const yv = d.sobra > 0 ? y0 - h - 6 : Math.min(H - pb + 2, y0 + h + 14);
          s += `<text class="graf-valor" x="${cx.toFixed(1)}" y="${yv.toFixed(1)}" text-anchor="${i === dados.length - 1 ? 'end' : 'middle'}" dx="${i === dados.length - 1 ? bar / 2 + 2 : 0}">${esc(brlCurto(d.sobra).replace(/^R\$ /, d.sobra > 0 ? '+R$ ' : 'R$ '))}${d.m === mesAtual ? ' até agora' : ''}</text>`;
        }
      }
      s += `<text class="graf-eixo${sel ? ' sel' : ''}" x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${MES_CURTO[Number(d.m.slice(5)) - 1]}</text>`;
      const tip = d.tem ? `<strong>${esc(brlSinal(d.sobra))}${d.m === mesAtual ? ' até agora' : ''}</strong>${esc(nomeMes(d.m))} · entrou ${esc(brl(d.e))}, gastou ${esc(brl(d.s))}` : `<strong>Sem registros</strong>${esc(nomeMes(d.m))}`;
      s += `<rect class="graf-alvo" x="${(pl + bw * i).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H - 18}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(nomeMes(d.m))}: ${d.tem ? esc(brlSinal(d.sobra)) : 'sem registros'}"/>`;
    });
    return `<figure class="ficha grafico">${cabGrafico(id, titulo, true)}${nota}<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${titulo} nos últimos 6 meses">${s}</svg></figure>`;
  }
  function linhaLanc(l) {

    for (const [d, itens] of grupos) {

  function vContas(mk, hj) {

  function mesesEntre(a, b) { const [y1, m1] = a.split('-').map(Number); const [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); }

  /* — Saúde — */

  function blocoExercicio(k, d, p) {

    return `<div class="ficha-corpo">
      <div class="linha-cab"><span class="rotulo-ic">${ic('pulso')}Exercício</span><span class="sub"><strong>${fmtMin(min)}</strong> neste dia</span></div>
      <div class="chips"><button type="button" class="chip" data-act="exercicio" data-dia="${k}" data-n="-10" aria-label="Tirar 10 minutos">−10</button><button type="button" class="chip" data-act="exercicio" data-dia="${k}" data-n="10">${ic('plus')}10 min</button><button type="button" class="chip" data-act="exercicio" data-dia="${k}" data-n="30">${ic('plus')}30 min</button></div>
      ${meta ? `<div class="medidor-rot"><span>Semana (dom a sáb): <strong>${fmtMin(sem)}</strong> de ${fmtMin(meta)}</span><span>${pct(prog * 100)}</span></div><div class="medidor${sem >= meta ? ' ok' : ''}" role="progressbar" aria-label="Exercício na semana" aria-valuemin="0" aria-valuemax="${meta}" aria-valuenow="${Math.min(sem, meta)}"><span style="width:${prog * 100}%"></span></div>` : ''}
      <p class="nota-fonte">A OMS recomenda pelo menos 150 minutos de atividade moderada por semana.</p>
    </div>`;
  }
  function grafico7(id, titulo, k, campo, meta, fmt) {
    const dias = [];
    for (let i = 6; i >= 0; i--) dias.push(somaDias(k, -i));
    const vals = dias.map((d) => { const v = (S.dias[d] || {})[campo]; return v == null || v === '' ? null : num(v); });
    if (!vals.some((v) => v)) return `<figure class="ficha grafico">${cabGrafico(id, titulo, false)}<p class="vazio-graf">Sem registros nestes 7 dias. Use os campos acima para começar.</p></figure>`;
    if (estado.tabelas[id]) {
      return `<figure class="ficha grafico">${cabGrafico(id, titulo, true)}<table class="tabela"><thead><tr><th scope="col">Dia</th><th scope="col" class="num">Registro</th></tr></thead><tbody>${dias.map((d, i) => `<tr><td>${esc(diaCurto(d))}</td><td class="num">${vals[i] == null ? '—' : esc(fmt(vals[i]))}</td></tr>`).join('')}</tbody></table><p class="graf-sub" style="padding-top:8px">Meta: ${esc(fmt(meta))}</p></figure>`;
    }
    const W = 320, H = 156, pl = 4, pr = 4, pt = 24, pb = 24;
    const max = Math.max(meta || 0, ...vals.map((v) => v || 0)) * 1.12 || 1;
    const bw = (W - pl - pr) / 7, bar = Math.min(24, bw * 0.56);
    const y = (v) => pt + (H - pt - pb) * (1 - v / max);
    const y0 = H - pb;
    let s = '';
    if (meta) { const ym = y(meta); s += `<line class="graf-meta" x1="${pl}" x2="${W - pr}" y1="${ym.toFixed(1)}" y2="${ym.toFixed(1)}"/><text class="graf-meta-txt" x="${pl + 2}" y="${(ym - 5).toFixed(1)}">meta ${esc(fmt(meta))}</text>`; }
    s += `<line class="graf-base" x1="${pl}" x2="${W - pr}" y1="${y0}" y2="${y0}"/>`;
    dias.forEach((d, i) => {
      const v = vals[i];
      const cx = pl + bw * i + bw / 2;
      const sel = d === k;
      if (v) {
        const yt = y(v);
        s += `<path class="graf-barra${sel ? ' sel' : ''}" d="${barraCima(cx - bar / 2, yt, bar, y0 - yt)}"/>`;
        if (sel) s += `<text class="graf-valor" x="${(cx + bar / 2 + 2).toFixed(1)}" y="${(yt - 6).toFixed(1)}" text-anchor="end">${esc(fmt(v))}</text>`;
      }
      s += `<text class="graf-eixo${sel ? ' sel' : ''}" x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${SEM_CURTA[diaSemana(d)]}</text>`;
      const tip = `<strong>${v == null ? 'Sem registro' : esc(fmt(v))}</strong>${esc(diaCurto(d))}`;
      s += `<rect class="graf-alvo" x="${(pl + bw * i).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H - 16}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(diaCurto(d))}: ${v == null ? 'sem registro' : esc(fmt(v))}"/>`;
    });
    return `<figure class="ficha grafico">${cabGrafico(id, titulo, true)}<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)} nos últimos 7 dias">${s}</svg></figure>`;
  }
  function vHumorSemana(k) {
    const dias = [];
    for (let i = 6; i >= 0; i--) dias.push(somaDias(k, -i));
    if (!dias.some((d) => num((S.dias[d] || {}).humor))) return '';
    return `<figure class="ficha grafico">${cabGrafico('humor', 'Humor', false)}<div class="humor-semana">${dias.map((d) => {
      const h = clamp(Math.round(num((S.dias[d] || {}).humor)), 0, 5);
      return `<div class="hs-dia${d === k ? ' sel' : ''}"><span class="hs-face" title="${h ? HUMORES[h - 1][1] : 'sem registro'}">${h ? icHumor(h) : '<span class="hs-vazio" aria-hidden="true">·</span>'}</span><span class="hs-rot">${SEM_CURTA[diaSemana(d)]}</span><span class="sr">${esc(diaCurto(d))}: ${h ? HUMORES[h - 1][1] : 'sem registro'}</span></div>`;
    }).join('')}</div></figure>`;
  }
  function vSaude() {
    const k = estado.dia;
    const d = S.dias[k] || {};
    const p = perfil();
    let h = `<header class="tela-cab"><h1 class="tela-titulo">Saúde</h1>${navDia(k)}</header>`;
    if (!armazem.pronto) return h + carregando();
    h += `<div class="ficha">${blocoAgua(k, d, p)}</div>`;
    h += `<div class="ficha dupla">${blocoSono(k, d, p)}${blocoHumor(k, d)}</div>`;
    h += `<div class="ficha">${blocoExercicio(k, d, p)}</div>`;
    h += `<h2 class="eyebrow secao-tit">Últimos 7 dias</h2><div class="pilha">`;
    h += grafico7('agua', 'Água', k, 'agua', p.aguaMeta, fmtMl);
    h += grafico7('sono', 'Sono', k, 'sono', p.sonoMeta, fmtHoras);
    h += vHumorSemana(k);
    return h + '</div>';
  }

  /* ═══════════ folhas (formulários que sobem de baixo) ═══════════ */
  let folha = null;
  const radioChip = (nome, v, rot, marcado) => `<label class="chip-r"><input type="radio" name="${nome}" value="${esc(v)}"${marcado ? ' checked' : ''}><span>${esc(rot)}</span></label>`;
  const campoDinheiro = (id, nome, c, extra) => `<div class="valor-entrada"><span>R$</span><input id="${id}" name="${nome}" data-dinheiro inputmode="numeric" autocomplete="off" placeholder="0,00" data-centavos="${Math.round(num(c))}" value="${c ? n2(c) : ''}"${extra || ''}></div>`;
  function abrirFolha(titulo, corpo, opts) {
    const o = opts || {};
    const raiz = $('#folha-raiz');
    const voltarFoco = folha ? folha.voltarFoco : document.activeElement;
    raiz.innerHTML = `<div class="veu" data-act="fechar"></div>
      <div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
        <div class="folha-alca" aria-hidden="true"></div>
        <div class="folha-cab"><h2 id="folha-titulo" tabindex="-1">${titulo}</h2><button type="button" class="btn-icone" data-act="fechar" aria-label="Fechar">${ic('x')}</button></div>
        <form id="folha-form" novalidate autocomplete="off"><div class="folha-corpo">${corpo}</div>${o.acoes ? `<div class="folha-acoes">${o.acoes}</div>` : ''}</form>
      </div>`;
    raiz.hidden = false;
    document.documentElement.classList.add('com-folha');
    for (const el of [$('.app'), $('.abas'), $('.fab')]) if (el) el.inert = true;
    folha = { onSubmit: o.onSubmit || null, onAcao: o.onAcao || null, voltarFoco };
    const f = $('#folha-form');
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!folha || !folha.onSubmit) return;
      if (!armazem.pronto) { toast('Ainda abrindo seus dados. Tente de novo em instantes.'); return; }
      folha.onSubmit(new FormData(f), f);
    });
    if (o.aoAbrir) o.aoAbrir(f);
    const alvo = f.querySelector('[data-foco-inicial]') || $('#folha-titulo');
    try { alvo.focus({ preventScroll: true }); } catch (e) { /* ok */ }
  }
  function fecharFolha() {
    if (!folha) return;
    const vf = folha.voltarFoco;
    folha = null;
    const raiz = $('#folha-raiz');
    raiz.innerHTML = '';
    raiz.hidden = true;
    document.documentElement.classList.remove('com-folha');
    for (const el of [$('.app'), $('.abas'), $('.fab')]) if (el) el.inert = false;
    if (vf && document.contains(vf)) { try { vf.focus({ preventScroll: true }); } catch (e) { /* ok */ } }
  }
  function erroCampo(f, sel, msg) {
    const el = f.querySelector(sel);
    const antigo = f.querySelector('.erro-campo');
    if (antigo) antigo.remove();
    const p = document.createElement('p');
    p.className = 'erro-campo';
    p.setAttribute('role', 'alert');
    p.textContent = msg;
    const campo = el ? el.closest('.campo') : null;
    if (campo) campo.appendChild(p); else f.querySelector('.folha-corpo').appendChild(p);
    if (el) { try { el.focus(); } catch (e) { /* ok */ } }
  }
  const centavosDe = (el) => Math.max(0, parseInt((el && el.dataset.centavos) || '0', 10) || 0);
  function formatarDinheiro(el) {
    const dig = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 11);
    const c = dig ? parseInt(dig, 10) : 0;
    el.dataset.centavos = String(c);
    el.value = c ? n2(c) : '';
    try { const L = el.value.length; el.setSelectionRange(L, L); } catch (e) { /* ok */ }
  }

  function folhaAdicionar() {
    const ops = [['novo-lanc', 'saida', 'Gasto', 'seta-baixo'], ['novo-lanc', 'entrada', 'Entrada', 'seta-cima'], ['nova-tarefa', '', 'Tarefa', 'check'], ['novo-habito', '', 'Hábito', 'repetir'], ['nova-conta', '', 'Conta fixa', 'boleto'], ['guardar-menu', '', 'Guardar dinheiro', 'caixa']];
    abrirFolha('Adicionar', `<div class="grade-add">${ops.map(([a, t, n, i]) => `<button type="button" class="add-op" data-act="${a}"${t ? ` data-tipo="${t}"` : ''}${a === 'nova-tarefa' ? ` data-dia="${estado.aba === 'hoje' ? estado.dia : hoje()}"` : ''}>${ic(i)}<span>${n}</span></button>`).join('')}</div>`);
  }

  function folhaLancamento(o) {
    const id = o.id || null;
    const l = id ? S.lancamentos[id] : null;
    if (id && !l) return;
    const vinculo = !!(l && (l.contaId || l.caixinhaId));
    const tipo = l ? l.tipo : (o.tipo === 'entrada' ? 'entrada' : 'saida');
    const dia = l ? l.data : (o.dia && chaveValida(o.dia) ? o.dia : (estado.aba === 'hoje' ? estado.dia : hoje()));
    const chipsCats = (tp, atual) => CATS.filter((c) => (tp === 'entrada' ? c.g === 'ent' && (c.id !== 'resgate' || atual === 'resgate') : c.g !== 'ent')).map((c) => radioChip('categoria', c.id, c.nome, c.id === atual)).join('');
    const catAtual = l ? l.categoria : (tipo === 'entrada' ? 'salario' : 'mercado');
    const corpo = `
      ${vinculo ? '' : `<div class="segmentos" role="radiogroup" aria-label="Tipo" style="margin:0">${[['saida', 'Gasto'], ['entrada', 'Entrada']].map(([v, n]) => `<label class="chip-r" style="flex:1"><input type="radio" name="tipo" value="${v}"${v === tipo ? ' checked' : ''}><span style="width:100%;justify-content:center">${n}</span></label>`).join('')}</div>`}
      <div class="campo"><label for="f-valor">Valor</label>${campoDinheiro('f-valor', 'valor', l ? l.valor : 0, l ? '' : ' data-foco-inicial')}</div>
      <div class="campo"><label for="f-desc">Descrição <span class="opcional">(opcional)</span></label><input id="f-desc" class="entrada" name="descricao" maxlength="80" placeholder="${tipo === 'entrada' ? 'Ex.: Salário de outubro' : 'Ex.: Mercado da semana'}" value="${esc(l ? l.descricao || '' : '')}"></div>
      <fieldset class="campo"><legend>Categoria</legend><div class="chips" id="f-cats">${chipsCats(tipo, catAtual)}</div></fieldset>
      <div class="campo"><label for="f-data">Data</label><input id="f-data" class="entrada" type="date" name="data" required value="${dia}"></div>
      <fieldset class="campo" id="f-formas"${tipo === 'entrada' ? ' hidden' : ''}><legend>Como pagou</legend><div class="chips">${FORMAS.map(([v, n]) => radioChip('forma', v, n, (l && l.forma ? l.forma : 'pix') === v)).join('')}</div></fieldset>
      ${vinculo ? `<p class="sub">Este lançamento está ligado ${l.contaId ? 'a uma conta fixa' : 'a uma caixinha'}. Se excluir, ${l.contaId ? 'a conta volta a aparecer como não paga' : 'o saldo da caixinha é corrigido'}.</p>` : ''}`;
    const acoes = `${l ? `<button type="button" class="btn btn-perigo-txt" data-act="folha-acao" data-acao="excluir">${ic('lixo')}Excluir</button>` : '<span></span>'}<button class="btn btn-pri">${l ? 'Salvar' : tipo === 'entrada' ? 'Registrar entrada' : 'Registrar gasto'}</button>`;
    abrirFolha(l ? 'Editar lançamento' : tipo === 'entrada' ? 'Nova entrada' : 'Novo gasto', corpo, {
      acoes,
      aoAbrir: (f) => {
        f.addEventListener('change', (e) => {
          if (e.target.name !== 'tipo') return;
          const tp = e.target.value;
          $('#f-cats', f).innerHTML = chipsCats(tp, tp === 'entrada' ? 'salario' : 'mercado');
          $('#f-formas', f).hidden = tp === 'entrada';
          $('#folha-titulo').textContent = tp === 'entrada' ? 'Nova entrada' : 'Novo gasto';
          const b = f.querySelector('.folha-acoes .btn-pri');
          if (b && !l) b.textContent = tp === 'entrada' ? 'Registrar entrada' : 'Registrar gasto';
          $('#f-desc', f).placeholder = tp === 'entrada' ? 'Ex.: Salário de outubro' : 'Ex.: Mercado da semana';
        });
      },
      onSubmit: (fd, f) => {
        const valor = centavosDe($('#f-valor', f));
        if (!valor) return erroCampo(f, '#f-valor', 'Digite o valor.');
        const data = String(fd.get('data') || '');
        if (!chaveValida(data)) return erroCampo(f, '#f-data', 'Escolha a data.');
        const tp = vinculo ? l.tipo : (fd.get('tipo') === 'entrada' ? 'entrada' : 'saida');
        const cat = String(fd.get('categoria') || (tp === 'entrada' ? 'outrasent' : 'outros'));
        const doc = { ...(l || {}), tipo: tp, valor, descricao: String(fd.get('descricao') || '').trim().slice(0, 80), categoria: CAT[cat] ? cat : (tp === 'entrada' ? 'outrasent' : 'outros'), data, forma: tp === 'saida' ? String(fd.get('forma') || 'pix') : null, criadoEm: (l && l.criadoEm) || agoraISO() };
        delete doc.exemplo;
        if (l && l.caixinhaId && l.valor !== valor) ajustarCaixinha(l.caixinhaId, l.tipo === 'saida' ? valor - num(l.valor) : num(l.valor) - valor);
        put('lancamentos', id || novoId(), doc);
        fecharFolha();
        toast(l ? 'Lançamento salvo' : tp === 'entrada' ? `Entrada de ${brl(valor)} registrada` : `Gasto de ${brl(valor)} registrado`);
      },
      onAcao: (a) => {
        if (a !== 'excluir') return;
        const antigo = { ...l };
        if (antigo.caixinhaId) ajustarCaixinha(antigo.caixinhaId, antigo.tipo === 'saida' ? -num(antigo.valor) : num(antigo.valor));
        del('lancamentos', id);
        fecharFolha();
        toast('Lançamento excluído', { acao: 'Desfazer', fn: () => { if (antigo.caixinhaId) ajustarCaixinha(antigo.caixinhaId, antigo.tipo === 'saida' ? num(antigo.valor) : -num(antigo.valor)); put('lancamentos', id, antigo); } });
      },
    });
  }

    const corpo = `

      <div class="campo"><label for="t-hora">Horário <span class="opcional">(opcional)</span></label><input id="t-hora" class="entrada" type="time" name="hora" value="${esc(t ? t.hora || '' : '')}"></div>`;

  function folhaHabito(o) {
    const id = o.id || null;
    const h = id ? S.habitos[id] : null;
    if (id && !h) return;
    const dias = h && Array.isArray(h.dias) && h.dias.length ? h.dias : [0, 1, 2, 3, 4, 5, 6];
    const corpo = `
      <div class="campo"><label for="h-nome">Hábito</label><input id="h-nome" class="entrada" name="nome" maxlength="60" placeholder="Ex.: Ler 20 minutos" value="${esc(h ? h.nome : '')}"${h ? '' : ' data-foco-inicial'}></div>
      <fieldset class="campo"><legend>Em quais dias da semana</legend><div class="dias-semana">${[0, 1, 2, 3, 4, 5, 6].map((i) => `<label class="dia-sem"><input type="checkbox" name="dias" value="${i}"${dias.includes(i) ? ' checked' : ''}><span aria-hidden="true">${SEM_INI[i]}</span><span class="sr">${SEMANA[i]}</span></label>`).join('')}</div><p class="sub">Todos marcados: todo dia.</p></fieldset>`;
    const acoes = `${h ? `<button type="button" class="btn btn-perigo-txt" data-act="folha-acao" data-acao="excluir">${ic('lixo')}Excluir</button>` : '<span></span>'}<button class="btn btn-pri">${h ? 'Salvar' : 'Criar hábito'}</button>`;
    abrirFolha(h ? 'Editar hábito' : 'Novo hábito', corpo, {
      acoes,
      onSubmit: (fd, f) => {

        if (!ds.length) return erroCampo(f, '.dias-semana input', 'Marque pelo menos um dia.');
        const doc = { ...(h || {}), nome, dias: ds.length === 7 ? [] : ds.sort((a, b) => a - b) };
        if (!h) Object.assign(doc, { desde: hoje(), feitos: {}, ordem: habitosAtivos().reduce((m, x) => Math.max(m, num(x.ordem)), 0) + 1, criadoEm: agoraISO() });
        delete doc.exemplo;

      onAcao: (a) => {

        fecharFolha();
        toast('Hábito excluído', { acao: 'Desfazer', fn: () => put('habitos', id, antigo) });
      },
    });
  }
  function corpoVerHabito(id, mk) {
    const h = { id, ...S.habitos[id] };
    const hj = hoje();
    const [y, m] = mk.split('-').map(Number);
    const n = diasNoMes(y, m);
    const ini = new Date(y, m - 1, 1, 12).getDay();
    let cel = SEM_INI.map((s, i) => `<span class="gm-sem${i === 0 ? ' vermelho' : ''}" aria-hidden="true">${s}</span>`).join('');
    for (let i = 0; i < ini; i++) cel += '<span aria-hidden="true"></span>';
    let devidos = 0, feitos = 0;
    for (let d = 1; d <= n; d++) {
      const k = `${mk}-${pad(d)}`;
      const dev = devido(h, k), f = feito(h, k);
      if (dev && k <= hj) { devidos += 1; if (f) feitos += 1; }
      const cls = f ? 'feito' : !dev ? 'fora' : k > hj ? 'futuro' : k === hj ? 'hoje' : 'falhou';

  async function apagarTudo() {
    fecharFolha();

    for (const c of COLECOES) for (const id of Object.keys(S[c])) alvos.add(`${c}/${id}`);
    if (armazem.modo === 'nuvem') {
      for (const c of ['lancamentos', 'dias', 'tarefas']) {
        try { const snap = await nuvem.raiz.collection(c).get(); for (const d of snap.docs) alvos.add(`${c}/${d.id}`); } catch (e) { /* segue com o que está na tela */ }
      }
    }
    del('perfil', '_');
    for (const k of alvos) { const i = k.indexOf('/'); del(k.slice(0, i), k.slice(i + 1)); }

    toast('Tudo apagado.');
