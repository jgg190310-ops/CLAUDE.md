<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tour 3D da casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--mata:#12271f;--glass:rgba(16,36,28,.66);--cobogo:#f0b95a;--cal:#f5efe4;--muted:rgba(245,239,228,.72);--line:rgba(245,239,228,.16);--f:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:var(--mata);font-family:var(--f);color:var(--cal);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cobogo);outline-offset:3px;border-radius:10px}
canvas{display:block;width:100%;height:100%;touch-action:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);border:1px solid var(--line)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(6,14,10,.32) 100%)}
#top{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;background:linear-gradient(rgba(8,18,13,.5),rgba(8,18,13,0))}
#brand{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;opacity:.9}
#brand .dot{width:9px;height:9px;border-radius:2px;background:var(--cobogo);box-shadow:0 0 12px var(--cobogo)}
#room{font-size:clamp(26px,3.4vw,42px);font-weight:800;letter-spacing:-.035em;line-height:1;margin-top:10px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
#tright{display:flex;gap:8px;pointer-events:auto}
.ib{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.ib:hover{background:rgba(245,239,228,.12)}
.ib.on{background:var(--cobogo);color:var(--mata);border-color:var(--cobogo)}
#bClose{height:44px;padding:0 16px;border-radius:14px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
#hint{position:fixed;left:50%;top:84px;transform:translateX(-50%);padding:9px 14px;border-radius:12px;font-size:13px;pointer-events:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(245,239,228,.85);box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none}
#bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:18px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:13px;padding:3px;gap:2px}
.seg button{height:38px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--cal);color:var(--mata)}
.tb{height:44px;padding:0 14px;border-radius:13px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap}
.tb:hover{background:rgba(245,239,228,.1)}
.tb.on{background:var(--cobogo);color:var(--mata)}
.vsep{width:1px;height:28px;background:var(--line);flex:none}
#mini{position:fixed;right:22px;bottom:20px;width:230px;border-radius:18px;padding:10px 10px 8px}
#mini .t{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin:0 2px 6px}
.mapsvg{width:100%;height:auto;display:block}
.mz rect{fill:rgba(245,239,228,.06);stroke:rgba(245,239,228,.35);stroke-width:.08;cursor:pointer;transition:fill .2s}
.mz:hover rect{fill:rgba(240,185,90,.3)}
.mz.on rect{fill:rgba(240,185,90,.85);stroke:var(--cobogo)}
.mz text{fill:var(--cal);font-size:.62px;font-family:var(--f);font-weight:600;text-anchor:middle;pointer-events:none}
.mz.on text{fill:var(--mata);font-weight:800}
.me{fill:var(--cobogo);stroke:#fff;stroke-width:.12}
.cone{fill:rgba(240,185,90,.35)}
#menu{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);width:min(560px,calc(100vw - 20px));border-radius:20px;padding:16px;max-height:calc(100vh - 120px);overflow:auto}
#menu h3{font-size:18px;font-weight:700;margin-bottom:10px}
#menuGrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
#menuList{display:grid;gap:4px}
#menuList button{text-align:left;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:500;display:flex;justify-content:space-between}
#menuList button:hover{background:rgba(245,239,228,.1)}
#menuList button span{color:var(--muted);font-size:12px}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(245,239,228,.4);background:rgba(16,36,28,.25);display:none;pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(245,239,228,.75)}
#photoBtn{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);height:50px;padding:0 20px 0 8px;border-radius:16px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;background:var(--cobogo);color:var(--mata);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .3s ease}
#photoBtn img{width:54px;height:36px;object-fit:cover;border-radius:9px}
#photoBtn small{display:block;font-size:12px;font-weight:500;opacity:.75;text-align:left}
@keyframes pop{from{transform:translateX(-50%) translateY(8px);opacity:0}to{transform:translateX(-50%);opacity:1}}
#gal{position:fixed;inset:0;z-index:30;background:rgba(8,18,13,.96);display:flex;align-items:center;justify-content:center}
#galImg{max-width:100%;max-height:100%;object-fit:contain}
#galTop{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;background:linear-gradient(rgba(8,18,13,.75),rgba(8,18,13,0))}
#galRoom{font-size:26px;font-weight:800;letter-spacing:-.03em}#galCap{font-size:14px;color:var(--muted);margin-top:4px}
.gnav{position:fixed;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center}#galP{left:16px}#galN{right:16px}
#galDots{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:6px}#galDots i{width:7px;height:7px;border-radius:50%;background:rgba(245,239,228,.35)}#galDots i.on{background:var(--cobogo)}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--mata)}
#start .bgp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42) saturate(1.1)}
#start .card{position:relative;width:min(560px,calc(100vw - 28px));border-radius:24px;padding:30px 28px}
#start h1{font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-.04em;line-height:.95}
#start .sub{color:var(--muted);font-size:15px;margin:10px 0 22px;line-height:1.45}
#howto{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:24px}
#howto div{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
#howto b{display:block;font-weight:700}
#howto span{color:var(--muted)}
#howto svg{color:var(--cobogo);margin-top:2px}
kbd{font-family:var(--f);font-size:12px;background:rgba(245,239,228,.12);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
#go{height:52px;padding:0 28px;border-radius:16px;font-size:16px;font-weight:700;background:var(--cobogo);color:var(--mata);display:inline-flex;align-items:center;gap:10px}
#go:disabled{opacity:.6}
#start .fine{font-size:12px;color:var(--muted);margin-top:16px;opacity:.8}
@media (max-width:760px){
  #top{padding:12px 14px} #room{font-size:26px}
  .seg button .t,.tb .t{display:none} .seg button{padding:0 10px} .tb{padding:0 11px}
  #bar{bottom:calc(12px + env(safe-area-inset-bottom))} #mini{display:none}
  #photoBtn{bottom:calc(80px + env(safe-area-inset-bottom))}
  #menuGrid{grid-template-columns:1fr} #menu{bottom:calc(76px + env(safe-area-inset-bottom))}
  #howto{grid-template-columns:1fr}
}
</style>
</head>

</svg>
<div id="top">
  <div><div id="brand"><span class="dot"></span>Casa na Feiticeira · 3D</div><div id="room">Entrada</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(function(){
const T = THREE;
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const $ = id => document.getElementById(id);

const ico = n => '<svg class="i"><use href="#i-'+n+'"/></svg>';
$('howto').innerHTML = isTouch
  ? '<div>'+ico('walk')+'<p><b>Andar</b><span>Arraste o dedo no lado esquerdo da tela</span></p></div><div>'+ico('eye')+'<p><b>Olhar</b><span>Arraste no lado direito</span></p></div><div>'+ico('sun')+'<p><b>Horário e luzes</b><span>Na barra de baixo</span></p></div><div>'+ico('cam')+'<p><b>Fotos reais</b><span>Chegue perto de um ponto dourado</span></p></div>'
  : '<div>'+ico('walk')+'<p><b>Andar</b><span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> e <kbd>Shift</kbd> para correr</span></p></div><div>'+ico('eye')+'<p><b>Olhar</b><span>Mouse. <kbd>Esc</kbd> solta o cursor</span></p></div><div>'+ico('sun')+'<p><b>Horário e luzes</b><span><kbd>1</kbd>–<kbd>4</kbd> muda o horário, <kbd>L</kbd> as luzes</span></p></div><div>'+ico('cam')+'<p><b>Fotos reais</b><span>Chegue perto de um ponto dourado e aperte <kbd>F</kbd></span></p></div>';

// ---------- renderer ----------
const canvas = $('c');
const renderer = new T.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
const scene = new T.Scene();
const camera = new T.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 900);
camera.rotation.order = 'YXZ';

// seeded random
let seed = 12345;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const C8 = v => Math.max(0, Math.min(255, v|0));
const lin = hex => new T.Color(hex).convertSRGBToLinear();

// ---------- procedural textures ----------
const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function tex(draw, size){ size = size || 512; const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); draw(g, size); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.encoding = T.sRGBEncoding; t.anisotropy = aniso; return t; }
function noise(g, s, a, n){ n = n || 6000; for (let i=0;i<n;i++){ g.fillStyle = rnd()<.5 ? 'rgba(0,0,0,'+a+')' : 'rgba(255,255,255,'+a+')'; g.fillRect(rnd()*s, rnd()*s, 1+rnd()*2, 1+rnd()*2); } }
function blobs(g, s, n, cols, rmin, rmax){ for (let i=0;i<n;i++){ const x=rnd()*s, y=rnd()*s, r=rmin+rnd()*(rmax-rmin), c=cols[i%cols.length];
  for (const dx of [-s,0,s]) for (const dy of [-s,0,s]) { const X=x+dx, Y=y+dy; if (X+r<0||X-r>s||Y+r<0||Y-r>s) continue; const gr=g.createRadialGradient(X,Y,0,X,Y,r); gr.addColorStop(0,c); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(X-r,Y-r,2*r,2*r); } } }
function dual(draw, size){ size=size||512; const c=document.createElement('canvas'), h=document.createElement('canvas'); c.width=c.height=h.width=h.height=size; const g=c.getContext('2d'), gh=h.getContext('2d'); gh.fillStyle='#000'; gh.fillRect(0,0,size,size); draw(g,gh,size);
  const t=new T.CanvasTexture(c), th=new T.CanvasTexture(h); for (const x of [t,th]){ x.wrapS=x.wrapT=T.RepeatWrapping; x.anisotropy=aniso; } t.encoding=T.sRGBEncoding; return [t,th]; }
function hnoise(gh,s,n){ for (let i=0;i<n;i++){ const v=rnd()*60|0; gh.fillStyle='rgba('+v+','+v+','+v+',.35)'; gh.fillRect(rnd()*s,rnd()*s,2+rnd()*4,2+rnd()*4); } }
function brickTex(base, mortar, vr){ return dual((g,gh,s)=>{ g.fillStyle=mortar; g.fillRect(0,0,s,s); const rows=14, rh=s/rows, cols=4, bw=s/cols, m=s/170;
  for (let r=0;r<rows;r++){ const off=(r%2)*bw/2; for (let c=-1;c<=cols;c++){ const v=(rnd()-.5)*vr; g.fillStyle='rgb('+C8(base[0]+v)+','+C8(base[1]+v*.8)+','+C8(base[2]+v*.6)+')'; g.fillRect(c*bw+off+m, r*rh+m, bw-2*m, rh-2*m);
    const hv=190+(rnd()*50|0); gh.fillStyle='rgb('+hv+','+hv+','+hv+')'; gh.fillRect(c*bw+off+m, r*rh+m, bw-2*m, rh-2*m); g.fillStyle='rgba(255,220,180,.10)'; g.fillRect(c*bw+off+m, r*rh+m, bw-2*m, 2); } }
  blobs(g,s,60,['rgba(60,30,10,.14)','rgba(255,230,200,.09)','rgba(30,20,10,.1)'],20,110); noise(g,s,.07,s*14); for (let i=0;i<s*2;i++){ const v=rnd()*90|0; gh.fillStyle='rgba(0,0,0,.25)'; gh.fillRect(rnd()*s,rnd()*s,2,2); } }, 1024); }

const [tBrick,hBrick] = brickTex([184,98,60], '#9a7a62', 46);
const [tBrickL,hBrickL] = brickTex([214,168,116], '#c2a684', 34);

  const night = Math.max(0, Math.min(1, 1-cur.sunI/1.4)); for (const h of halos) h.sm.opacity = lightF*h.k*(.25+.75*night)*.8;
  if (window.__clouds){ const cc=new T.Color().copy(cur.bot).lerp(new T.Color(1,1,1), .55-night*.4).multiplyScalar(1-night*.75); for (const m of window.__clouds){ m.color.copy(cc); m.opacity=.9-night*.5; } } }

let lightsOn = true, lightF = 1;
function applyLights(t){ for (const p of plights) p.l.intensity = p.base*lightF; for (const g of glowMats){ let k=g.base*lightF; if (g.m===mat.fire) k*=(.8+.25*Math.sin(t*13)+.15*Math.sin(t*29)); g.m.emissiveIntensity=k; } }

// ---------- player ----------
const pos = new T.Vector3(13,0,.5); let yaw=Math.PI/2, pitch=-.05, eyeY=1.6, bobT=0;
function floorAt(x,z){ if (x>=-8&&x<=-2.5&&z>=-6&&z<=.5) return .45; if ((x>-2.5&&x<=-2.15&&z>=-6&&z<=.85)||(x>=-5&&x<=-2.15&&z>.5&&z<=.85)) return .22;
  if (x>=-1.5&&x<=1.5&&z>=-3.5&&z<=-.5) return (z>-.8&&Math.abs(x)<.5) ? -.22 : -.45; return 0; }
function blocked(x,z,feet){ const r=.26; for (const c of colliders){ if (c.y1 < feet+.36 || c.y0 > feet+1.75) continue; if (x+r>c.x0 && x-r<c.x1 && z+r>c.z0 && z-r<c.z1) return true; } return false; }
const zones=[['Quarto 1',-8,-3.6,6,10],['Quarto 2',-8,-3.6,10,14],['Corredor dos quartos',-3.6,-2.4,6,14],['Banheiro',-2.4,2,6,8.6],['Espaço de trabalho',-2.4,2,8.6,11.3],['Quarto 3 · solteiro',-2.4,2,11.3,14],
  ['Sala de TV',-8,-2.15,-6,.85],['Lareira e rede',-2.15,2.5,-6,1.2],['Mesa de jantar',2.5,8,-6,.5],['Cozinha',-2.2,8,1.2,6],['Varanda gourmet',-8,8,-6,6]];
function zoneAt(x,z){ for (const [n,a,b,c,d] of zones) if (x>=a&&x<b&&z>=c&&z<d) return n; if (x>8&&x<18&&Math.abs(z)<9) return 'Pátio'; return 'Jardim'; }
const spots=[['🚪 Entrada',13,.5,Math.PI/2,-.05],['🛋️ Sala de TV',-3.2,-1.5,.84,-.12],['🔥 Lareira e rede',3.2,-2,Math.PI/2,-.22],['🍽️ Mesa de jantar',2.8,-1.2,-.885,-.15],['🍳 Cozinha',0,1.9,-1.92,-.15],
  ['🛏️ Quarto 1',-4.2,9.4,.64,-.2],['🛏️ Quarto 2',-4.2,10.7,2.48,-.2],['💻 Espaço de trabalho',-1.9,9.6,-1.69,-.2],['🛏️ Quarto 3',-1.9,11.9,-2.43,-.2],['🚿 Banheiro',-1.9,7.7,-1.35,-.15],['🌴 Jardim',15,7,.98,0]];

// ---------- input ----------
const keys={}; let runToggle=false, started=false, locked=false;
const menu=$('menu');
spots.forEach(s=>{ const b=document.createElement('button'); b.innerHTML=s[0].replace(/^\S+\s/,'')+'<span>ir</span>'; b.onclick=()=>{ pos.set(s[1],0,s[2]); yaw=s[3]; pitch=s[4]; eyeY=floorAt(pos.x,pos.z)+1.6; menu.hidden=true; $('bRooms').classList.remove('on'); }; $('menuList').appendChild(b); });
// minimap drawn from the model's own coordinates
const MZ=[['Sala de TV',-8,-2.15,-6,.85,1],['Lareira',-2.15,2.5,-6,1.2,2],['Jantar',2.5,8,-6,.5,3],['Cozinha',-2.2,8,1.2,6,4],['Quarto 1',-8,-3.6,6,10,5],['Quarto 2',-8,-3.6,10,14,6],['Banheiro',-2.4,2,6,8.6,9],['Trabalho',-2.4,2,8.6,11.3,7],['Quarto 3',-2.4,2,11.3,14,8],['Pátio',8,17,-7,7,0],['Jardim',8,17,7,14,10]];
function drawMap(svg){ svg.setAttribute('viewBox','-9 -7.5 27 22'); svg.innerHTML = MZ.map(([n,x0,x1,z0,z1,si])=>`<g class="mz" data-si="${si}" data-n="${n}"><rect x="${x0}" y="${z0}" width="${x1-x0}" height="${z1-z0}" rx=".25"/><text x="${(x0+x1)/2}" y="${(z0+z1)/2+.22}">${n}</text></g>`).join('') + '<path class="cone" d="M0 0"/><circle class="me" r=".42"/>';
  svg.querySelectorAll('.mz').forEach(g=> g.onclick=()=>{ const sp=spots[+g.dataset.si]; pos.set(sp[1],0,sp[2]); yaw=sp[3]; pitch=sp[4]; eyeY=floorAt(pos.x,pos.z)+1.6; menu.hidden=true; $('bRooms').classList.remove('on'); }); }
drawMap($('miniSvg')); drawMap($('menuSvg'));
function updateMaps(){ const zn=zoneAt(pos.x,pos.z); for (const id of ['miniSvg','menuSvg']){ const svg=$(id); const me=svg.querySelector('.me'), cone=svg.querySelector('.cone'); me.setAttribute('cx',pos.x); me.setAttribute('cy',pos.z);
  const a=-yaw-Math.PI/2, r=2.4, s1=a-.5, s2=a+.5; cone.setAttribute('d',`M${pos.x} ${pos.z} L${pos.x+Math.cos(s1)*r} ${pos.z+Math.sin(s1)*r} A${r} ${r} 0 0 1 ${pos.x+Math.cos(s2)*r} ${pos.z+Math.sin(s2)*r}Z`);
  const key={'Sala de TV':'Sala de TV','Lareira e rede':'Lareira','Mesa de jantar':'Jantar','Cozinha':'Cozinha','Quarto 1':'Quarto 1','Quarto 2':'Quarto 2','Banheiro':'Banheiro','Espaço de trabalho':'Trabalho','Quarto 3 · solteiro':'Quarto 3','Pátio':'Pátio','Jardim':'Jardim'}[zn]; svg.querySelectorAll('.mz').forEach(g=>g.classList.toggle('on', g.dataset.n===key)); } }
function setTime(i){ target=targets[i]; document.querySelectorAll('#bar [data-t]').forEach(b=>b.classList.toggle('on', +b.dataset.t===i)); }
function toggleLights(){ lightsOn=!lightsOn; $('bLights').classList.toggle('on', lightsOn); }
document.querySelectorAll('#bar [data-t]').forEach(b=> b.onclick=()=>setTime(+b.dataset.t));
$('bLights').onclick=toggleLights;
$('bRun').onclick=()=>{ runToggle=!runToggle; $('bRun').classList.toggle('on',runToggle); };
$('bRooms').onclick=()=>{ menu.hidden=!menu.hidden; $('bRooms').classList.toggle('on',!menu.hidden); };
addEventListener('keydown',e=>{ keys[e.code]=true; if (e.code==='KeyL') toggleLights(); if (e.code==='KeyM') $('bRooms').onclick(); const d={Digit1:0,Digit2:1,Digit3:2,Digit4:3}[e.code]; if (d!==undefined) setTime(d); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for (const k in keys) keys[k]=false; });
document.addEventListener('pointerlockchange',()=>{ locked = document.pointerLockElement===canvas; if (!isTouch){ $('hint').hidden=locked||!started; $('hint').textContent='Clique na tela para olhar com o mouse'; $('cross').hidden=!locked; } });
document.addEventListener('mousemove',e=>{ if (!locked) return; yaw-=e.movementX*.0022; pitch-=e.movementY*.0022; clampPitch(); });
function clampPitch(){ pitch=Math.max(-1.45,Math.min(1.45,pitch)); }
let joyId=null, joyO=[0,0], joyV=[0,0], lookId=null, lookL=[0,0], mouseDrag=null;
const joy=$('joy'), knob=$('knob');
canvas.addEventListener('pointerdown',e=>{ if (!started) return; menu.hidden=true; $('bRooms').classList.remove('on');
  if (e.pointerType==='mouse'){ if (!locked){ try{ const r=canvas.requestPointerLock(); if (r && r.catch) r.catch(()=>{}); }catch(_){} mouseDrag=[e.clientX,e.clientY]; } return; }
  if (e.clientX < innerWidth*.45 && joyId===null){ joyId=e.pointerId; joyO=[e.clientX,e.clientY]; joyV=[0,0]; joy.style.display='block'; joy.style.left=e.clientX+'px'; joy.style.top=e.clientY+'px'; knob.style.transform=''; }
  else if (lookId===null){ lookId=e.pointerId; lookL=[e.clientX,e.clientY]; }
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){} });
canvas.addEventListener('pointermove',e=>{
  if (e.pointerType==='mouse'){ if (mouseDrag && !locked && e.buttons){ yaw-=(e.clientX-mouseDrag[0])*.004; pitch-=(e.clientY-mouseDrag[1])*.004; clampPitch(); mouseDrag=[e.clientX,e.clientY]; } return; }
  if (e.pointerId===joyId){ let dx=e.clientX-joyO[0], dy=e.clientY-joyO[1]; const l=Math.hypot(dx,dy), mx=55; if (l>mx){ dx*=mx/l; dy*=mx/l; } joyV=[dx/mx,dy/mx]; knob.style.transform='translate('+dx+'px,'+dy+'px)'; }
  else if (e.pointerId===lookId){ yaw-=(e.clientX-lookL[0])*.0055; pitch-=(e.clientY-lookL[1])*.0055; clampPitch(); lookL=[e.clientX,e.clientY]; } });
function endP(e){ if (e.pointerType==='mouse'){ mouseDrag=null; return; } if (e.pointerId===joyId){ joyId=null; joyV=[0,0]; joy.style.display='none'; } if (e.pointerId===lookId) lookId=null; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
$('go').onclick=()=>{ started=true; $('start').hidden=true; $('bar').hidden=false; $('mini').hidden=isTouch; if (!isTouch){ try{ const r=canvas.requestPointerLock(); if (r && r.catch) r.catch(()=>{}); }catch(_){} } };

// ---------- real photos linked to 3D ----------
const PH = {
  chegada:{n:'Chegada', m:[22.4,1.7,0], tp:[21.5,0,Math.PI/2,-.05], p:[['f00','Portaria do condomínio'],['f01','Portão da casa'],['f02','Caminho pelo jardim']]},
  externa:{n:'Pátio e jardim', m:[14,1.7,3], tp:[13,.5,Math.PI/2,-.05], p:[['f03','A casa vista do pátio'],['f04','Pátio e jardim tropical'],['f05','Sombra das árvores'],['f06','Fachada entre palmeiras']]},
  jantar:{n:'Jantar', m:[5,1.25,-3.3], tp:[2.8,-1.2,-.885,-.15], p:[['f07','Mesa redonda junto ao vidro'],['f08','Mesa para 8'],['f09','Jantar, cozinha e rede']]},
  cozinha:{n:'Cozinha', m:[3,1.5,3], tp:[0,1.9,-1.92,-.15], p:[['f10','Bancada e churrasqueira'],['f11','Cozinha integrada'],['f12','Fogão e churrasqueira'],['f13','Pia dupla'],['f14','Geladeira e cobogós'],['f15','Micro-ondas e cafeteira']]},
  lareira:{n:'Lareira e rede', m:[0,.75,-2], tp:[3.2,-2,Math.PI/2,-.22], p:[['f16','Rede sobre o cimento queimado'],['f17','Telhado radial de madeira'],['f18','Lareira rebaixada'],['f19','A lareira vista do alto']]},
  sala:{n:'Sala de TV', m:[-5.4,1.5,-2.6], tp:[-3.2,-1.5,.84,-.12], p:[['f20','Sala de TV no deck'],['f21','Sofás voltados para a mata'],['f22','Deck integrado']]},
  q1:{n:'Quarto 1', m:[-5.8,1.45,8.7], tp:[-4.2,9.4,.64,-.2], p:[['f23','Cama de casal'],['f24','Janela para o jardim'],['f25','Visto da porta']]},
  q2:{n:'Quarto 2', m:[-5.8,1.45,11.3], tp:[-4.2,10.7,2.48,-.2], p:[['f26','Cama de casal e cadeira'],['f27','Cabeceira entalhada'],['f28','Visto da porta']]},
  q3:{n:'Quarto 3', m:[0,1.35,12.4], tp:[-1.9,11.9,-2.43,-.2], p:[['f29','Duas camas de solteiro'],['f30','Janela entre as camas'],['f31','Visto da porta']]},
  banheiro:{n:'Banheiro', m:[.1,1.6,7.4], tp:[-1.9,7.7,-1.35,-.15], p:[['f32','Bancada e tijolo de vidro'],['f33','Pia'],['f34','Box'],['f35','Vaso sanitário']]},
  lavabo:{n:'Banheiro 2', m:[-1,1.5,5.3], tp:[-1,3.8,Math.PI,-.1], p:[['f36','Pia de cobre']]}
};
const markerTex = (function(){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,30,64,64,64); gr.addColorStop(0,'rgba(240,185,90,.55)'); gr.addColorStop(1,'rgba(240,185,90,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); g.fillStyle='#f0b95a'; g.beginPath(); g.arc(64,64,34,0,7); g.fill(); g.strokeStyle='#f5efe4'; g.lineWidth=5; g.stroke();
  g.strokeStyle='#12271f'; g.lineWidth=4.5; g.lineJoin='round'; g.beginPath(); g.moveTo(46,56); g.lineTo(52,56); g.lineTo(56,51); g.lineTo(72,51); g.lineTo(76,56); g.lineTo(82,56); g.lineTo(82,78); g.lineTo(46,78); g.closePath(); g.stroke(); g.beginPath(); g.arc(64,66,6.5,0,7); g.stroke(); const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t; })();
const markers=[]; for (const k in PH){ const sm=new T.SpriteMaterial({map:markerTex,depthWrite:false,transparent:true}); const sp=new T.Sprite(sm); sp.position.set(...PH[k].m); sp.scale.set(.42,.42,1); sp.renderOrder=5; scene.add(sp); markers.push({k,sp}); }
let nearKey=null, galOpen=false, galKey=null, galI=0, pendingTP=null;
const photoBtn=$('photoBtn');
function nearest(){ let best=null, bd=3.8; for (const mk of markers){ const d=Math.hypot(mk.sp.position.x-pos.x, mk.sp.position.z-pos.z); if (d<bd){ bd=d; best=mk.k; } } return best; }
function openGal(k,i){ galKey=k; galI=i||0; galOpen=true; for (const c in keys) keys[c]=false; try{ document.exitPointerLock(); }catch(_){} $('gal').hidden=false; showGal(); }
function showGal(){ const r=PH[galKey], p=r.p[galI]; $('galImg').src='fotos/'+p[0]+'.jpg'; $('galRoom').textContent=r.n; $('galCap').textContent=p[1]+' · foto real '+(galI+1)+' de '+r.p.length; $('galDots').innerHTML=r.p.map((_,j)=>'<i class="'+(j===galI?'on':'')+'"></i>').join(''); $('galP').hidden=$('galN').hidden=r.p.length<2; }
function closeGal(){ galOpen=false; $('gal').hidden=true; }
$('galX').onclick=closeGal; $('galP').onclick=()=>{ galI=(galI-1+PH[galKey].p.length)%PH[galKey].p.length; showGal(); }; $('galN').onclick=()=>{ galI=(galI+1)%PH[galKey].p.length; showGal(); };
photoBtn.onclick=()=>{ if (nearKey) openGal(nearKey,0); };
addEventListener('keydown',e=>{ if (galOpen){ if (e.code==='Escape') closeGal(); if (e.code==='ArrowRight') $('galN').onclick(); if (e.code==='ArrowLeft') $('galP').onclick(); } else if (e.code==='KeyF' && nearKey) openGal(nearKey,0); });
function teleportRoom(k){ const r=PH[k]; if (!r) return; pos.set(r.tp[0],0,r.tp[1]); yaw=r.tp[2]; pitch=r.tp[3]; eyeY=floorAt(pos.x,pos.z)+1.6; }
const embedded = window.parent && window.parent!==window;
if (embedded){ $('bClose').hidden=false; $('brand').innerHTML='<span class="dot"></span>Casa na Feiticeira · 3D'; $('bClose').onclick=()=>{ try{ document.exitPointerLock(); }catch(_){} window.parent.postMessage({tour3d:'close'},'*'); }; }
addEventListener('message',e=>{ const d=e.data||{}; if (d.tour3d==='goto'){ if (window.__ready) teleportRoom(d.room); else pendingTP=d.room; } });
// tap on a marker opens its photos
canvas.addEventListener('click',e=>{ if (!started || galOpen) return; const ndc = locked ? new T.Vector2(0,0) : new T.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); const rc=new T.Raycaster(); rc.setFromCamera(ndc,camera); const hit=rc.intersectObjects(markers.map(m=>m.sp)); if (hit.length && hit[0].distance<14){ const mk=markers.find(m=>m.sp===hit[0].object); if (mk) openGal(mk.k,0); } });

// ---------- loop ----------
const clock=new T.Clock(); let labelT=0;
function frame(){ const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  const near = (started && menu.hidden) ? nearest() : null; if (near!==nearKey){ nearKey=near; photoBtn.hidden=!near; if (near){ $('pbImg').src='fotos/'+PH[near].p[0][0]+'.jpg'; $('pbT').textContent='Ver foto real'; $('pbS').textContent=PH[near].n+' · '+PH[near].p.length+' foto'+(PH[near].p.length>1?'s':'')+(isTouch?'':' · tecla F'); } }
  for (const mk of markers){ const k=(mk.k===nearKey?.5:.4)+.035*Math.sin(t*3+mk.sp.position.x); mk.sp.scale.set(k,k,1); }
  if (started && !galOpen){ let f=0, s=0; if (keys.KeyW||keys.ArrowUp) f+=1; if (keys.KeyS||keys.ArrowDown) f-=1; if (keys.KeyD||keys.ArrowRight) s+=1; if (keys.KeyA||keys.ArrowLeft) s-=1;
    f-=joyV[1]; s+=joyV[0]; const len=Math.hypot(f,s); if (len>1){ f/=len; s/=len; }
    const run = keys.ShiftLeft||keys.ShiftRight||runToggle||Math.hypot(joyV[0],joyV[1])>.97; const sp = run ? 4.3 : 1.9;
    const vx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp*dt, vz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp*dt; const feet=floorAt(pos.x,pos.z);
    if (!blocked(pos.x+vx,pos.z,feet)) pos.x+=vx; if (!blocked(pos.x,pos.z+vz,feet)) pos.z+=vz;
    pos.x=Math.max(-24.4,Math.min(23.6,pos.x)); pos.z=Math.max(-24.4,Math.min(24.4,pos.z));
    if (len>.05) bobT+=dt*sp*2.6; }
  eyeY += (floorAt(pos.x,pos.z)+1.6-eyeY)*Math.min(1,dt*10);
  camera.position.set(pos.x, eyeY+Math.sin(bobT)*.025, pos.z); camera.rotation.set(pitch,yaw,0);
  lerpState(1-Math.exp(-dt*2.2)); applyState();
  lightF += ((lightsOn?1:0)-lightF)*Math.min(1,dt*6); applyLights(t);
  sky.position.copy(camera.position); stars.position.copy(camera.position); if (window.__cloudG){ window.__cloudG.position.set(camera.position.x,0,camera.position.z); window.__cloudG.rotation.y += dt*.004; }
  envTimer -= dt; const tdist = cur.sun.distanceTo(target.sun) + Math.abs(cur.sunI-target.sunI); if (envTimer<=0 && (tdist>.01 || envLast<0)){ envTimer=.35; envLast=1; updateEnv(); }
  sun.target.position.set(pos.x*.0,0,0);
  labelT-=dt; if (labelT<=0){ labelT=.12; $('room').textContent=zoneAt(pos.x,pos.z); updateMaps(); }
  renderer.render(scene,camera); requestAnimationFrame(frame); }

setTimeout(()=>{ build(); applyState(); updateEnv(); renderer.render(scene,camera); const go=$('go'); go.disabled=false; go.innerHTML=ico('walk')+'Entrar na casa'; requestAnimationFrame(frame); window.__ready=true; if (pendingTP) teleportRoom(pendingTP); }, 30);
})();
