<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apto Luxemburgo · Belo Horizonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Apto Luxemburgo · uma visita passo a passo: capa, os ambientes um por tela, a planta, a maquete 3D, o bairro e a visita.
   Claro e arejado como o apartamento reformado. Instrument Serif nos títulos, Instrument Sans no resto.
   Vidro nas barras e nos controles que ficam sobre as fotos e sobre o 3D. */
:root{
  --papel:#f7f3ee;   /* fundo */
  --papel2:#ece5db;  /* fundo das imagens enquanto carregam */
  --tinta:#2b231c;   /* texto */
  --sub:#6e6053;     /* texto secundário */
  --ipe:#8a4527;     /* madeira do piso: destaque */
  --linha:rgba(43,35,28,.13);
  --fd:"Instrument Serif",Georgia,"Times New Roman",serif;
  --fb:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --spring:cubic-bezier(.3,1.45,.5,1);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--papel);color:var(--tinta);font-family:var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ipe);outline-offset:3px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2{font-family:var(--fd);font-weight:400;letter-spacing:-.01em;text-wrap:balance}
h1 em,h2 em{font-style:italic;color:var(--ipe)}
.kicker{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ipe)}

/* ---------- Liquid Glass ---------- */
.lg{position:relative;isolation:isolate;color:var(--tinta);
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.5)),rgba(247,243,238,.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.5),0 14px 34px -18px rgba(40,26,14,.45),0 2px 6px -3px rgba(40,26,14,.2)}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(140deg,#fff,rgba(255,255,255,.2) 28%,rgba(255,255,255,0) 52%,rgba(255,255,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.lg.dark{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05)),rgba(30,24,18,.25)}
@media (prefers-reduced-transparency:reduce){.lg{background:rgba(255,255,255,.96);-webkit-backdrop-filter:none;backdrop-filter:none}.lg.dark{background:rgba(30,24,18,.9)}}
.press{transition:transform .35s var(--spring),background-color .2s,color .2s,opacity .2s}
.press:active{transform:scale(.95)}
.on{background:var(--tinta)!important;color:#fff!important}

/* ---------- telas ---------- */
#deck{position:fixed;inset:0;overflow:hidden}
.step{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1),visibility 0s linear .6s}
.step.cur{opacity:1;visibility:visible;transform:none;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.8,.2,1),visibility 0s}
.step.past{transform:translateX(-40px)}
.inner{flex:1;min-height:0;display:flex;flex-direction:column;padding:calc(66px + var(--st)) 16px calc(96px + var(--sb))}

/* barra de cima */
#top{position:fixed;top:calc(10px + var(--st));left:12px;right:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1100px;margin:0 auto;transition:opacity .4s}
#top .name{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;font-family:var(--fd);font-size:21px}
#top .idx{height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
#top .idx b{font-weight:600;color:var(--ipe);font-variant-numeric:tabular-nums}

/* barra de baixo */
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--sb));z-index:10;display:flex;align-items:center;gap:10px;padding:6px;border-radius:30px;max-width:640px;margin:0 auto;transition:transform .5s var(--spring),opacity .4s}
#nav.off{transform:translateY(150%);opacity:0;pointer-events:none}
#prev{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none}
#prev:disabled{opacity:.3}
#bars{flex:1;display:flex;gap:3px;min-width:0}
#bars i{flex:1;height:4px;border-radius:2px;background:rgba(43,35,28,.15);transition:background .3s}
#bars i.done{background:var(--ipe)}
#next{height:48px;padding:0 18px 0 20px;border-radius:24px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;background:var(--tinta);color:#fff;white-space:nowrap;flex:none;max-width:62vw}
#next span{overflow:hidden;text-overflow:ellipsis}

/* capa */
.cover{position:absolute;inset:0}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,10,.25) 0%,rgba(20,14,10,0) 30%,rgba(20,14,10,.1) 50%,rgba(20,14,10,.75) 100%)}
.coverBox{position:absolute;left:16px;right:16px;bottom:calc(20px + var(--sb));max-width:620px;margin:0 auto;color:#fff}
.coverBox .kicker{color:#f2d3b6}
.coverBox h1{font-size:clamp(60px,12vw,120px);line-height:.88;margin:10px 0 16px}
.coverBox h1 em{color:#f2d3b6}
.coverBox p{font-size:17px;line-height:1.5;max-width:34ch;opacity:.95}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 22px;list-style:none}
.chips li{height:34px;padding:0 13px;border-radius:17px;display:flex;align-items:center;font-size:13.5px;font-weight:500}
.start{height:58px;width:100%;border-radius:29px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600;background:#fff;color:var(--tinta);box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}

/* ambiente */
.room{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:16px;max-width:1100px;width:100%;margin:0 auto}
.room .ph{position:relative;border-radius:24px;overflow:hidden;background:var(--papel2);min-height:0}
.room .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 6s ease-out}
.step.cur .room .ph img{transform:scale(1)}
.room .ph .tag{position:absolute;left:12px;top:12px;height:32px;padding:0 13px;border-radius:16px;display:flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.room .txt{padding:0 4px}
.room h2{font-size:clamp(38px,6vw,60px);line-height:1;margin-top:6px}
.room p{font-size:16px;line-height:1.5;color:var(--sub);margin-top:8px;max-width:52ch}

/* planta */
.plan{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;max-width:1100px;width:100%;margin:0 auto}
.plan h2,.nb h2,.visit h2,.maq h2{font-size:clamp(36px,6vw,58px);line-height:1;margin-top:6px}
.plan .img{min-height:0;display:flex;align-items:center;justify-content:center}
.plan .img img{max-height:100%;width:auto;border-radius:16px;background:#fff;padding:6px;box-shadow:0 20px 40px -26px rgba(60,40,20,.5)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none}
.nums li{background:#fff;border-radius:16px;padding:10px 8px;text-align:center;box-shadow:inset 0 0 0 1px var(--linha)}
.nums b{display:block;font-family:var(--fd);font-weight:400;font-size:30px;line-height:1;color:var(--ipe)}
.nums span{display:block;font-size:12px;color:var(--sub);margin-top:4px}

/* maquete */
.maq{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;max-width:1100px;width:100%;margin:0 auto}
.maq .head p{color:var(--sub);font-size:15px;margin-top:6px}
.frame{position:relative;border-radius:24px;overflow:hidden;background:#e4ddd2;min-height:0}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels3d{position:absolute;inset:0;pointer-events:none;transition:opacity .3s;z-index:2}
#labels3d.off .lab{pointer-events:none}
.lab{position:absolute;left:0;top:0;height:32px;padding:0 13px 0 6px;border-radius:16px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;will-change:transform;pointer-events:auto}
.lab b{font-size:10.5px;font-weight:600;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--ipe);color:#fff}
.lab.on{background:var(--tinta);color:#fff}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e4ddd2;z-index:4;transition:opacity .5s;color:var(--sub);font-size:14px;text-align:center;padding:20px}
.fTop{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:2px;padding:4px;border-radius:24px}
.fTop button{height:38px;padding:0 13px;border-radius:19px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.fReset{position:absolute;top:10px;left:10px;z-index:3;height:46px;padding:0 15px;border-radius:23px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.zoom{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:24px;transition:opacity .3s}
.zoom button{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.hint3d{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:3;height:36px;padding:0 14px;border-radius:18px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;white-space:nowrap;transition:opacity .5s;pointer-events:none}
.card{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;display:flex;gap:12px;align-items:center;padding:8px;border-radius:24px;max-width:460px;margin:0 auto;transform:translateY(130%);transition:transform .45s var(--spring)}
.card.show{transform:none}
.card img{width:84px;height:84px;border-radius:17px;object-fit:cover;flex:none}
.card .t{flex:1;min-width:0}
.card small{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ipe)}
.card b{display:block;font-family:var(--fd);font-weight:400;font-size:24px;line-height:1.05}
.card span{display:block;font-size:13.5px;line-height:1.35;color:var(--sub);margin-top:2px}
.card .x{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;flex:none;align-self:flex-start}

/* antes e depois */
.ba{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;max-width:1100px;width:100%;margin:0 auto}
.ba h2{font-size:clamp(36px,6vw,58px);line-height:1;margin-top:6px}
.ba .head p{color:var(--sub);font-size:15px;margin-top:6px}
.stage{min-height:0;display:flex;justify-content:center;align-items:center;container-type:size}
.cmp{position:relative;width:min(100cqw,133cqh);height:min(100cqh,100cqw);border-radius:24px;overflow:hidden;background:var(--papel2);touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none;--p:50%}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.cmp .dep{clip-path:inset(0 0 0 var(--p))}
.cmp.anim .dep{transition:clip-path .9s cubic-bezier(.6,0,.2,1)}
.cmp.anim .hnd{transition:left .9s cubic-bezier(.6,0,.2,1)}
.cmp .lb{position:absolute;top:12px;height:32px;padding:0 13px;border-radius:16px;display:flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;z-index:2;pointer-events:none}
.cmp .lb.a{left:12px}.cmp .lb.d{right:12px}
.hnd{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.35);z-index:3;pointer-events:none}
.hnd i{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:23px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--tinta)}
.hnd i svg{width:16px;height:16px}
.seg{display:flex;gap:2px;padding:4px;border-radius:24px;max-width:560px;width:100%;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;height:40px;padding:0 11px;border-radius:20px;font-size:13.5px;font-weight:600;white-space:nowrap}

/* bairro */
.nb{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;max-width:1100px;width:100%;margin:0 auto}
.nb .img{border-radius:24px;overflow:hidden;min-height:0}
.nb .img img{width:100%;height:100%;object-fit:cover}
.dist{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.dist li{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--linha)}
.dist b{display:block;font-size:14px;font-weight:600;color:var(--ipe)}
.dist span{display:block;font-size:13.5px;line-height:1.35;margin-top:2px}

/* visita */
.visit{flex:1;min-height:0;overflow-y:auto;max-width:720px;width:100%;margin:0 auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.rows{margin-top:18px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 2px;border-bottom:1px solid var(--linha);font-size:15.5px}
.row:first-child{border-top:1px solid var(--linha)}
.row span{color:var(--sub)}
.contact{background:#fff;border-radius:22px;padding:18px 18px 16px;margin-top:20px;box-shadow:inset 0 0 0 1px var(--linha)}
.contact b.h{display:block;font-family:var(--fd);font-weight:400;font-size:28px;line-height:1.05}
.contact p{color:var(--sub);font-size:15px;margin:6px 0 10px}
.crow{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--linha);font-size:14.5px}
.crow span:first-child{color:var(--sub)}
.pill{height:48px;padding:0 20px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:600}
.pill.ipe{background:var(--ipe);color:#fff}
.pill.line{box-shadow:inset 0 0 0 1px var(--linha);background:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.fine{font-size:12px;line-height:1.6;color:var(--sub);margin-top:16px}

/* índice */
#menuBg{position:fixed;inset:0;z-index:20;background:rgba(30,22,16,.28);opacity:0;pointer-events:none;transition:opacity .3s}
#menuBg.on{opacity:1;pointer-events:auto}
#menu{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--sb));z-index:21;border-radius:28px;padding:14px;max-width:520px;margin:0 auto;transform:translateY(120%);transition:transform .45s var(--spring);max-height:80vh;overflow:auto}
#menu.on{transform:none}
#menu h3{font-family:var(--fd);font-weight:400;font-size:26px;padding:4px 8px 10px}
#menu button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:16px;text-align:left;font-size:16px;font-weight:500}
#menu button:hover{background:rgba(43,35,28,.06)}
#menu button em{font-style:normal;font-size:12px;font-weight:600;color:var(--ipe);width:26px;font-variant-numeric:tabular-nums}
#menu button img{width:44px;height:44px;border-radius:12px;object-fit:cover;margin-left:auto}
#menu button.cur{background:rgba(138,69,39,.1)}

@media (min-width:900px){
  .inner{padding:calc(80px + var(--st)) 32px calc(110px + var(--sb))}
  .room{grid-template-rows:none;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:end;gap:36px}
  .room .txt{padding-bottom:20px}
  .nb{grid-template-rows:none;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:36px}
}
@media (max-height:700px){ .room p{display:none} .coverBox p{display:none} }
@media (prefers-reduced-motion:reduce){ .step,.step.cur{transition:opacity .2s} .step{transform:none} .room .ph img{transform:none;transition:none} .press,.press:active{transition:none;transform:none} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-l" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-r" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-rot" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></symbol>
</svg>

<div id="deck">
  <!-- 0 · capa -->
  <section class="step cur" data-name="Início">
    <div class="cover"><img src="img/pronto-sala.jpg" fetchpriority="high" alt="Sala e jantar integrados, com piso de ipê"><div class="veil"></div></div>
    <div class="coverBox">
      <span class="kicker">Luxemburgo · Belo Horizonte</span>
      <h1>Apto <em>Luxemburgo</em></h1>
      <p>Reformado, com o piso de ipê original restaurado e sol da manhã. A 600 metros do Parque Tom Jobim.</p>
      <ul class="chips"><li class="lg dark">120 m²</li><li class="lg dark">3 quartos, 1 suíte</li><li class="lg dark">3 banheiros</li><li class="lg dark">2 vagas</li></ul>
      <button class="start press" id="startBtn">Começar a visita<svg class="i"><use href="#i-r"/></svg></button>
    </div>
  </section>
</div>

<header id="top" style="opacity:0;pointer-events:none">
  <button class="name lg press" id="homeBtn" aria-label="Voltar ao início">Apto Luxemburgo</button>
  <button class="idx lg press" id="idxBtn" aria-label="Índice"><svg class="i"><use href="#i-list"/></svg><b id="stepNo">1/9</b></button>
</header>

<nav id="nav" class="lg off" aria-label="Navegação da visita">
  <button id="prev" class="press" aria-label="Voltar"><svg class="i"><use href="#i-l"/></svg></button>
  <div id="bars"></div>
  <button id="next" class="press"><span id="nextTxt">Próximo</span><svg class="i"><use href="#i-r"/></svg></button>
</nav>

<div id="menuBg"></div>
<div id="menu" class="lg" role="dialog" aria-label="Índice da visita"><h3>Índice</h3><div id="menuList"></div></div>

<template id="tpl3d">
  <div class="maq">
    <div class="head"><span class="kicker">Maquete 3D</span><h2>Onde fica <em>cada coisa</em></h2><p>Arraste para girar. Toque num ambiente para ver a foto.</p></div>
    <div class="frame">
      <canvas id="c3d"></canvas>
      <div id="labels3d"></div>
      <div class="loading" id="loading">Montando a maquete…</div>
      <button class="fReset lg press" id="reset" hidden><svg class="i"><use href="#i-back"/></svg>Ver tudo</button>
      <div class="fTop lg" role="group" aria-label="Luz"><button class="press on" id="dia"><svg class="i"><use href="#i-sun"/></svg>Dia</button><button class="press" id="noite"><svg class="i"><use href="#i-moon"/></svg>Noite</button></div>
      <div class="hint3d lg" id="hint3d"><svg class="i"><use href="#i-rot"/></svg>Arraste para girar</div>
      <div class="card lg" id="card" aria-live="polite"><img id="cImg" alt=""><div class="t"><small id="cNo"></small><b id="cName"></b><span id="cTxt"></span></div><button class="x press" id="cX" aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button></div>
      <div class="zoom lg" id="zoomBox" hidden><button class="press" id="zIn" aria-label="Aproximar">+</button><button class="press" id="zOut" aria-label="Afastar">−</button></div>
    </div>
  </div>
</template>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script defer src="lux3d.js"></script>
<script src="brand.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const B = window.BRAND;

// ---------- as telas da visita ----------
const ROOMS = [
  ['pronto-sala','Sala e jantar','Integrados, sobre o assoalho de ipê restaurado. Duas janelas, sofá de linho e mesa para 8.'],
  ['pronto-cozinha','Cozinha','Bancada de pedra sob a janela, marcenaria clara e área de serviço ao fundo.'],
  ['pronto-suite','Suíte','O quarto que recebe o sol da manhã, com banheiro próprio.'],
  ['pronto-quarto','Quarto','Duas camas de solteiro e escrivaninha junto à janela. Há ainda um terceiro quarto.'],
  ['pronto-banheiro','Banheiros','Bancada de pedra, espelho iluminado e box de vidro. São três banheiros.']];
const STEPS = [{name:'Início', img:'pronto-sala'}];
const deck = $('deck');
function add(name, html, img, is3d){ const s=document.createElement('section'); s.className='step'; s.dataset.name=name; if (is3d) s.dataset.three='1'; s.innerHTML='<div class="inner">'+html+'</div>'; deck.appendChild(s); STEPS.push({name, img}); }
ROOMS.forEach(([f,n,t],i)=> add(n, `<div class="room"><div class="ph"><img src="img/${f}.jpg" alt="${n}" decoding="async"><span class="tag lg dark">${String(i+1).padStart(2,'0')} · Ambiente</span></div><div class="txt"><span class="kicker">${i+1} de ${ROOMS.length} ambientes</span><h2>${n}</h2><p>${t}</p></div></div>`, f));
const BA=[['sala','Sala de estar'],['estar','Estar e jantar'],['suite','Suíte'],['quarto','Quarto']];
add('Antes e depois', `<div class="ba"><div class="head"><span class="kicker">Antes e depois</span><h2>Vazio hoje, <em>pronto para morar</em></h2><p>Arraste a linha para comparar. As fotos são do apartamento vazio; a mobília foi gerada por IA.</p></div>
  <div class="stage"><div class="cmp" id="cmp" role="slider" aria-label="Comparar antes e depois" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0">
    <img id="baA" src="img/antes-sala.jpg" alt="Antes: Sala de estar, sem móveis" decoding="async"><img class="dep" id="baD" src="img/depois-sala.jpg" alt="Depois: Sala de estar, com mobília gerada por IA" decoding="async">
    <span class="lb a lg dark">Antes</span><span class="lb d lg dark">Depois · IA</span>
    <div class="hnd"><i class="lg"><svg class="i"><use href="#i-l"/></svg><svg class="i"><use href="#i-r"/></svg></i></div></div></div>
  <div class="seg lg" id="baSeg" role="group" aria-label="Ambiente">${BA.map(([k,n],i)=>`<button class="press${i?'':' on'}" data-k="${k}" data-n="${n}">${n}</button>`).join('')}</div></div>`, 'depois-sala');
add('A planta', `<div class="plan"><div><span class="kicker">A planta</span><h2>120 m² <em>bem divididos</em></h2></div><div class="img"><img src="img/planta.jpg" alt="Planta humanizada do apartamento" decoding="async"></div><ul class="nums"><li><b>3</b><span>quartos</span></li><li><b>1</b><span>suíte</span></li><li><b>3</b><span>banheiros</span></li><li><b>2</b><span>vagas</span></li></ul></div>`, 'planta');
add('Maquete 3D', $('tpl3d').innerHTML, '', true);
add('O bairro', `<div class="nb"><div class="img"><img src="img/parque.jpg" alt="Parque Mosteiro Tom Jobim" decoding="async"></div><div><span class="kicker">O bairro</span><h2>Rua quieta, <em>cidade perto</em></h2><ul class="dist"><li><b>600 m</b><span>Parque Tom Jobim</span></li><li><b>até 1 km</b><span>Escolas, mercado e farmácia</span></li><li><b>5 min de carro</b><span>Contorno e Raja Gabaglia</span></li><li><b>15 min de carro</b><span>Savassi e Centro</span></li></ul></div></div>`, 'parque');
add('Visita', `<div class="visit"><span class="kicker">Para terminar</span><h2>Agende <em>uma visita</em></h2>
  <div class="rows"><div class="row"><span>Área privativa</span><b>120 m²</b></div><div class="row"><span>Quartos</span><b>3, sendo 1 suíte</b></div><div class="row"><span>Banheiros</span><b>3</b></div><div class="row"><span>Vagas</span><b>2 cobertas</b></div><div class="row"><span>Andar</span><b>1º</b></div><div class="row"><span>Sol</span><b>Manhã (leste)</b></div><div class="row"><span>Piso</span><b>Ipê e tacos de madeira</b></div></div>
  <div class="contact"><b class="h">Valores sob consulta</b><p>Fale com quem enviou este link para combinar a visita.</p><div id="contactRows"></div><div class="btns" id="cBtns"><button class="pill line press" id="again">Rever do início</button></div></div>
  <p class="fine" id="fine">Fotos com decoração ilustrativa. No antes e depois, as fotos são do imóvel vazio e a mobília foi gerada por inteligência artificial. Maquete 3D e planta ilustrativas. Informações sujeitas a confirmação documental e alteração sem aviso prévio.</p></div>`, '');

const steps=[...deck.children]; let cur=0;
$('bars').innerHTML = steps.slice(1).map(()=>'<i></i>').join('');
$('menuList').innerHTML = STEPS.map((s,i)=>`<button class="press" data-i="${i}"><em>${i?String(i).padStart(2,'0'):''}</em>${s.name}${s.img?`<img src="img/${s.img}.jpg" alt="" loading="lazy">`:''}</button>`).join('');

function go(i){ i=Math.max(0,Math.min(steps.length-1,i)); if (i===cur) return; steps.forEach((s,k)=>{ s.classList.toggle('cur',k===i); s.classList.toggle('past',k<i); }); cur=i; ui(); if (steps[i].dataset.three) start3d(); if (steps[i].querySelector('.cmp')) baSweep(); }
function ui(){ const first=cur===0, last=cur===steps.length-1;
  $('nav').classList.toggle('off', first); const t=$('top'); t.style.opacity=first?0:1; t.style.pointerEvents=first?'none':'auto';
  $('stepNo').textContent=cur+'/'+(steps.length-1); [...$('bars').children].forEach((b,k)=>b.classList.toggle('done',k<cur));
  $('prev').disabled=first; $('nextTxt').textContent = last ? 'Rever do início' : 'Próximo: '+STEPS[cur+1].name;
  [...$('menuList').children].forEach((b,k)=>b.classList.toggle('cur',k===cur)); }
$('startBtn').onclick=()=>go(1); $('prev').onclick=()=>go(cur-1); $('next').onclick=()=> cur===steps.length-1 ? go(0) : go(cur+1);
$('homeBtn').onclick=()=>go(0);
const menuOpen=v=>{ $('menu').classList.toggle('on',v); $('menuBg').classList.toggle('on',v); };
$('idxBtn').onclick=()=>menuOpen(true); $('menuBg').onclick=()=>menuOpen(false);
$('menuList').querySelectorAll('button').forEach(b=> b.onclick=()=>{ menuOpen(false); go(+b.dataset.i); });
document.addEventListener('click',e=>{ if (e.target.id==='again') go(0); });
addEventListener('keydown',e=>{ if ($('menu').classList.contains('on')){ if (e.key==='Escape') menuOpen(false); return; } if (e.key==='ArrowRight'){ e.preventDefault(); if (cur<steps.length-1) go(cur+1); } if (e.key==='ArrowLeft') go(cur-1); });
// deslizar para o lado troca de tela (menos na maquete, onde o dedo gira o 3D)
let sx=null, sy=0, st=0;
deck.addEventListener('touchstart',e=>{ if (steps[cur].dataset.three || cur===0 || e.target.closest('.cmp')) { sx=null; return; } const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); },{passive:true});
deck.addEventListener('touchend',e=>{ if (sx===null) return; const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null; if (Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4 && Date.now()-st<600) go(cur+(dx<0?1:-1)); },{passive:true});
ui();

// ---------- antes e depois ----------
const cmp=$('cmp'); let baP=50;
const setP=(v,anim)=>{ baP=Math.max(0,Math.min(100,v)); cmp.classList.toggle('anim',!!anim); cmp.style.setProperty('--p',baP+'%'); cmp.setAttribute('aria-valuenow',Math.round(baP)); };
function baSweep(){ setP(100,false); requestAnimationFrame(()=>requestAnimationFrame(()=>setP(50,true))); }
let baDrag=false;
const baAt=e=>{ const r=cmp.getBoundingClientRect(); setP((e.clientX-r.left)/r.width*100,false); };
cmp.addEventListener('pointerdown',e=>{ baDrag=true; cmp.setPointerCapture(e.pointerId); baAt(e); });
cmp.addEventListener('pointermove',e=>{ if (baDrag) baAt(e); });
['pointerup','pointercancel'].forEach(t=>cmp.addEventListener(t,()=>{ baDrag=false; }));
cmp.addEventListener('keydown',e=>{ if (e.key==='ArrowLeft'||e.key==='ArrowRight'){ e.preventDefault(); e.stopPropagation(); setP(baP+(e.key==='ArrowLeft'?-10:10),true); } });
BA.forEach(([k])=>{ new Image().src='img/antes-'+k+'.jpg'; new Image().src='img/depois-'+k+'.jpg'; });
$('baSeg').querySelectorAll('button').forEach(b=> b.onclick=()=>{ $('baSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  const k=b.dataset.k, n=b.dataset.n; $('baA').src='img/antes-'+k+'.jpg'; $('baA').alt='Antes: '+n+', sem móveis'; $('baD').src='img/depois-'+k+'.jpg'; $('baD').alt='Depois: '+n+', com mobília gerada por IA'; baSweep(); });

// ---------- maquete 3D ----------
function start3d(){ const tryBoot=()=>{ if (window.Lux3DBoot && window.THREE){ window.Lux3DBoot(); } else setTimeout(tryBoot,120); }; setTimeout(tryBoot,350); }
function wire3d(){ const L=window.Lux3D; if (!L || wire3d.done) return; wire3d.done=true;
  $('loading').style.opacity=0; setTimeout(()=>{ const l=$('loading'); if (l) l.remove(); },500); $('zoomBox').hidden=false;
  setTimeout(()=>{ $('hint3d').style.opacity=0; },3500);
  L.on('room', r=>{ const c=$('card'); $('reset').hidden=!r; $('zoomBox').style.opacity=r?0:1; $('hint3d').style.opacity=0; if (!r){ c.classList.remove('show'); return; }
    $('cNo').textContent=r.no+' · Ambiente'; $('cName').textContent=r.n; $('cTxt').textContent=r.t; const im=$('cImg'); im.hidden=!r.photo; if (r.photo) im.src=r.photo; c.classList.add('show'); });
  $('cImg').onclick=()=>{ const k=STEPS.findIndex(s=>s.name===$('cName').textContent); if (k>0) go(k); };
  $('cX').onclick=()=>L.reset(); $('reset').onclick=()=>L.reset();
  $('zIn').onclick=()=>L.zoom(.8); $('zOut').onclick=()=>L.zoom(1.25);
  const setLight=n=>{ L.setHour(n?20:9); $('dia').classList.toggle('on',!n); $('noite').classList.toggle('on',n); };
  $('dia').onclick=()=>setLight(false); $('noite').onclick=()=>setLight(true); }
addEventListener('lux3d-ready',wire3d);
setTimeout(()=>{ if (!window.THREE){ const l=$('loading'); if (l) l.textContent='A maquete 3D não abriu neste aparelho. As fotos e a planta estão nas outras telas.'; } },8000);

// ---------- contato: só aparece quando o arquivo brand.js existe ----------
if (B){ $('contactRows').innerHTML=[['Corretor',B.corretor],['CRECI',B.creci],['Site',B.site],['Instagram',B.instagram]].filter(r=>r[1]).map(r=>`<div class="crow"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
  if (B.whatsapp) $('cBtns').insertAdjacentHTML('afterbegin',`<a class="pill ipe press" href="https://wa.me/${B.whatsapp.replace(/\D/g,'')}" target="_blank" rel="noopener">Agendar pelo WhatsApp</a>`);
  $('fine').textContent += ' Intermediação: '+B.corretor+' · '+B.creci+' · '+B.name+'.'; }
})();
</script>
</body>
</html>
